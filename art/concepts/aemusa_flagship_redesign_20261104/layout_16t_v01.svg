<text x="1130" y="177" fill="#69c1cc" font-size="22">硬性要求</text>
<text x="1130" y="211" fill="#e0e6e9" font-size="18">至少16个真正的T槽</text>
<text x="1130" y="245" fill="#a8b5c0" font-size="18">图中T01—T16均为独立位置。</text>
<text x="1130" y="304" fill="#69c1cc" font-size="22">当前草案</text>
<text x="1130" y="338" fill="#e0e6e9" font-size="18">A／B：上层火力组</text>
<text x="1130" y="372" fill="#e0e6e9" font-size="18">C／D：前置下层火力组</text>
<text x="1130" y="406" fill="#a8b5c0" font-size="18">上下错层，为前向发射留空间。</text>
<text x="1130" y="465" fill="#69c1cc" font-size="22">整舰组织</text>
<text x="1130" y="499" fill="#e0e6e9" font-size="18">主脊分岔 → 保留空腔 → 汇合</text>
<text x="1130" y="533" fill="#a8b5c0" font-size="18">命运接口进入舰体主结构。</text>
<text x="1130" y="567" fill="#a8b5c0" font-size="18">每组后方配供能、火控和维护体量。</text>
<text x="1130" y="626" fill="#d39a55" font-size="22">实际实现待做</text>
<text x="1130" y="660" fill="#e0e6e9" font-size="18">原生规格：size = titanic</text>
<text x="1130" y="694" fill="#a8b5c0" font-size="18">独立舰种还需可用的T级武器组件。</text>
<text x="1130" y="728" fill="#a8b5c0" font-size="18">当前游戏仍使用旧六L技术样品。</text>
<text x="60" y="944" fill="#a8b5c0" font-size="17">正式外观、分段数量、武器种类与数值待收敛；当前坐标仅供方案讨论。2D投影不证明3D射界或无遮挡。</text>
