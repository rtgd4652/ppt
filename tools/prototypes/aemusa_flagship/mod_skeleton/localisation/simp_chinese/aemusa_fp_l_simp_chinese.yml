 situation_aemusa_fp_flagship_status_type: "旗舰生命周期验证"
 situation_aemusa_fp_flagship_status_desc_active: "账本状态：旗舰处于活动状态。"
 situation_aemusa_fp_flagship_status_desc_deployed: "账本状态：旗舰处于部署锁定测试。"
 situation_aemusa_fp_flagship_status_desc_reconstructing: "账本状态：旗舰正在首都星系重构。"
 situation_aemusa_fp_flagship_status_desc_duplicate: "账本状态：检测到重复实例，需要人工审计。"
 situation_aemusa_fp_flagship_status_desc_missing: "账本状态：未检测到有效实例或设计生成失败。"
 situation_aemusa_fp_flagship_status_monthly_change_tooltip: "本局势只显示状态，不推进进度，也不生成任何对象。"
 aemusa_fp_stage_status: "状态监测"
 aemusa_fp_stage_status_desc: "进度条固定，仅作为隔离原型的状态容器。"
 aemusa_fp_approach_observe: "只读监测"
 aemusa_fp_approach_observe_desc: "不改变生命周期，只显示由事件账本写入的状态。"
 aemusa_fp_approach_observe_effect: "该方案仅用于显示状态，不执行任何生命周期效果。"
