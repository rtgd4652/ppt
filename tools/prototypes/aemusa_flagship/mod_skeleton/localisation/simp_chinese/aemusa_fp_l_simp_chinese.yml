 aemusa_fp.1.name: "爱缪莎旗舰隔离原型"
 aemusa_fp.1.desc: "该入口只启用一套独立技术原型，用于验证可编辑设计、双光环、跃迁、唯一实例与摧毁后恢复。它不代表正式舰名、美术、数值或剧情已经批准。"
 aemusa_fp.1.a: "开始隔离验证。"
 aemusa_fp.10.name: "旗舰生命周期审计"
 aemusa_fp.10.desc_ok: "审计结果：恰有一艘带唯一标记的有效旗舰，账本一致。"
 aemusa_fp.10.desc_duplicate: "审计结果：发现多个带唯一标记的旗舰实例。原型不会自动删除它们，以便保留故障现场。"
 aemusa_fp.10.desc_missing: "审计结果：没有发现带唯一标记的有效旗舰。请检查设计生成或恢复事件。"
 aemusa_fp.10.recover: "继续既有事务，在首都恢复缺失旗舰。"
 aemusa_fp.11.name: "旗舰身份恢复"
 aemusa_fp.11.desc_ok: "恢复结果：现有旗舰已获得唯一身份标记，生命周期账本已经一致。"
 aemusa_fp.11.desc_failed: "恢复结果：未能确定唯一合法旗舰。故障现场已保留，请检查 error.log 与编队数量。"
 aemusa_fp.12.name: "解除旧版部署禁用"
 aemusa_fp.12.desc: "已解除原型旗舰的旧版引擎禁用状态，并清除部署锁定修正。本事件不会生成新舰。"
 aemusa_fp.20.name: "旗舰故障注入"
 aemusa_fp.20.desc: "以下操作仅用于隔离测试。每次操作后都应检查国家局势、舰队数量与 error.log。"
 aemusa_fp.20.destroy: "登记损毁事务并摧毁实例，验证自动重构。"
 aemusa_fp.20.silent_delete: "静默删除舰队，验证无回调异常审计。"
 aemusa_fp.20.duplicate: "绕过唯一性检查，注入重复实例。"
 aemusa_fp.20.deploy: "模拟非隐藏部署锁定。"
 aemusa_fp.20.recall: "解除部署锁定。"
 aemusa_fp.close: "关闭。"

