l_simp_chinese:
 auth_artifact_central_court:0 "中央庭公共协调"
 auth_artifact_central_court_desc:0 "元首负责公共方向与最终责任，中央庭机构组织治理、研究和防卫，指挥使决定并承担实际行动。元首持续任职，职务不世袭。"
 gov_artifact_central_court:0 "中央庭公共协调体制"
 gov_artifact_central_court_desc:0 "以公共责任、机构协作和灾后重建为基础的中央庭制度。神器使能力为文明争取余地，不能代替共同决策。"
 RT_ARTIFACT_COURT_HEAD:0 "中央庭元首"
 cc_antoniva_name:0 "安托涅瓦"
 cc_yanhua_name:0 "晏华"
 cc_antoniva_background:0 "中央庭国家元首与神器使。以诺亚方舟控制有限时空通路、建立庇护并隔离敌方力量；文明的治理和实际行动仍需要机构与指挥使共同承担。"
 cc_yanhua_background:0 "中央庭战略与情报顾问。以行政资料、实际接触和军事情报核验一个对象，再把结论交给指挥使选择。行政与指挥职责共享同一份研判记录。"
 leader_trait_cc_antoniva_identity:0 "方舟的守护者"
 leader_trait_cc_antoniva_identity_desc:0 "中央庭元首，负责方舟时空支配。通过殖民地决议与白夜馆选择有限目标，三种用途共享冷却。"
 leader_trait_cc_yanhua_identity:0 "态势研判"
 leader_trait_cc_yanhua_identity_desc:0 "针对一个已接触对象核验军事情报。行政官整理证据，指挥官可执行已经形成的反制；职业切换保留研判。"
 cc_ark_shelter:0 "方舟庇护"
 cc_ark_shelter_desc:0 "有限隔离空间缓冲轨道轰炸，不能保证殖民地不失守或撤销已经发生的损失。"
 cc_yanhua_internal_preparation:0 "中央庭内部准备"
 cc_yanhua_internal_preparation_desc:0 "根据已核验的态势结论，在首都协调秩序与应对准备。"
 cc_yanhua_fleet_counter:0 "态势反制训练"
 cc_yanhua_fleet_counter_desc:0 "这支舰队已经执行一轮有期限的反制训练；领袖改任不会将训练复制给其他舰队。"
 decision_cc_ark_calibrate:0 "校准方舟通路"
 decision_cc_ark_calibrate_desc:0 "把这颗受控殖民地指定为方舟穿界目的地，随后在白夜馆确认一支己方行动舰队。确认舰队后支付500能源、100合金，校准60日；三种方舟用途共享360日冷却。"
 decision_cc_ark_shelter:0 "建立方舟庇护"
 decision_cc_ark_shelter_desc:0 "支付500能源、100合金，为本殖民地提供360日的轨道轰炸伤害降低35%。不能防止占领、星球毁灭或恢复已发生的损失；与穿界、放逐共享360日冷却。"
 cc.open_court:0 "中央庭人员与国事"
 cc.back:0 "返回上一页。"
 cc.close:0 "暂时结束通讯。"
 cc.install:0 "接入中央庭制度与元首。"
 cc.install_confirm:0 "确认公共协调体制与安托涅瓦元首职务。"
 cc.antoniva:0 "联络安托涅瓦。"
 cc.yanhua:0 "联络晏华。"
 cc.recruit_yanhua:0 "邀请晏华承担战略顾问职责。"
 cc.recruit_confirm:0 "投入500凝聚力与200能源，确认接入晏华。"
 cc.ark:0 "安排方舟部署。"
 cc.to_commander:0 "改任指挥官，保留研判记录。"
 cc.to_official:0 "改任行政官，保留研判记录。"
 cc.assessment:0 "查看态势研判。"
 cc.warp:0 "准备战略穿界。"
 cc.exile:0 "寻找可临时放逐的敌方舰队。"
 cc.pick_force:0 "选择一支行动舰队。"
 cc.pick_force_again:0 "重新选择行动舰队。"
 cc.warp_start:0 "投入500能源与100合金，开始60日校准。"
 cc.exile_confirm:0 "投入750能源与150合金，临时放逐90日。"
 cc.exile_again:0 "返回重新选择放逐目标。"
 cc.pick_assessment:0 "选择一个已接触的研判对象。"
 cc.pick_assessment_again:0 "返回重新选择研判对象。"
 cc.analysis_start:0 "投入250能源与250凝聚力，开始核验。"
 cc.show_conclusion:0 "查看本轮结论与对策。"
 cc.prepare_capital:0 "协调首都准备：180日稳定度提高5。"
 cc.military_counter:0 "由晏华所带舰队执行180日反制训练。"
 cc.1.title:0 "中央庭人员与国事"
 cc.1.desc:0 "安托涅瓦承担元首责任，晏华提供现实判断，指挥使决定实际行动。\n\n人物和机构共同承担工作；方舟与研判各自保留使用限制。"
 cc.2.title:0 "中央庭的公共责任"
 cc.2.desc:0 "这次接入将采用中央庭公共协调体制，由安托涅瓦担任元首，国民理念调整为行政协调与功能建筑。其他已有领袖、设施、资源和爱缪莎主线继续保留。\n\n指挥使仍决定实际行动，神器使能力不会取代机构或共同决策。确认后本次接入完成，不重复生成安托涅瓦。"
 cc.10.title:0 "安托涅瓦：文明仍须共同前行"
 cc.10.desc:0 "“指挥使，方舟能为一个现场争取余地，但余地之后的工作仍要由我们共同完成。”\n\n安托涅瓦保留中央庭元首职责，方舟由她协调部署到指定殖民地或行动力量。三种用途共享一轮冷却，不能同时无限发动。"
 cc.20.title:0 "晏华的战略顾问职责"
 cc.20.desc:0 "晏华将以行政官身份接入中央庭，整理现实资料、核验风险并提出行动方案；需要时可以改任指挥官。\n\n投入500凝聚力与200能源完成接入。邀请只有一次；离队或死亡不会开放重复招募。"
 cc.21.title:0 "晏华：先核对可以知道的事"
 cc.21.desc:0 "“判断可以被现实修正。先确定我们知道什么，再谈采取哪一种行动。”\n\n行政官负责核验已接触对象；指挥官可以执行已经形成的军事结论。改任会离开原岗位，请重新任命需要的职务，研判对象和记录继续保留。"
 cc.30.title:0 "方舟部署"
 cc.30.desc:0 "战略穿界需要在目标殖民地登记通路，再选择一支行动舰队。方舟庇护直接从殖民地决议发动。临时放逐仅针对本国疆域内已观测的普通敌方小型舰队。\n\n三种用途共享360日冷却；元首或目标不可用时，不能开始新的部署。"
 cc.40.title:0 "战略穿界准备"
 cc.40.desc:0 "请先在目的地殖民地决议中选择“校准方舟通路”，再确认一支己方军用舰队。\n\n开始后消耗500能源与100合金，校准60日。交战期间暂停传送，控制权或目标失效则中止；已经投入的成本不重复退还。"
 cc.41.title:0 "确认行动力量"
 cc.41.desc:0 "当前行动舰队：§Y[cc_ark_force.GetName]§!。\n\n确认前可以重新选择。目的地须先通过殖民地决议登记；选择本身不收费，开始校准时才投入500能源与100合金。"
 cc.41.none:0 "目前没有符合条件的己方移动军用舰队。租借或正在交战的舰队不能开始这次穿界。请准备行动力量后再联络。"
 cc.42.title:0 "通路校准与等待"
 cc.42.desc:0 "已投入的行动由现场继续校准。60日后，在下一次月度核对传送仍受本国控制、没有交战的舰队；若交战则继续等待。\n\n共享冷却已经开始，重开通讯不会重复付费或排队。"
 cc.43.title:0 "有限的临时放逐"
 cc.43.desc:0 "当前候选舰队：§Y[cc_ark_exile_target.GetName]§!。\n\n必须仍处于本国疆域与传感器范围内，所属普通国家与本国交战，实力不超过5000。确认后支付750能源、150合金，将其暂时移出现场90日，随后由原有者接回；本轮共享冷却360日。"
 cc.43.none:0 "当前没有符合条件的敌方舰队。目标必须来自已接触的普通交战国家，处于本国疆域和传感器范围内，且是实力不超过5000的移动军用舰队。特殊国家与空间站不适用。"
 cc.44.title:0 "穿界已经完成"
 cc.44.desc:0 "指定行动舰队已经抵达校准目的地。原有舰船、舰队与人物仍然保留，接下来的防卫或行动由指挥使安排。\n\n这次穿界没有撤销已有损失，也没有授予全帝国传送网络。"
 cc.45.title:0 "现场获得暂时余地"
 cc.45.desc:0 "目标舰队暂时离开当前现场，将在90日后由原有者接回。现场其他敌人和战斗仍需实际处理。\n\n方舟进入本轮共享冷却。"
 cc.50.title:0 "态势研判记录"
 cc.50.desc:0 "每轮只核验一个已接触的普通外部国家。投入250能源与250凝聚力后，晏华以行政官身份，在军事情报达到二级时完成三个有效月度核验。\n\n情报不足或改任指挥官时暂停；对象或人物离队则中止。结论保留180日，执行后再次研判须等待180日冷却。"
 cc.50.collecting:0 "研判对象：§Y[cc_analysis_target.GetName]§!。\n已完成核验：§Y[Root.cc_analysis_progress]§!／3。\n\n需要晏华保持行政官职责与对象军事情报二级。情报不足或改任指挥官时保留记录并暂停，不把等待写成新的证据。"
 cc.50.ready:0 "本轮结论已经形成，保留180日。可以选择首都内部准备，或先让晏华改任指挥官并任命到军用舰队，再执行反制训练。\n\n每轮仅选择一种对策。"
 cc.52.title:0 "确认研判对象"
 cc.52.desc:0 "当前对象：§Y[cc_analysis_candidate.GetName]§!。\n\n已接触只代表可以立项，后续仍须实际军事情报达到二级；不足时保留投入与记录，暂停核验。确认投入250能源与250凝聚力后，开始本轮工作。"
 cc.52.none:0 "尚无可确认的已接触普通外部国家。建立实际通讯后，再选择研判对象；不会为这次查看扣费。"
 cc.51.title:0 "结论之后由谁行动"
 cc.51.desc:0 "晏华完成了本轮资料核验，结论并不等于全知，也不会替指挥使决定战争。\n\n可以协调首都内部准备（180日稳定度提高5），或由已担任舰队指挥官的晏华执行反制训练（所带舰队180日追踪提高10、武器射程提高10%）。只能选择一项；结论与目标须仍然有效。"
 cc.53.title:0 "本轮对策已经执行"
 cc.53.desc:0 "本轮结论已经用于一次实际对策，新的研判须等待180日冷却。\n\n原舰队已经形成的训练继续到既定期限；人物改任不会把它复制到另一支舰队。"
