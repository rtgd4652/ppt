l_simp_chinese:
 tech_artifact_limited_field_suppression:0 "有限场域压制"
 tech_artifact_limited_field_suppression_desc:0 "从黑门研究的风险观测中，中央庭学会辨认边界扰动留下的可测征兆。舰用团队将这些记录与稳定场试验结合，把扰动限制在短暂的作战窗口：让敌舰难以维持射控和推进节奏，为常规舰队争取行动时间。\n\n§Y应用：§!开放中庭级专用场域压制模块。装入A槽后，可付费启动一次本星系压制，影响当时在场的敌方作战舰；效果有时限，全帝国共用冷却。中庭级与承载定型仍须分别取得，研究本身不发放舰船。"
 ARTIFACT_FIELD_SUPPRESSOR:0 "边界扰动压制器"
 ARTIFACT_FIELD_SUPPRESSOR_DESC:0 "中庭级专用A槽模块。提供“启动有限场域压制”舰队行动；每次消耗1500能源和25稀有水晶，使启动时本星系内敌方作战舰的射速降低15%、亚光速速度降低20%，持续60天。全帝国共享180天冷却。\n\n隐形、失能、民用舰和星港不受影响。已命中舰船离开星系仍保留剩余效果，后来进入的舰船不受影响；重复安装不增加次数。"
 artifact_field_suppression:0 "启动有限场域压制"
 artifact_field_suppression_tooltip:0 "§H启动有限场域压制§!\n消耗§Y1500§!£energy£能源和§Y25§!£rare_crystals£稀有水晶。对启动时本星系内的敌方作战舰施加§Y60天§!压制：射速§R−15%§!、亚光速速度§R−20%§!。全帝国共用§Y180天§!冷却。\n\n不影响隐形、失能、民用舰和星港；已受同种压制的舰船不叠加或续期。离开星系后保留剩余效果，后到舰船不补算。"
 artifact_field_suppression_activity:0 "释放边界扰动脉冲"
 artifact_field_suppression_requires_platform:0 "需要已归档承载定型、相关研究及冷却完成；舰队须由本国拥有和控制，处于星系内、未隐形或失能，并有可用的中庭级压制模块。"
 artifact_field_suppression_requires_target:0 "当前星系需要至少一艘尚未受本压制影响的敌方作战舰；隐形、失能、民用舰和星港不计入。"
 afs_recharging:0 "场域压制装置重整"
 afs_recharging_desc:0 "全帝国的场域压制行动共用本冷却。舰队分合、换用其他中庭级或重复装配均不缩短等待时间。"
 afs_suppressed:0 "边界扰动压制"
 afs_suppressed_desc:0 "射控和推进节奏受到短时干扰。离开原星系或变更编队后，效果仍持续到本舰计时结束；后续同类压制不叠加或续期。"
