l_simp_chinese:
 tech_artifact_joint_combat_core:0 "联合作战核心"
 tech_artifact_joint_combat_core_desc:0 "舰队中的不同舰体承担不同距离和节奏的任务。按职责配置的作战核心协调各自的接敌方式与火力安排。\n\n§H应用§!：解锁七种职责作战电脑，以及战术和支援辅助模块；按舰体与用途选择配置。"
 tech_artifact_expedition_reconstitution:0 "远征整补体系"
 tech_artifact_expedition_reconstitution_desc:0 "联运接收地把物资、训练与人员补充安排在同一流程中。前线需要的后备力量能够在持续供应下做好准备。\n\n§H应用§!：接收端可投入预留物资、能源和消费品，开启限期训练支援，提高当地新军训练速度与初始经验。"
 ARTIFACT_JOINT_COMPUTER_SWARM:0 "联合蜂群电脑"
 ARTIFACT_JOINT_COMPUTER_SWARM_DESC:0 "适用于近程蜂群职责，侧重规避与持续开火。舰船依照蜂群队形接敌。"
 ARTIFACT_JOINT_COMPUTER_PICKET:0 "联合警戒电脑"
 ARTIFACT_JOINT_COMPUTER_PICKET_DESC:0 "侧重跟踪近距离威胁，采用警戒队形保护作战空间。"
 ARTIFACT_JOINT_COMPUTER_LINE:0 "联合线列电脑"
 ARTIFACT_JOINT_COMPUTER_LINE_DESC:0 "协调中距离齐射，提高命中和开火效率，采用线列队形。"
 ARTIFACT_JOINT_COMPUTER_ARTILLERY:0 "联合炮击电脑"
 ARTIFACT_JOINT_COMPUTER_ARTILLERY_DESC:0 "优先维持远距离炮击，为更大的武器射程让出部分射速与供能预算。"
 ARTIFACT_JOINT_COMPUTER_CARRIER:0 "联合航母电脑"
 ARTIFACT_JOINT_COMPUTER_CARRIER_DESC:0 "采用航母队形，扩大开始交战的距离并加强母舰护盾；交战距离提升不会延长普通舰炮的射程。"
 ARTIFACT_JOINT_COMPUTER_TORPEDO:0 "联合突击电脑"
 ARTIFACT_JOINT_COMPUTER_TORPEDO_DESC:0 "采用鱼雷突击队形，强化爆炸武器与持续投射。需要适合突击职责的舰体和武器配置。"
 ARTIFACT_JOINT_COMPUTER_PLATFORM:0 "联合平台电脑"
 ARTIFACT_JOINT_COMPUTER_PLATFORM_DESC:0 "适用于固定防御平台，在射速、跟踪和射程之间分配资源，不为平台提供机动行为。"
 ARTIFACT_TACTICAL_COORDINATION_MODULE:0 "战术协同模块"
 ARTIFACT_TACTICAL_COORDINATION_MODULE_DESC:0 "占用一个辅助槽，提高本舰跟踪与射速。可以与作战电脑配合，但不会改变队形或增益整支舰队。"
 ARTIFACT_SUPPORT_COORDINATION_MODULE:0 "支援协同模块"
 ARTIFACT_SUPPORT_COORDINATION_MODULE_DESC:0 "占用一个辅助槽，提高本舰脱离战斗的机会并缩短超空间充能时间。它不提供舰体修复、资源返还或额外跃迁能力。"
 decision_artifact_civil_expedition:0 "联运：远征整补"
 decision_artifact_civil_expedition_desc:0 "在接收端消耗§Y一份预留物资、500能源、200消费品§!，建立§Y360日§!训练支援。有效期内当地陆军建造速度§G+25%§!、新军初始经验§G+50§!。费用不返还，不能提前续期。"
 acs_offer_expedition:0 "消耗当地§Y一份预留物资、500能源、200消费品§!，获得§Y360日§!整补安排。配给仓和联运站正常运作且接收端保持控制时，当地陆军建造速度§G+25%§!、新军初始经验§G+50§!。仍须正常支付并招募陆军，不修复现有部队。"
 acs_require_can_expedition:0 "需要本国控制、未遭轰炸的已登记联运接收端，正常运作的配给仓与联运站、一份当地预留物资、500能源和200消费品，且当前没有尚未到期的整补安排。"
 acs_expedition_reconstitution:0 "远征整补安排"
 acs_expedition_reconstitution_desc:0 "本期训练支援已经支付。作为正常运作的联运接收端时，当地陆军建造速度§G+25%§!、新军初始经验§G+50§!。失控、遭轰炸、设施停用或撤销登记时暂停收益，剩余期限仍会减少；恢复条件后可使用余下时间。转让殖民地时终止，费用不返还。"
