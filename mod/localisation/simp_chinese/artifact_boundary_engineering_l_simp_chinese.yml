l_simp_chinese:
 tech_artifact_controlled_boundary_experiments:0 "受控边界实验"
 tech_artifact_controlled_boundary_experiments_desc:0 "研究者开始主动设置异常的发生条件，在有限场地内建立边界、测量响应，再将现场恢复到原有基准。恢复本身也是实验必须回答的问题。\n\n§H应用§!：样本库可升级为受控边界实验室。通过行星决议付费完成准备、实验和恢复，取得可提交的实验记录。"
 tech_artifact_stable_rule_interface:0 "边界稳定理论"
 tech_artifact_stable_rule_interface_desc:0 "完整的实验记录揭示了异常边界维持与衰减的条件。把这些条件写成可重复验证的规则，工程设施便有了采用同一方法的基础。\n\n§H应用§!：在有效实验室提交完整边界实验记录，形成供本国锚定试验场使用的稳定规则接口。"
 tech_artifact_rule_anchoring_engineering:0 "规则锚定工程"
 tech_artifact_rule_anchoring_engineering_desc:0 "经验证的边界条件被部署到公共设施，并在持续供能下短时维持。实验室中的稳定方法由此成为保护殖民地的工程能力。\n\n§H应用§!：取得稳定规则接口记录后，可在轰炸开始前，于规则锚定试验场付费部署360日当地防护，减轻轨道轰炸伤害。"
 building_artifact_controlled_boundary_lab:0 "受控边界实验室"
 building_artifact_controlled_boundary_lab_desc:0 "由异常样本保管库升级而来。实验设备允许研究者主动建立有限边界，再测量并恢复现场。保留原样本分析能力；新的三阶段实验由行星决议启动。"
 building_artifact_rule_anchor_test_site:0 "规则锚定试验场"
 building_artifact_rule_anchor_test_site_desc:0 "把经过复核的边界接口部署到公共设施。取得本国稳定接口记录后，可付费开启360日的当地防护，轨道轰炸伤害−20%。建筑本身不提供常驻防护。"
 decision_artifact_foundation_boundary:0 "受控边界实验"
 decision_artifact_foundation_boundary_desc:0 "查看或启动当地边界实验：准备2次、实验3次、恢复1次有效月度。最终记录可提交为本国公共规则接口。"
 artifact_boundary.title:0 "为异常划定边界"
 artifact_boundary.intro:0 "实验室可以在有限场地内建立异常边界，测量其响应，再将场地恢复到基准状态。整个过程完成后，记录才具备公共工程价值。\n\n本国同时最多进行一项边界实验。项目占用当地公共项目名额；其他殖民地的样本分析与工坊工程照常进行。"
 artifact_boundary.start:0 "投入物资，开始三阶段实验"
 artifact_boundary.require_start:0 "需要有效受控边界实验室、受控边界实验科技、当地公共项目空闲、拥有与控制一致且未受轰炸，以及600能源、200消费品、100合金。本国不能同时进行另一项边界实验；已取得稳定接口记录后无需再做。"
 artifact_boundary.offer_start:0 "投入600能源、200消费品、100合金。完成准备2次、实验3次、恢复1次有效月度后取得720日实验记录。停用、占领或轰炸暂停工作；中止或失去殖民地不返还投入。"
 artifact_boundary.preparing:0 "§Y准备阶段§!\n准备：[Root.arf_r4_preparation|0]/2；实验：[Root.arf_r4_experiment|0]/3；恢复：[Root.arf_r4_recovery|0]/1。\n\n正在校准仪器、配置隔离边界。每个有效月度完成一份工作。"
 artifact_boundary.experimenting:0 "§Y实验阶段§!\n准备：[Root.arf_r4_preparation|0]/2；实验：[Root.arf_r4_experiment|0]/3；恢复：[Root.arf_r4_recovery|0]/1。\n\n边界已建立，研究者正在记录它对受控扰动的响应。恢复完成以前不能提交接口。"
 artifact_boundary.recovering:0 "§Y恢复阶段§!\n准备：[Root.arf_r4_preparation|0]/2；实验：[Root.arf_r4_experiment|0]/3；恢复：[Root.arf_r4_recovery|0]/1。\n\n测量已经结束，正在撤除实验条件并复核现场。还需一次有效月度。"
 artifact_boundary.paused:0 "§Y实验暂停§!\n准备：[Root.arf_r4_preparation|0]/2；实验：[Root.arf_r4_experiment|0]/3；恢复：[Root.arf_r4_recovery|0]/1。\n\n请恢复控制、结束轰炸，并使受控边界实验室和研究资格重新有效。已投入物资与完成工作保留。"
 artifact_boundary.result:0 "准备、实验与恢复均已完成。当地记录保留720日；拥有$tech_artifact_stable_rule_interface$科技后，可在有效实验室提交。\n\n提交将把方法保存在本国，并释放当地公共项目名额。无需重复实验即可在各公共试验场部署防护。"
 artifact_boundary.archive:0 "提交稳定规则接口"
 artifact_boundary.require_archive:0 "需要$tech_artifact_stable_rule_interface$科技、当地有效实验室、本国仍拥有并控制且无轰炸，以及完整且未过期的边界实验记录。本国尚未取得该接口，旧窗口所属国家须仍一致。"
 artifact_boundary.offer_archive:0 "归档本国永久公共接口，消耗这份当地记录并释放项目名额。此操作不收费；后续试验场防护仍需分别支付部署费用。"
 artifact_foundation_boundary_result:0 "完整边界实验记录"
 artifact_foundation_boundary_result_desc:0 "准备、实验和恢复均已完成。记录保留720日，在当地公共项目页面提交后可成为本国公共规则接口。"
 decision_artifact_rule_anchor:0 "公共锚定：部署防护"
 decision_artifact_rule_anchor_desc:0 "在本地规则锚定试验场部署360日防护。有效运行时轨道轰炸伤害−20%；每次部署消耗500能源、100稀有水晶。"
 artifact_rule_anchor.require:0 "需要本国已归档的稳定规则接口、规则锚定工程科技、当地有效试验场、拥有与控制一致且尚未受轰炸、500能源和100稀有水晶。现有部署期内不能续期。"
 artifact_rule_anchor.offer:0 "消耗500能源、100稀有水晶，开启360日当地防护：轨道轰炸伤害−20%。部署后受到轰炸仍有效；失控或设施停用时不提供收益，期限继续计时，恢复后使用剩余期限。失去殖民地清除部署，不退款。"
 acs_rule_anchor_window:0 "公共锚定部署期"
 acs_rule_anchor_window_desc:0 "有效规则锚定试验场在剩余期限内提供当地轨道轰炸伤害−20%。失控或设施失效时停止收益，但期限继续计时；不能提前叠加或续期。"
