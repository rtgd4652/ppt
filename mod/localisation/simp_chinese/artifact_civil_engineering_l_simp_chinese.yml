 tech_artifact_civil_engineering_coordination:0 "文明工程统筹"
 tech_artifact_civil_engineering_coordination_desc:0 "当城市工业开始支撑星际大型工程，建设计划也必须给居民服务、物资储备和运输调度留出位置。中央庭以命运都市统筹分散的采购与施工安排，使公共生活和远方工地能够共享一套可持续的工业计划。文明规模的动员，需要长期承担这些彼此相连的责任。\n\n§H应用§!：命运都市采用已付费的“工业协调”公共方案、完成180日调整并保持治理设施正常后，可统筹指定工程支出：跨星系备料交付300能源，营建装配750矿物／1200合金，试运行750能源／225消费品。费用按付款时条件核定；都市运行调整沿原费用，原有唯一都市限制保持。"
