 tech_artifact_civil_engineering_coordination:0 "文明工程统筹"
 tech_artifact_civil_engineering_coordination_desc:0 "一座命运都市既要维持市民的生活，也要承担面向整个文明的建设责任。中央庭让城市工业、物资联运与施工队共同安排采购和交接，把分散支出纳入可以核对的工程预算。\n\n§H应用§!：命运都市采用已付费的“工业协调”公共方案、完成180日调整并保持治理设施正常后，可统筹指定工程支出：跨星系备料交付300能源，营建装配750矿物／1200合金，试运行750能源／225消费品。费用按付款时条件核定；都市运行调整沿原费用，原有唯一都市限制保持。"
