l_simp_chinese:
 aemusa_ms.1310.start:0 "建立调查，保留休息与终止条件。"
 aemusa_ms.1310.title:0 "无法解释的偏差"
 aemusa_ms.1310.desc:0 "复盘结束后，晏华把尚未解释的偏差单独列成一卷。恢复承诺仍然有效，调查也不能靠继续消耗爱缪莎来换取速度。\n\n安托涅瓦准许设立独立调查：先核对异常是否存在，再讨论它意味着什么。爱缪莎的观测可以成为起点，但不能成为最后一份证据。现场载体与参照设施仍是研究职责，不是调查的通行证。"
 aemusa_ms.1310.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1320.samples:0 "扩大观测样本，同时保留基本防护。"
 aemusa_ms.1320.protection:0 "优先现实防护，同时维持独立取证。"
 aemusa_ms.1320.title:0 "少了几种可能"
 aemusa_ms.1320.desc:0 "“原本能成立的未来，正在变少。”爱缪莎把几组记录放在桌上，又将其中两处圈进误差栏。\n\n她没有说谁在挑选结局，也无法说明那些可能性去了哪里。晏华要求先排除疲劳、记录污染、欺骗、统计偏差和单一灾后余波。即使优先扩大样本，现实防护也不能停下；即使先保护居民，调查也不能只等她给出另一个答案。"
 aemusa_ms.1320.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1330.astronomy:0 "天文与设备记录：200 能量、100 矿物，30 天。"
 aemusa_ms.1330.laboratory:0 "神器研究与黑门对照：200 能量、100 矿物，30 天。"
 aemusa_ms.1330.risk:0 "常规风险与外部记录：200 能量、100 矿物，30 天。"
 aemusa_ms.1330.gather:0 "三路记录齐备，提交交叉审查。"
 aemusa_ms.1330.title:0 "三条彼此独立的记录"
 aemusa_ms.1330.desc:0 "晏华要求三组人员分别取证，不互相抄用爱缪莎的判断，也不把同一份资料换个名字算作新来源。\n\n每项调查投入 200 能量与 100 矿物，持续 30 天；人员和设备安排使同一时间只能推进一项。已完成来源将从待办中移除，原始样本、反例与失败解释全部保留。\n\n取证优先级已经记录。调查期间仍应维持基本防护，爱缪莎可以休息。"
 aemusa_ms.1330.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1332.record:0 "归档这份记录与反例，再看其余来源。"
 aemusa_ms.1332.title:0 "一条来源的回报"
 aemusa_ms.1332.astronomy:0 "对照不同设备、殖民地与空间站留存的时序，独立重复采样。共同偏差仍然存在，却没有覆盖全部样本。晏华保留了那些没有趋同的记录：设备误差不足以解释全部结果，也不能就此断言所有未来已经关闭。"
 aemusa_ms.1332.laboratory:0 "研究组分别复核神器样本与既有黑门材料，并隔离污染和共同来源。某些变化相似，另一些恰好相反。对照支持继续调查，却不支持把这次异常直接归为黑门，更不能由相似外观推出同源。"
 aemusa_ms.1332.risk:0 "常规模型组对照本国殖民地、舰队与空间站留存的记录，剔除已知战后连锁影响，并保留失败模型。剩余的风险仍异常趋向同类毁灭结果。没有获得授权的盟友资料保持空缺，没有凭空补入伤亡数字。"
 aemusa_ms.1332.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1335.title:0 "调查需要自己的时间"
 aemusa_ms.1335.desc:0 "调查组仍在按已确认的范围复核资料。重复打开通讯不会再投入一份资源，也不能替代剩余时间。\n\n本轮费用已经支出，回报到期后会送达；也可以之后再来白夜馆查看。既有防护、反例登记和休息安排继续有效。"
 aemusa_ms.1335.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1340.limited:0 "限期内部核验，向受影响者说明防护与申诉渠道。"
 aemusa_ms.1340.phased:0 "分阶段公开，每次更新都保留反例与更正。"
 aemusa_ms.1340.public:0 "尽早公开已核实风险，并持续接受质疑。"
 aemusa_ms.1340.title:0 "能公开到哪里"
 aemusa_ms.1340.desc:0 "三份来源在方法和记录链上互相独立，结论却出现交集：若干无关风险正异常趋向同类毁灭结果。它们没有证明一个敌人的存在，也没有消除反例。\n\n安托涅瓦要求将公开范围、异议渠道和停止条件一并写下。秘密审查必须有期限，公开摘要必须说明误差，任何方案都不能变成无限紧急权力。延缓行动的风险由中央庭承担，不能转嫁成爱缪莎必须持续观测的义务。"
 aemusa_ms.1340.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1350.model:0 "以工作模型继续，保留替代解释与修订记录。"
 aemusa_ms.1350.title:0 "一个可以被推翻的模型"
 aemusa_ms.1350.desc:0 "晏华将两栏记录分开。已核实的是多来源、可重复的毁灭收敛偏差；仍待检验的是它与旧七日历史的关系。\n\n“旧七日毁灭结果正在重新收敛”，现在可以作为组织调查的工作模型。它不是宇宙真相，也没有回答异常是否与黑门同源、命运是否有意志，或这里与旧日世界究竟是什么关系。\n\n你可以据此做有停止条件的准备，也可以先保留卷宗。边界接口调查获准立项，并不意味着某位见证者已经到来。"
 aemusa_ms.1350.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1390.title:0 "调查还需要准备"
 aemusa_ms.1390.desc:0 "当前调查缺少可追溯的前置记录，暂时不能形成新的结论。请从白夜馆返回最近的合法进度；等级、资源或单独打开某一页都不能替代已经发生的经历。"
 aemusa_ms.1390.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1410.verify:0 "复核回波：200 能量、100 矿物，45 天。"
 aemusa_ms.1410.contact:0 "按最低安全范围开放一次通讯。"
 aemusa_ms.1410.title:0 "世界边界的回波"
 aemusa_ms.1410.unverified:0 "调查设备记录到一组边界回波。它还不能被称为来信，更没有说明回应者是谁。\n\n晏华要求改变采样条件重复测量，检查伪造、设备串扰和已知通讯异常。只有这轮核验留下可重复的差异，才考虑最低安全接触。现场研究仍由中央庭设备与人员承担。"
 aemusa_ms.1410.verified:0 "复核组已在不同采样条件下得到可重复的边界回应；已知的普通通讯解释不足以说明它，资料与反例已归档。\n\n这只支持开放一次受限接触，不证明回应者的身份、善意或权限。安托涅瓦限定记录范围和中止条件；爱缪莎可以拒绝回答，任何一方都能要求结束。"
 aemusa_ms.1410.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1415.title:0 "还不能称为来信"
 aemusa_ms.1415.desc:0 "回波核验尚未结束。设备继续重复测量，已支出的资源与原始记录保留。\n\n现在没有合格的接触通道，也没有任何人获得向中央庭提出要求的身份。请等待回报，或之后再来查看。"
 aemusa_ms.1415.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1420.continue:0 "保留这些区别，继续受限接触。"
 aemusa_ms.1420.title:0 "边界的见证者"
 aemusa_ms.1420.desc:0 "回应者先等了一次新的提问，随后纠正了上一段回波里没有出现的词。晏华据此登记有限的实时双向交流。\n\n“你们可以称呼我为埃索林。我能谈一些边界与维护的问题，但无法替你们完成全部解释。”\n\n没有人实体抵达中央庭。记录员将姓名记为自述，将实时交流记为观测事实；她的所在地、现任职责和完整权限仍然空白。爱缪莎没有接受任何关于自己身份的安排。"
 aemusa_ms.1420.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1430.mechanism:0 "先问异常机制，保持最低通道。"
 aemusa_ms.1430.responsibility:0 "先问职责边界，增加一轮受审计追问。"
 aemusa_ms.1430.risk:0 "先问接触风险，保持最低通道。"
 aemusa_ms.1430.title:0 "一次通讯的范围"
 aemusa_ms.1430.desc:0 "安托涅瓦代表中央庭确认：记录可以质疑，回答可以拒绝，通道可以中止。发言者不因掌握某种知识就获得文明治理权，爱缪莎也不因与异常有关就失去自己的发言边界。\n\n时间有限。选择优先问题，只决定这一轮如何使用通道。增加一轮受审计追问会留下更多待核验材料，不会让对方成为全知的说明者。"
 aemusa_ms.1430.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1440.public:0 "公开可复现的部分，明确其余仍是证言。"
 aemusa_ms.1440.phased:0 "先向监督者说明，再分阶段公布核验摘要。"
 aemusa_ms.1440.title:0 "能验证的只有一部分"
 aemusa_ms.1440.mechanism:0 "埃索林只能指出边界回应中可供复测的部分，不能确认旧七日模型就是异常的完整解释。晏华复现了那一小段记录，把其余回答仍留在证言栏。\n\n现场记录把可验证事实、个人证言、推断和未知分开。世界维护、文明治理与命运干涉不能混为一种权力；这里没有授予任何人新的身份。埃索林的职位、所在地、完整权限与知识来源仍未得到确认。"
 aemusa_ms.1440.responsibility:0 "埃索林区分了维护世界、治理文明与干涉命运三种职责：触及规则并不意味着拥有其中所有生命。追加追问留下了一批未能复现的解释；晏华将它们列为待审证言，没有提升为事实。\n\n现场记录把可验证事实、个人证言、推断和未知分开。世界维护、文明治理与命运干涉不能混为一种权力；这里没有授予任何人新的身份。埃索林的职位、所在地、完整权限与知识来源仍未得到确认。"
 aemusa_ms.1440.risk:0 "埃索林要求留意通道稳定性的变化。晏华对照独立设备复现了其中一项限制，其他风险描述仍待验证。扩大通道并不能保证得到更多可靠答案。\n\n现场记录把可验证事实、个人证言、推断和未知分开。世界维护、文明治理与命运干涉不能混为一种权力；这里没有授予任何人新的身份。埃索林的职位、所在地、完整权限与知识来源仍未得到确认。"
 aemusa_ms.1440.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1450.archive:0 "关闭通道，保留证据、限制与开放问题。"
 aemusa_ms.1450.title:0 "通道关闭以后"
 aemusa_ms.1450.desc:0 "回波的稳定区间正在缩短。中央庭按约定结束通讯，没有为了未问完的问题继续扩大通道。\n\n留下来的卷宗包含一小部分有效知识，也包含许多无法验证的回答和没有提出的问题。埃索林是本次受限通讯中的有限顾问，不是常驻成员，更不是可以征召的领袖。爱缪莎与晏华仍须自行核验接下来的每一步。"
 aemusa_ms.1450.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1510.hearing:0 "开始听证，分别核对证据与责任。"
 aemusa_ms.1510.title:0 "不能由一人承担的真相"
 aemusa_ms.1510.desc:0 "中央庭把听证分为四部分：调查证据、现实准备、能力使用边界，以及爱缪莎本人的权利。埃索林的回答只占证言卷的一部分，没有替代任何一项。\n\n安托涅瓦要求科研、舰队、救援、外交和社会保障分别说明自己能承担什么。没有哪一种风险，可以让文明把全部不确定性推给一个人。"
 aemusa_ms.1510.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1520.protect:0 "落实独立复核、暂停与违规追责。"
 aemusa_ms.1520.title:0 "她首先是一个人"
 aemusa_ms.1520.desc:0 "“她不是国家资产。”安托涅瓦把这句话写在讨论能力之前。\n\n拒绝、暂停、质疑与共同复核是爱缪莎原有的权利。中央庭需要做的是把它们落实为制度：记录异议，明确违规追责，允许她退出单次行动，并在重新开始前再次询问。\n\n晏华要求保留过往的工具化与误导记录。新的承诺不会自动抹去旧事，更不能用一次奖励代替解释与修复。"
 aemusa_ms.1520.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1530.support:0 "共同承担后果，每一次行动仍可暂停。"
 aemusa_ms.1530.review:0 "尊重拒绝，先公开修正旧有归因并安排复核。"
 aemusa_ms.1530.title:0 "由她重新回答"
 aemusa_ms.1530.willing:0 "爱缪莎读完风险和停止条件，才给出自己的回答。\n\n“我愿意继续调查。但我不会接受一个无论付出什么都必须给出答案的位置。”\n\n她保留随时要求暂停和复核的权利。你要回应的，是文明如何分担不确定性；她是否继续，不是你的按钮能够替她决定的。"
 aemusa_ms.1530.refused:0 "爱缪莎没有同意继续。此前把有限判断包装为神谕的记录还没有得到清楚修正，新的制度承诺不能替代已经欠下的解释。\n\n安托涅瓦要求先向相关方公开更正归因，并给独立复核留下时间。拒绝将被保留在历史中；复核结束后，仍由爱缪莎重新回答。"
 aemusa_ms.1530.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1525.repair:0 "落实修正与独立复核：200 能量、100 矿物，30 天。"
 aemusa_ms.1525.title:0 "先还清一份解释"
 aemusa_ms.1525.desc:0 "更正说明将把当时的现实行动、有限判断与不确定性重新分开，保留误导曾经发生的记录。独立复核还须核对发布范围、申诉渠道和暂停安排。\n\n投入 200 能量与 100 矿物，安排 30 天的公开修正与复核。完成后只获得重新询问的条件，不购买同意，也不删除过去的拒绝。"
 aemusa_ms.1525.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1527.title:0 "复核尚未结束"
 aemusa_ms.1527.desc:0 "说明已经进入更正与独立复核流程。等待不是同意，反复联络也不能缩短这一轮复核。\n\n爱缪莎可以继续休息。中央庭先完成自己应当承担的部分，之后再重新询问。"
 aemusa_ms.1527.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1540.research:0 "科研与可复核准备先行，保留防护救援底线。"
 aemusa_ms.1540.care:0 "救援与社会韧性先行，持续核验风险。"
 aemusa_ms.1540.cooperation:0 "对外协作与共同防护先行，按授权共享资料。"
 aemusa_ms.1540.title:0 "文明共同承担"
 aemusa_ms.1540.desc:0 "听证已经区分调查、准备和有限干涉三类任务。每一类都有记录、监督、纠错和停止条件；新的紧急安排不得无限延续。\n\n准备的优先顺序可以不同，但科研不能取消救援，舰队不能替代社会恢复，对外协作也不能以分享未核实身份换取信任。爱缪莎只承担她另行同意的部分。\n\n这份授权属于文明共同应对，不是最终命运权限。"
 aemusa_ms.1540.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1550.prepare:0 "登记准备与资格缺口，让各方继续承担自己的工作。"
 aemusa_ms.1550.title:0 "终局前夜的准备"
 aemusa_ms.1550.level_ready:0 "新的偏差仍在增加，但它们尚未给出一个完整的敌人形象。中央庭开始依据已登记的模型准备应对，同时继续允许模型被修订。\n\n爱缪莎已经达到 30 级。这只是未来最终沟通的一项必要资格，不替代危机经历、责任复核、玩家最终授权或她自己的最终决定。此刻没有授予任何新的身份与权限。"
 aemusa_ms.1550.level_missing:0 "新的偏差仍在增加，但它们尚未给出一个完整的敌人形象。中央庭开始依据已登记的模型准备应对，同时继续允许模型被修订。\n\n爱缪莎尚未达到 30 级，最终沟通仍有等级缺口。可以让她在正常工作与休息中继续成长，稍后再查；本次不强制透支，也不立即补满经验。文明的危机准备照常保留，等级更不能替代其他经历与双方决定。"
 aemusa_ms.1550.later:0 "暂时结束通讯，保留当前记录。"
 aemusa_ms.1560.title:0 "准备仍由众人继续"
