l_simp_chinese:
 tech_artifact_precision_landings:0 "定向登陆学"
 tech_artifact_precision_landings_desc:0 "让战术小队围绕明确目标行动，减少对居民区和基础设施的波及。定向登陆队牺牲部分正面输出，并承担更长训练与物资投入。"
 tech_artifact_planetary_garrison:0 "行星驻防统筹"
 tech_artifact_planetary_garrison_desc:0 "把当地公共服务、补给和防御部署衔接起来。社区公共服务中心或中央庭分部可承接一组有维护的当地驻防，部队由原生防御军系统管理。"
 artifact_precision_landing_army:0 "定向登陆队"
 artifact_precision_landing_army_plural:0 "定向登陆队"
 artifact_precision_landing_army_desc:0 "以低附带伤害执行地面目标任务的专业队伍。正面输出低于神器使守备队，训练更久，并需要消费品与较高能源维护。"
 decision_artifact_enable_garrison:0 "部署当地驻防"
 decision_artifact_enable_garrison_desc:0 "投入300矿物和150能源，由活动的社区公共服务中心或中央庭分部组织一组驻防。当地增加2个原生防御军名额，额外月维护4能源、1消费品；每星球一组，两设施共存不叠加。设施停用或失去控制时暂停；转让后须重新付费。"
 decision_artifact_disable_garrison:0 "解除当地驻防"
 decision_artifact_disable_garrison_desc:0 "撤销本星球的付费驻防方案和额外维护，不退款。其他原生防御军与已招募登陆队不受影响。"
 artifact_garrison_requires_control:0 "需要由本国控制该殖民地。"
 artifact_garrison_requires_facility:0 "需要活动的社区公共服务中心或中央庭分部。"
 artifact_garrison_requires_safety:0 "部署期间不能遭受轨道轰炸。"
 artifact_garrison_offer:0 "§Y当地驻防§!：增加§G2§!个原生防御军名额；额外月维护§Y4能源、1消费品§!。防御军留在本星球，实际数量由原生系统刷新。"
 artifact_garrison_removed:0 "清除本星球的付费驻防方案，停止额外名额和维护；不退款。"
