 # AWP-04 首批：战后回访和唯一危机路线入口。
 aemusa_ms.1000.title:0 "不必急着翻开的下一页"
 aemusa_ms.1000.desc:0 "白夜馆的牌桌重新收拾好了。爱缪莎把一副牌放在手边，却没有立刻发牌。\n\n“今天可以只坐一会儿。”她说，“总不能每一次见面，都是来问下一场灾难。”\n\n中央庭的恢复工作仍在继续。上一次胜利留下的承诺没有因此结束，安托涅瓦也没有把尚未完成的事从清单上划掉。晏华只送来一份简短的应对预案，封面没有写下任何预言。\n\n准备可以开始，休息也可以继续。这一次，你们有权自己决定谈到哪里。"
 aemusa_ms.1000.rest:0 "今天先休息，预案下次再谈。"
 aemusa_ms.1000.prepare:0 "恢复工作照常进行，我们先看看预案。"
 aemusa_ms.1010.title:0 "等待事实的预案"
 aemusa_ms.1010.desc:0 "晏华在预案首页写下了同一句要求：等到事实出现，再确认我们面对的是什么。\n\n爱缪莎没有为银河选定一个未来。预案只列出应对大规模灾难时可能需要的能力：舰队、科研、救援与外交。具体是什么威胁，仍要等待银河中可核实的消息。\n\n§Y本局爱缪莎主线只跟进一种原版天灾。§!相应天灾实际发生后，才能确认对应路线。若它已经结束，后续可从调查、救援与恢复责任展开，不会补造参战经历。尚无可选项时，可以继续正常游玩，之后再来白夜馆。确认不会改变银河的天灾设置。"
 aemusa_ms.1010.wait:0 "先保留预案，等新的消息。"
 aemusa_ms.1010.prethoryn:0 "跟进索林原虫：群星之外的饥饿。"
 aemusa_ms.1010.unbidden:0 "跟进异次元入侵者：规则之外的来客。"
 aemusa_ms.1010.contingency:0 "跟进肃正协议：预防性灭绝。"
 aemusa_ms.1010.cetana:0 "跟进塞塔娜：没有痛苦的未来。"
 aemusa_ms.1010.prethoryn.requirement:0 "需要索林原虫危机已经发生，且本局尚未确认其他主线路线。"
 aemusa_ms.1010.unbidden.requirement:0 "需要异次元入侵危机已经发生，且本局尚未确认其他主线路线。"
 aemusa_ms.1010.contingency.requirement:0 "需要肃正协议危机已经发生，且本局尚未确认其他主线路线。"
 aemusa_ms.1010.cetana.requirement:0 "需要塞塔娜危机已经发生，且本局尚未确认其他主线路线。"
 aemusa_ms.1010.lock_hint:0 "确认后，本局爱缪莎主线将固定跟进这一种天灾，不能改选。这个决定不会召唤天灾或给予胜利。"
 aemusa_ms.1015.title:0 "已经选择的回应"
 aemusa_ms.1015.prethoryn:0 "你们已决定跟进§Y索林原虫§!带来的危机。\n\n安托涅瓦把救援名单留在桌上。即便总量能够写进报告，每一个来不及抵达的地点仍有自己的名字。爱缪莎愿意寻找局部的机会，但没有许诺一条能够救下所有人的航线。\n\n这项选择已经记录。舰队调动、调查与救援仍由现实行动决定；其他原版天灾不会再成为本局爱缪莎主线的新路线。"
 aemusa_ms.1015.unbidden:0 "你们已决定跟进§Y异次元入侵者§!带来的危机。\n\n晏华要求保留失效的模型，不能只公布恰好应验的预测。爱缪莎同意从能够核对的局部异常开始；相似的现象，还不能证明它们拥有相同的来源。\n\n这项选择已经记录。侦察、科研与对裂隙的行动仍需文明实际完成；其他原版天灾不会再成为本局爱缪莎主线的新路线。"
 aemusa_ms.1015.contingency:0 "你们已决定跟进§Y肃正协议§!带来的危机。\n\n中央庭拒绝把尚未发生的灾难当作处决现存生命的充分理由。与此同时，自己的应对方案也必须允许质疑、纠错和停止，不能仅凭“为了预防”便免于审查。\n\n这项选择已经记录。调查与防御行动仍需文明实际完成；其他原版天灾不会再成为本局爱缪莎主线的新路线。"
 aemusa_ms.1015.cetana:0 "你们已决定跟进§Y塞塔娜§!带来的危机。\n\n安托涅瓦希望先听清那份消除痛苦的承诺，也要求把被承诺者是否仍能选择写进问题里。爱缪莎没有将对方简化成一个等待消灭的目标。\n\n这项选择已经记录。调查、交流与必要的行动将继续沿着现实展开；其他原版天灾不会再成为本局爱缪莎主线的新路线。"
 aemusa_ms.1015.close:0 "继续应对，也继续履行恢复承诺。"

 # AWP-04 后续：危机实际回应与第七章。
 aemusa_ms.1015.continue:0 "继续讨论这一轮的实际回应。"
 aemusa_ms.1155.stop:0 "停止爱缪莎的有限尝试，普通协调工作继续。"
 aemusa_ms.1110.title:0 "消息终于有了名字"
 aemusa_ms.1110.desc:0 "晏华把猜测和已发生的消息分开放在桌上。这次报告对应你们选定的原版天灾；它的出现并不证明爱缪莎预见了全部经过。\n\n“先确认我们能做什么。”安托涅瓦说，“银河中其他文明的行动也必须留下位置。”\n\n如果危机已经结束，接下来的调查与恢复仍可以继续。你们不会因此补上一段从未发生的参战经历。"
 aemusa_ms.1110.later:0 "先到这里，下次再谈。"
 aemusa_ms.1110.continue:0 "从已发生的事实开始。"
 aemusa_ms.1121.title:0 "群星之外的饥饿"
 aemusa_ms.1121.desc:0 "报告把边境缩成了几条数字。安托涅瓦翻到附页，那里还有居住地、补给点，以及等待回应的名字。\n\n爱缪莎提醒你：概率较低的地点不会因此变成空白。资源有限，扩大救援准备也意味着别处要等待；没人能保证所有路线都安全。"
 aemusa_ms.1121.later:0 "先到这里，下次再谈。"
 aemusa_ms.1121.care:0 "先准备居民援助与医疗物资。"
 aemusa_ms.1121.study:0 "先整理航路与生态风险。"
 aemusa_ms.1122.title:0 "地图不能保证道路"
 aemusa_ms.1122.desc:0 "关于异次元入侵的资料在晏华面前摊开。他把失效的推断也留了下来，没有只保留预测正确的部分。\n\n“现象相似，不足以证明来源相同。”爱缪莎同意先从能核对的局部条件入手。门户、不同派系与现实行动仍应分别研究，不能压成一个无所不知的意志。"
 aemusa_ms.1122.later:0 "先到这里，下次再谈。"
 aemusa_ms.1122.care:0 "先保护受影响居民，谨慎收集资料。"
 aemusa_ms.1122.study:0 "先组织有限调查，公开模型失效范围。"
 aemusa_ms.1123.title:0 "仍然可以纠正的判断"
 aemusa_ms.1123.desc:0 "肃正协议把预防灾难当作肃清现存文明的理由。中央庭面对的困难不只是如何反击，还包括怎样防止自己的应对也变成不可申诉的命令。\n\n晏华要求保留反证渠道。安托涅瓦补上一条：受影响者能够提出异议，紧急状态也不能把这项权利永久拿走。"
 aemusa_ms.1123.later:0 "先到这里，下次再谈。"
 aemusa_ms.1123.care:0 "先建立居民援助与申诉安排。"
 aemusa_ms.1123.study:0 "先组织风险复核与反制调查。"
 aemusa_ms.1124.title:0 "痛苦之后，还能否选择"
 aemusa_ms.1124.desc:0 "塞塔娜的承诺需要通过原版调查与交流继续理解。安托涅瓦既不愿轻视痛苦，也不能接受替所有受影响者取消选择的权利。\n\n爱缪莎把问题留得很具体：如果拒绝一种强制的解脱，我们是否也愿意承担仍然存在的医疗、社会和恢复责任？"
 aemusa_ms.1124.later:0 "先到这里，下次再谈。"
 aemusa_ms.1124.care:0 "先准备医疗与自愿援助安排。"
 aemusa_ms.1124.study:0 "先整理调查资料和受影响者的意见。"
 aemusa_ms.1130.title:0 "她先给出的回答"
 aemusa_ms.1130.offer:0 "爱缪莎先说出了自己的决定。\n\n“我愿意试一次，但只为眼前这一小段行动争取余地。”她把范围压到可以由执行者核对的局部，不承诺改变整场危机。\n\n她要求保留随时停止的权利：观测失准、负荷超出约定，或执行者无法继续配合，就结束尝试。中央庭仍要组织真实行动，承担资源投入和后续责任。你可以同意这个有限方案，也可以完全依靠普通手段。"
 aemusa_ms.1130.refuse:0 "爱缪莎没有接下这次主动干涉的提案。\n\n先前把一次结果包装成神谕的记录还在，她不愿让相同的解释继续扩大。安托涅瓦支持她停止尝试；危机应对仍由文明自身承担。\n\n你们仍可投入物资、组织调查和恢复协调。这条路不会因她的拒绝而消失，也不会被记作她已经同意。"
 aemusa_ms.1130.postwar:0 "危机已经结束，留下的报告和恢复工作却没有自动完成。\n\n爱缪莎没有提出回到过去改变战果。晏华建议把精力放在资料复核、援助协调和那些仍未兑现的承诺上。\n\n这一轮将采用普通行动，不补造主动干涉或参战经历。"
 aemusa_ms.1130.later:0 "先到这里，下次再谈。"
 aemusa_ms.1130.continue:0 "听清她的决定，再讨论执行范围。"
 aemusa_ms.1140.title:0 "一份可以停止的约定"
 aemusa_ms.1140.desc:0 "安托涅瓦将停止条件写进执行安排：不强迫任何人持续配合，不以一次局部结果证明全知，也不把应对成本留给无人负责的附页。\n\n爱缪莎的意愿已经单独记录。现在需要你决定是否采用她提出的有限范围；无论选择哪条路，接下来的文明行动都要实际投入资源和时间。"
 aemusa_ms.1140.later:0 "先到这里，下次再谈。"
 aemusa_ms.1140.limited:0 "同意有限尝试，并确认全部停止条件。"
 aemusa_ms.1140.ordinary:0 "采用普通行动，尊重她保留的边界。"
 aemusa_ms.1150.title:0 "把预案交给执行者"
 aemusa_ms.1150.desc:0 "中央庭准备组织一轮实际应对：物资整备、资料整理、人员与机构之间的协调。\n\n本次投入为 §Y500 能量币、250 矿物§!，行动需要约 §Y90 天§!。这是你们能够承担的一份工作，不保证挽回所有损失，也不能替舰队结束天灾。危机若已结束，工作用于战后调查与恢复。"
 aemusa_ms.1150.cost:0 "需要 500 能量币和 250 矿物；这轮行动尚未开始。"
 aemusa_ms.1150.wait:0 "先准备物资，稍后再来。"
 aemusa_ms.1150.care:0 "投入物资，组织援助准备与恢复协调。"
 aemusa_ms.1150.study:0 "投入物资，组织调查与资料复核。"
 aemusa_ms.1150.duration:0 "投入 500 能量币、250 矿物；约 90 天后收到行动报告。"
 aemusa_ms.1155.title:0 "行动仍在进行"
 aemusa_ms.1155.desc:0 "执行者仍在整理物资、联络机构并核对资料。本轮行动约需 90 天，已经投入的资源不会因再次通讯而重复支出。\n\n你可以继续正常游玩；完成后会有报告。若通知未能显示，之后重新联络白夜馆也能继续。"
 aemusa_ms.1155.close:0 "暂时结束通讯。"
 aemusa_ms.1160.title:0 "一份做过的工作"
 aemusa_ms.1160.care:0 "这轮物资整备与恢复协调已经完成。执行者提交了工作记录，也把尚待核对的需求继续保留。\n\n安托涅瓦没有把物资投入换算成未经证实的“获救人数”。爱缪莎同意只记下发生过的尝试，不将它说成整场危机的决定性原因。\n\n这份工作构成了文明的实际回应；天灾本身的结果仍应等待银河中的行动。"
 aemusa_ms.1160.study:0 "这一轮资料收集、机构联络与交叉复核已经完成。晏华把事实、暂用模型和仍不知道的部分分开整理，旧模型的错误也留在档案里。\n\n爱缪莎没有把一份能够使用的报告说成对危机本体的完整解释。\n\n这份工作构成了文明的实际回应；天灾本身的结果仍应等待银河中的行动。"
 aemusa_ms.1160.later:0 "先到这里，下次再谈。"
 aemusa_ms.1160.continue:0 "把实际工作与仍未完成的责任分别留下。"
 aemusa_ms.1170.title:0 "银河的结果与我们的责任"
 aemusa_ms.1170.desc:0 "原版危机已经结束。这个结果属于银河中实际参与应对的文明，不以谁完成最后一击来抹去其他人的工作。\n\n你们投入过的行动已经单独记录。中央庭现在需要清点承诺、未完成的修复和仍有争议的资料；胜利不会自动把这些项目划掉。\n\n本局爱缪莎主线将以这一种危机进入战后复盘，不再选择第二种路线。"
 aemusa_ms.1170.later:0 "先到这里，下次再谈。"
 aemusa_ms.1170.continue:0 "确认结果，进入战后复盘。"
 aemusa_ms.1175.title:0 "应对之后，危机仍在"
 aemusa_ms.1175.desc:0 "你们已经完成这一轮实际回应，但选定的原版天灾还没有结束。\n\n舰队、调查、外交与银河其他文明的行动仍在继续。白夜馆会在你下次联络时核对结果；这次通讯不会生成胜利。"
 aemusa_ms.1175.close:0 "暂时结束通讯。"
 aemusa_ms.1200.title:0 "一次末日之后"
 aemusa_ms.1200.desc:0 "桌上的档案只对应本局选定的一种危机。晏华把银河的结果、你们投入的工作，以及爱缪莎是否参与局部尝试分别列出。\n\n无人需要争夺一个能够解释全部胜利的位置。那些未完成的承诺，也不能借庆功从清单里消失。"
 aemusa_ms.1200.later:0 "先到这里，下次再谈。"
 aemusa_ms.1200.continue:0 "保留完整记录，包括不足和他者的贡献。"
 aemusa_ms.1210.title:0 "可以公开到哪里"
 aemusa_ms.1210.desc:0 "“哪些是事实，哪些只是我们的解释，必须说清楚。”晏华把报告交给安托涅瓦。\n\n她愿意说明中央庭作过的决定，也要求保护仍在恢复中的个人。公开节奏可以不同，损失、误差和未知却不能被写成不存在。"
 aemusa_ms.1210.later:0 "先到这里，下次再谈。"
 aemusa_ms.1210.open:0 "公开已核实摘要，并接受持续追问。"
 aemusa_ms.1210.phased:0 "分阶段公开，先向受影响者与监督者说明。"
 aemusa_ms.1220.title:0 "下一次仍要重新询问"
 aemusa_ms.1220.attempted:0 "爱缪莎承认，这次曾尝试主动影响一个局部窗口。她也记得，那点余地怎样依赖执行者、物资与当时的条件。\n\n“我不想让一次尝试变成以后每一次的默认答案。”\n\n安托涅瓦把这句话写进后续安排。经历能够留下，未来的同意仍要重新取得；没有人因此获得无限改写的许可。"
 aemusa_ms.1220.ordinary:0 "这轮回应没有记录爱缪莎实际使用主动干涉。她的拒绝、你的普通行动选择，或危机已经结束的事实，都不会被战后报告改写。\n\n“我们仍然做了能够做的事。”她说。\n\n后续研究可以继续，但尚未发生的能力阶段仍然空着；任何下一次尝试都需要重新询问。"
 aemusa_ms.1220.later:0 "先到这里，下次再谈。"
 aemusa_ms.1220.respect:0 "下一次仍要重新询问，也允许她拒绝。"
 aemusa_ms.1230.title:0 "先提出需要，再讨论答案"
 aemusa_ms.1230.desc:0 "这段经历暴露了两种需要：执行现场要有维持局部条件的办法，文明也需要持续的现实参照、观测、协调和弱点研究能力。\n\n中央庭只为这些职责立项。眼下没有已定型的专属舰或巨构，更没有一份能够跳过研究直接投入使用的图纸。\n\n你们可以决定先把哪一类问题交给研究人员。"
 aemusa_ms.1230.later:0 "先到这里，下次再谈。"
 aemusa_ms.1230.local:0 "先整理现场局部恒定载体的研究需求。"
 aemusa_ms.1230.reference:0 "先整理文明级参照与协调的研究需求。"
 aemusa_ms.1240.title:0 "让晚餐只是晚餐"
 aemusa_ms.1240.desc:0 "爱缪莎把报告合上，问你要不要再坐一会儿。\n\n这次没有需要立即回答的预测。有人迟到了，有人的座位仍空着，桌上的话题也并不总能顺利继续。你们没有试着把这些停顿解释成某种宏大的意义。\n\n恢复可以缓慢一些。还记得失去，也不妨碍今天把饭吃完。"
 aemusa_ms.1240.later:0 "先到这里，下次再谈。"
 aemusa_ms.1240.continue:0 "先照顾眼前的人，再回到那些未解的问题。"
 aemusa_ms.1250.title:0 "尚未解释的偏差"
 aemusa_ms.1250.desc:0 "晏华在归档时保留了一组尚不能解释的偏差。它们值得继续调查，却不足以宣布所有危机同源，更不能证明背后存在一个针对你们的意志。\n\n安托涅瓦同意设立后续调查，前提是恢复安排继续执行。爱缪莎没有催促你翻开下一页。\n\n你可以现在确认调查准备，也可以继续停留。"
 aemusa_ms.1250.later:0 "先到这里，下次再谈。"
 aemusa_ms.1250.finish:0 "保留未知，开始准备后续调查。"
 aemusa_ms.1260.title:0 "把未知留在下一页"
 aemusa_ms.1260.desc:0 "这一段危机应对与战后复盘已经归档。第三幕结束，后续异常调查的准备已经记录。\n\n恢复承诺仍然有效。白夜馆暂时没有新的调查结果，爱缪莎也不需要在此刻给出所有答案。"
 aemusa_ms.1260.close:0 "暂时结束通讯。"
