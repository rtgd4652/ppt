l_simp_chinese:
 # 简体中文本地化；冒号前为键名，冒号后为游戏中显示的文本。
 ARTIFACT_USER:0 "神器使"
 ARTIFACT_USER_desc:0 "与神器共鸣的神秘有机生命。只有以神器使为主物种的帝国，才能通过法令召唤爱缪莎。"
 requires_pop:0 "需要可招募人口。"
 trait_artifact_resonance:0 "神器使契约"
 trait_artifact_resonance_desc:0 "与神器缔结契约的守护者，能够在危机中维持都市日常。陆军伤害：§G+10%§!\n人口舒适度使用：§G-10%§!\n宜居性：§G+5%§!"
 origin_artifact_resonance:0 "交界都市守望者"
 origin_artifact_resonance_desc:0 "黑门阴影笼罩交界都市。中央庭将与神器缔结契约的年轻人集结起来，在日常与灾厄交错的七日轮回中守护家园。"
 origin_artifact_resonance_effects:0 "$ORIGIN$: $origin_artifact_resonance$\n$EFFECTS_TXT$\n- 母星替换为专属 §Y交界都市§!\n- 首都获得一座 §Y中央庭指挥中心§!\n- 首都获得一个 §Y学园巡查区§!\n- 主物种获得 §Y神器使契约§! 特质"
 pc_artifact_crossing_city:0 "交界都市"
 pc_artifact_crossing_city_desc:0 "一座在黑门威胁与日常生活之间艰难维系的都市。中央庭、学园与商业街共同构成这颗星球的心跳。"
 pc_artifact_destiny_city:0 "命运都市"
 pc_artifact_destiny_city_desc:0 "一座被中央庭、神器共鸣与命运演算彻底重构的理想都市。它不是逃离灾厄的温室，而是能把灾厄本身纳入计算的后期文明核心。"
 building_artifact_sanctum:0 "中央庭指挥中心"
 building_artifact_sanctum_desc:0 "中央庭在当地的行动中枢，负责指挥神器使、疏散民众并维持黑门警戒线。"
 district_artifact_nexus:0 "学园巡查区"
 district_artifact_nexus_plural:0 "学园巡查区"
 district_artifact_nexus_desc:0 "由学园、商业街与巡查站构成的生活区。研究、休憩与对灾厄的日常戒备在这里并存。"
 district_artifact_destiny_commons:0 "中央庭"
 district_artifact_destiny_commons_plural:0 "中央庭"
 district_artifact_destiny_commons_desc:0 "命运都市的中枢区划，对应原版城市区划。这里统合行政、住房、神器使档案与黑门守望网络，提供住房、舒适度、稳定度、凝聚力、影响力与少量舰队容量。"
 district_artifact_destiny_industry:0 "中央城区"
 district_artifact_destiny_industry_plural:0 "中央城区"
 district_artifact_destiny_industry_desc:0 "命运都市的制造与行政核心，将神器工艺与共鸣合金工序集中管理，提供消费品与合金岗位。"
 district_artifact_destiny_foundation:0 "海湾侧城"
 district_artifact_destiny_foundation_plural:0 "海湾侧城"
 district_artifact_destiny_foundation_desc:0 "依托港湾、仓储与相位基建的资源区划，提供能量、矿石与食物岗位。"
 district_artifact_destiny_bay_area:0 "海湾区"
 district_artifact_destiny_bay_area_plural:0 "海湾区"
 district_artifact_destiny_bay_area_desc:0 "连接港湾贸易、能源中继与生活补给的沿海区划，提供能量、贸易价值、消费品、食物与舒适度。"
 district_artifact_destiny_research:0 "高校学园"
 district_artifact_destiny_research_plural:0 "高校学园"
 district_artifact_destiny_research_desc:0 "将学园实验室、塔罗阵列与黑门观测课程并联的科研区划，提供大量科研岗位。"
 district_artifact_destiny_maritime_research:0 "海上研究所"
 district_artifact_destiny_maritime_research_plural:0 "海上研究所"
 district_artifact_destiny_maritime_research_desc:0 "部署在海上隔离区与相位平台上的前沿研究设施，提供三系科研、稀有资源精炼与文物编录岗位。"
 district_artifact_destiny_fleet:0 "东方古街"
 district_artifact_destiny_fleet_plural:0 "东方古街"
 district_artifact_destiny_fleet_desc:0 "保留交界都市日常烟火、古街记忆与巡查路线的民生区划，提供凝聚力、舒适度、有机人口增长、食物与贸易岗位。"
 district_artifact_destiny_old_town:0 "旧城区"
 district_artifact_destiny_old_town_plural:0 "旧城区"
 district_artifact_destiny_old_town_desc:0 "旧日记录、遗留设施与黑门异常交叠的城区，适合文物修复、档案整理与政治承认工作，提供文物、科研、凝聚力、影响力与稳定度。"
 EMPIRE_DESIGN_artifact_user_central_court:0 "交界都市中央庭"
 PRESCRIPTED_adjective_artifact_user_central_court:0 "中央庭"
 PRESCRIPTED_ship_prefix_artifact_user_central_court:0 "庭"
 PRESCRIPTED_species_name_artifact_user:0 "神器使"
 PRESCRIPTED_species_plural_artifact_user:0 "神器使"
 PRESCRIPTED_species_adjective_artifact_user:0 "神器使"
 PRESCRIPTED_planet_name_artifact_user_central_court:0 "交界都市"
 PRESCRIPTED_system_name_artifact_user_central_court:0 "交界星系"
 PRESCRIPTED_ruler_name_artifact_user_central_court:0 "中央庭统筹官"
 # 法令 UI 会在脚本 ID 前自动添加 edict_ 前缀，因此这里保留双 edict_ 前缀。
 edict_edict_summon_stellar_administrator:0 "召唤星海行政官"
 edict_edict_summon_stellar_administrator_desc:0 "花费 £unity£500 凝聚力，招募一名 11 级官员领袖：爱缪莎。她会在 30 级时解锁成长版立绘，并可以通过通讯改任其他职位。"
 edict_edict_contact_white_night_pavilion:0 "联络白夜馆"
 edict_edict_contact_white_night_pavilion_desc:0 "打开白夜馆通讯终端，查看已接入的神器使与待整理的委托名册。"
 edict_edict_contact_aemusa:0 "联络爱缪莎"
 edict_edict_contact_aemusa_desc:0 "与爱缪莎建立通讯，并为她重新选择职责。"
 edict_edict_artifact_research_archive:0 "调阅中央庭科技档案"
 edict_edict_artifact_research_archive_desc:0 "旧版科技档案入口已停用；爱缪莎个人科技线现在由§Y爱缪莎：命运主宰§!飞升解锁。"
 edict_edict_aemusa_debug_storage:0 "【测试】扩展资源仓储"
 edict_edict_aemusa_debug_storage_desc:0 "隔离测试用仓储扩展：启用期间，适用资源的储存容量§G+100000§!。可随时关闭；只扩大容量，不自动补给或提高产出。"
 edict_edict_aemusa_debug_overdrive:0 "【测试】中央庭全域超频"
 edict_edict_aemusa_debug_overdrive_desc:0 "临时测试法令：获得永久测试修正、巨量资源与三系科研点数，并将已接入的神器使领袖补到 30 级。该按钮仅供本地测试使用。"
 aemusa_debug_overdrive:0 "测试协议：中央庭全域超频"
 aemusa_debug_overdrive_desc:0 "中央庭测试协议正在跳过常规配给、建设排程与科研审查，用于快速验证神器使后期经济、巨构、舰船、行星建筑、决议与空间站建设。"
 aemusa:0 "爱缪莎"
 aemusa_leader_background:0 "§Y爱缪莎§!来自§Y中央庭§!，是守护交界都市的§Y中央庭七人众§!之一。她以塔罗与命运之力回应黑门危机，并在群星之间继续守望众人的未来。"
 leader_trait_aemusa_commander:0 "逆命之牌"
 leader_trait_aemusa_commander_desc:0 "舰队武器伤害：§G+30%§!\n舰队武器射速：§G+20%§!"
 leader_trait_aemusa_official:0 "命运织网"
 leader_trait_aemusa_official_desc:0 "稳定度：§G+10§!\n舒适度：§G+10§!"
 leader_trait_aemusa_scientist:0 "星图演算"
 leader_trait_aemusa_scientist_desc:0 "科学船调查速度：§G+50%§!\n异常现象研究速度：§G+50%§!"
 seth:0 "赛斯"
 seth_leader_background:0 "§Y赛斯§!是原作中主线获得的辅助型神器使，称号为§Y神官§!，神器是§Y权杖・羽蛇神杖§!。他身为不良神官，却也是中央庭与圣星教会之间的重要纽带，常在危险区域救援仍未撤离的人。"
 leader_trait_seth_official:0 "羽蛇神杖"
 leader_trait_seth_official_desc:0 "每级领袖等级：管辖行星人口幸福度 §G+1%§!，管辖行星舒适度 §G+1§!，管辖行星稳定度 §G+1§!。\n每级领袖等级：任职议会时凝聚力产出 §G+1%§!，法令经费 §G+5§!。"
 yutong:0 "幽桐"
 yutong_leader_background:0 "§Y幽桐§!是原作中主线获得的射手型神器使，属性为§Y巧§!，神器是§Y神弓・甘狄拔§!。他沉默、克制，却总能在最需要支援的距离上拉开弓弦。"
 leader_trait_yutong_commander:0 "神弓・甘狄拔"
 leader_trait_yutong_commander_desc:0 "每级领袖等级：所在舰队武器射速 §G+5%§!，武器伤害 §G+5%§!，武器射程 §G+1%§!。"
 rabi:0 "拉比"
 rabi_leader_background:0 "§Y拉比§!是原作中记忆殿堂关联的战士型神器使，称号为§Y地精§!，属性为§Y刚§!，神器是§Y怪兽・阿米特§!。他以近身冲锋和顽强压制见长，接入白夜馆后负责地面突破与登陆战支援。"
 leader_trait_rabi_commander:0 "怪兽・阿米特"
 leader_trait_rabi_commander_desc:0 "每级领袖等级：所指挥陆军伤害 §G+5%§!，士气 §G+3%§!，生命值 §G+3%§!。"
 aemusa_dialogue.1.title:0 "白夜馆通讯终端"
 aemusa_dialogue.1.desc:0 "通讯屏亮起柔白的灯箱边框，像交界都市街角那间总在深夜营业的白夜馆。右上角三枚菱形框依次点亮：§Y通讯§!、§Y名册§!、§Y回忆§!。\n\n“欢迎来到白夜馆。今日委托、神器使联络与临时出勤登记都在这里办理。请问需要哪一项服务？”"
 aemusa_dialogue.1.communication:0 "通讯"
 aemusa_dialogue.1.roster:0 "名册"
 aemusa_dialogue.1.memory:0 "回忆"
 aemusa_dialogue.1.aemusa_main_story:0 "爱缪莎主线"
 aemusa_dialogue.1.goodbye:0 "暂时离开白夜馆。"
 aemusa_ms.3.title:0 "爱缪莎主线接口"
 aemusa_ms.3.desc:0 "主线最小运行骨架已经与白夜馆连接。当前只读入口定位在序章之前，正式剧情尚未接入。\n\n此状态页不会开始事件簇、推进章节或执行结算。"
 aemusa_ms.3.close:0 "关闭主线状态页。"
 aemusa_ms.close:0 "暂时结束通讯。"
 aemusa_ms.101.title:0 "星海的样本：等待记录"
 aemusa_ms.101.desc:0 "序章的审查记录已经封存，但第一章不会仅凭年份、舰队或资源规模开启。中央庭仍在等待一项真实的银河参与记录：完成星系调查，或实际启动一次殖民行动。\n\n白夜馆只说明缺少的资格，不会替文明伪造经历。"
 aemusa_ms.102.title:0 "当前章节已归档"
 aemusa_ms.102.desc:0 "目前已接入的章节记录已经归档。爱缪莎仍只能提出有限观测建议，不能主动干涉命运。\n\n下一章节尚未开放；白夜馆不会替文明生成战争、胜利或其他尚未发生的事实。"
 aemusa_ms.103.title:0 "旧日目光：等待真实开战"
 aemusa_ms.103.desc:0 "第一幕已经归档。第四章需要一场真实的战争：觉醒失落帝国直接向我国宣战，而我国从开战之初就是主要防守方。\n\n当前尚无这样的开战记录。白夜馆不会从年代、通讯或某项未经确认的外交要求推断战争已经发生。"
 aemusa_ms.104.title:0 "战争仍由现实决定"
 aemusa_ms.104.desc:0 "中央庭已经记录战时责任与优先次序，但尚无同一场战争由我国获胜的记录。战争若仍在继续，行动和结果仍取决于文明本身；若以战败或维持现状结束，白夜馆也不会把它改写成胜利。\n\n第六章的战后胜利复盘仍未开放。"

 aemusa_ms.200.title:0 "未翻开的牌"
 aemusa_ms.200.desc:0 "白夜馆的桌面上只摆着一局轻松的牌。爱缪莎主动为自己增加限制，也为指挥使留下反悔和重新确认规则的机会。\n\n牌局结束时，最后一张牌仍然扣在桌面。她没有把它翻成一个所谓的唯一答案——未来首先是一组尚未完成的可能性。"
 aemusa_ms.200.continue:0 "先让最后一张牌保持未翻开。"
 aemusa_ms.210.title:0 "互相矛盾的征兆"
 aemusa_ms.210.desc:0 "早期星海记录中出现了数项彼此冲突的低置信度征兆。爱缪莎可以指出它们，却无法证明其中哪一项必然发生。\n\n晏华要求保留反例、遗漏和误差；安托涅瓦则明确，任何观测都只能作为公共决策的参考，而不能成为神谕。"
 aemusa_ms.210.uncertain:0 "接受不确定性，保留所有可复核记录。"
 aemusa_ms.210.oracle:0 "要求她给出一个确定答案。"
 aemusa_ms.220.title:0 "沉默也有后果"
 aemusa_ms.220.desc:0 "一项被暂时搁置的低置信度征兆，对应了一次范围有限、却真实发生的损失。受影响者并不是抽象数字；这项代价也不会因为后续修复而从历史中消失。\n\n这不是命运对怀疑者的惩罚。它只证明：在证据不足时，行动与不行动都需要承担责任。"
 aemusa_ms.220.record:0 "记录依据、遗漏、受影响者和未解决问题。"
 aemusa_ms.230.title:0 "观测资料的边界"
 aemusa_ms.230.desc:0 "中央庭需要决定如何管理尚不稳定的观测资料。有限保密可以降低误读风险，但必须接受制度监督；分阶段公开可以引入外部复核，也必须承担信息被误读的风险。\n\n这项选择只记录首次治理原则，不是永久不可修订的政策。未来若有修订，旧决定仍将保留。"
 aemusa_ms.230.confidential:0 "有限保密，并建立制度监督。"
 aemusa_ms.230.disclosure:0 "分阶段公开，并承担误读与纠正责任。"
 aemusa_ms.290.title:0 "第一份观测审查"
 aemusa_ms.290.desc:0 "晏华建立了证据、反例与遗漏的审查格式；安托涅瓦确认观测不得替代公共责任；爱缪莎也接受自己的判断必须被现实校正。\n\n随着人类继续探索星海，某些模糊趋势似乎正在变得清晰，但原因仍然未知。序章到此结束，不解锁任何能力或资产。"
 aemusa_ms.290.finish:0 "封存序章记录。"

 aemusa_ms.300.title:0 "第一章：星海的样本"
 aemusa_ms.300.desc:0 "一项真实的星系调查或殖民行动已经改变了文明与银河的联系。中央庭把行动前后的常规记录，与爱缪莎当时看到的模糊征兆并列整理。\n\n变化不是由国力数字证明的，而是来自文明确实进入了一条因果链，并开始承担行动的后果。"
 aemusa_ms.300.continue:0 "整理行动前后的联合样本。"
 aemusa_ms.310.title:0 "相关性与行动节奏"
 aemusa_ms.310.desc:0 "爱缪莎指出了常规模型遗漏的一组关联。晏华确认相关性存在，也排除了部分明显误差，但拒绝把相关性直接升级为因果结论。\n\n现在可以继续收集证据，也可以开展范围有限、设有停止条件的调查。两者都可能错过机会或付出成本。"
 aemusa_ms.310.cautious:0 "谨慎增加证据与对照样本。"
 aemusa_ms.310.limited:0 "开展范围有限、随时可停止的调查。"
 aemusa_ms.320.title:0 "样本为谁服务"
 aemusa_ms.320.desc:0 "安托涅瓦要求中央庭回答：研究框架究竟只优先服务本国，还是也正式记录殖民地、盟友与其他文明承受的外部影响？\n\n这是责任边界，不是善恶评分。任何选择都必须保留被遗漏者和代价的真实记录。"
 aemusa_ms.320.internal:0 "首先保障本国与直属治理区域。"
 aemusa_ms.320.expanded:0 "把其他受影响群体纳入正式评估。"
 aemusa_ms.390.title:0 "尚未成为答案的关联"
 aemusa_ms.390.desc:0 "联合样本已经建立：文明的真实参与会留下更清楚、也更容易比较的观测痕迹。常规科学与神器观测能够互相校正。\n\n但没有证据证明银河正在回应人类，更没有证据证明所谓命运已经被理解。第一章只确认关联存在。"
 aemusa_ms.390.finish:0 "保留未知，结束第一章。"

 aemusa_ms.400.title:0 "第二章：有分量的选择"
 aemusa_ms.400.desc:0 "同一项文明决定呈现出多条可能结果。其中一条最有利于本国，却会把风险转移给其他受影响群体。\n\n爱缪莎展示可能性，但没有替任何人决定；安托涅瓦要求列出受益者、承担者和替代方案。"
 aemusa_ms.400.continue:0 "让受影响者进入讨论。"
 aemusa_ms.410.title:0 "没有无成本的正确答案"
 aemusa_ms.410.desc:0 "晏华把资源、战略、时间与执行能力列入决策。降低外部伤害意味着本国必须承担额外代价；优先保障本国则会让其他群体承受更高风险。\n\n预测可以揭示风险转移，却不会自动产生替他人选择的权利。"
 aemusa_ms.410.continue:0 "在现实约束下作出决定。"
 aemusa_ms.420.title:0 "责任的第一次应用"
 aemusa_ms.420.desc:0 "第一章确定的是原则，现在必须把原则用于一次真实决策。选择本国预测最优，并不允许删除外部代价；选择降低外部伤害，也不能假装额外成本不存在。\n\n这份记录不会覆盖先前的责任半径，而会作为它的第一次现实应用永久保存。"
 aemusa_ms.420.optimum:0 "优先本国预测最优，完整登记外部代价。"
 aemusa_ms.420.external:0 "承担额外代价，降低外部伤害并保留他者选择。"
 aemusa_ms.430.title:0 "第一份文明责任记录"
 aemusa_ms.430.desc:0 "中央庭将决定依据、知情范围、受益者、承担者和未解决代价写入同一份档案。爱缪莎由此确认：看见更好的结果，并不等于有权替别人选择。\n\n后续修复可以追加补偿与制度修正，但不能把这次选择改写成从未发生。"
 aemusa_ms.430.finish:0 "封存责任记录。"

 aemusa_ms.500.title:0 "第三章：第一次下注"
 aemusa_ms.500.desc:0 "联合样本中出现了一项范围有限的救援案例。主要损失仍有机会避免，行动窗口也尚未关闭，但任何介入都会重新分配时间、资源与风险。\n\n这不是失落帝国战争，也不是任何天灾；它只是一场普通文明仍能处理的现实危机。"
 aemusa_ms.500.continue:0 "确认被保护者、风险和行动窗口。"
 aemusa_ms.510.title:0 "有限方案与误差"
 aemusa_ms.510.desc:0 "爱缪莎提出一项可由普通救援体系执行的替代方案，并主动公开误差、停止条件和可能产生的二次代价。\n\n方案不会替代执行者，也不会保证成功。晏华要求把观测建议、普通行动与偶然条件分别记录。"
 aemusa_ms.510.continue:0 "先确认误差和停止条件。"
 aemusa_ms.520.title:0 "是否采纳"
 aemusa_ms.520.desc:0 "中央庭可以完整采纳有限方案、缩小执行范围，或拒绝使用观测建议。三种路径都会产生现实后果。\n\n这里不存在“保证成功”的选项；爱缪莎也没有主动改写命运的能力。"
 aemusa_ms.520.adopt:0 "采纳有限方案，并保留停止条件。"
 aemusa_ms.520.narrow:0 "缩小执行范围，只承担可控制的风险。"
 aemusa_ms.520.reject:0 "拒绝方案，按常规程序应对。"
 aemusa_ms.530.title:0 "普通文明的行动"
 aemusa_ms.530.desc:0 "救援体系开始执行现实行动。观测只提供了一个可能的窗口；航线确认、人员调度、现场判断和后续恢复仍由普通人和制度完成。\n\n行动需要三十天结算。在此期间，白夜馆不会提前生成一个更有利的结果。"
 aemusa_ms.530.execute:0 "开始执行，并等待现实结果。"
 aemusa_ms.535.title:0 "行动仍在进行"
 aemusa_ms.535.desc:0 "有限救援行动尚未结算。白夜馆只保留当前记录，不会通过重复通讯缩短时间、复制成本或提前确定结果。"
 aemusa_ms.540.title:0 "主要结果与二次代价"
 aemusa_ms.540.desc:0 "行动已经产生结果。主要损失、实际发生的损失、承担者和恢复需求被同时列出；拒绝观测建议的路线也保留其现实后果。\n\n现在需要决定是否把二次代价诚实纳入正式记录。信息公开范围仍遵循序章治理原则，但审计层不能删除事实。"
 aemusa_ms.540.disclose:0 "诚实记录二次代价和承担者。"
 aemusa_ms.540.minimize:0 "在公开摘要中淡化二次代价。"
 aemusa_ms.550.title:0 "观测、行动与偶然"
 aemusa_ms.550.desc:0 "复盘证明，至少一项曾被归于观测判断的结果，主要来自现场执行者的普通行动或未被模型纳入的偶然条件。\n\n这不会抹去神器观测的贡献，却要求中央庭纠正“一切都是预言实现”的错误归因。"
 aemusa_ms.550.correct:0 "更正记录，承认普通行动与偶然条件。"
 aemusa_ms.550.oracle:0 "把这次结果包装成爱缪莎永远正确的证明。"
 aemusa_ms.590.title:0 "牌局之后"
 aemusa_ms.590.desc:0 "正式复盘结束后，白夜馆重新安静下来。没有新的任务，也没有奖励画面；这里只有疲惫、后怕，以及一局不需要预言结果的普通游戏。\n\n爱缪莎进入了§Y观测参与阶段§!，但她仍然只能提出有限建议，并必须接受现实校正。第一幕到此结束。"
 aemusa_ms.590.finish:0 "让所有人先休息。"

 aemusa_ms.700.title:0 "第四章：旧日目光"
 aemusa_ms.700.desc:0 "战争记录已经确认：一支觉醒失落帝国主动向我国宣战，我国从最初就是主要防守方。\n\n这是可以核验的事实。对方此前是否提出过某项具体要求、为何选择此刻开战，现有记录不足以作答。爱缪莎拒绝把未知动机称作命运的安排。"
 aemusa_ms.700.continue:0 "先记录开战，保留未知。"
 aemusa_ms.710.title:0 "危机中的知情权"
 aemusa_ms.710.desc:0 "宣战本身已足以要求中央庭说明风险。公众需要知道谁发动了战争、我国承担什么责任；未经核实的外交传闻与尚未发生的战果，则不能混入正式通报。\n\n安托涅瓦要求每一份通报注明证据层级，并让受影响者有机会提出异议。"
 aemusa_ms.710.continue:0 "将已证实与待核实的信息分开。"
 aemusa_ms.720.title:0 "证据与推测的边界"
 aemusa_ms.720.desc:0 "晏华要求把已证实的攻守关系、可查证的军情和未经证实的动机推测分开。具体战争目标与战况仍以现实记录为准；观测到的可能性不能改写成已经发生的攻击。\n\n爱缪莎可以提出风险窗口，却不能提供必胜路线，也不能替中央庭作决定。"
 aemusa_ms.720.continue:0 "让现实行动接受现实证据的检验。"
 aemusa_ms.730.title:0 "中央庭的公开责任"
 aemusa_ms.730.desc:0 "安托涅瓦需要确定通报的节奏。立即公开已核实的事实，能让更多人参与判断，也可能暴露尚需保护的行动细节；分阶段公布，可以先保护执行信息，却必须接受独立监督和明确的复核期限。\n\n两种方式都不能把战争责任推给爱缪莎，更不能用观测代替文明的选择。"
 aemusa_ms.730.open:0 "立即公开已核实事实，敏感细节继续审查。"
 aemusa_ms.730.phased:0 "分阶段公布，并设立独立监督与复核期限。"
 aemusa_ms.740.title:0 "把决定留在现实中"
 aemusa_ms.740.desc:0 "中央庭把公开决定、证据边界和后续追问方式归档。安托涅瓦承担国家领导责任；爱缪莎保留提出疑问和拒绝被透支的权利。\n\n第四章到此结算。战争的行动、代价和结果仍需由真实游戏过程证明，任何剧情选择都不会替文明赢得它。"
 aemusa_ms.740.finish:0 "封存决定，继续面对真实战争。"

 aemusa_ms.800.title:0 "第五章：不能交给预言的战争"
 aemusa_ms.800.desc:0 "这场战争已经由真实的攻守关系确认。中央庭必须组织舰队、工业、外交与社会体系承担压力；爱缪莎只能提供有限意见，不能替任何人打完战争。\n\n第四章留下的公开责任决定仍然有效，战时判断也必须继续接受修正。"
 aemusa_ms.800.continue:0 "让文明自己承担行动。"
 aemusa_ms.810.title:0 "有限的风险判断"
 aemusa_ms.810.desc:0 "爱缪莎能提示一些可能的风险，却无法确认每一处战场变化，也无法给出必胜路线。晏华要求先用常规情报核验，再决定哪些建议可用；一旦证据失效，就必须停止沿用。\n\n她有权拒绝持续透支。一个未经核实的可能性，不会被记成已经发生的战果。"
 aemusa_ms.810.continue:0 "保留误差，也保留停止条件。"
 aemusa_ms.820.title:0 "制度性取舍"
 aemusa_ms.820.desc:0 "安托涅瓦与晏华面前没有能同时保全一切的方案。中央庭现在要记录面对冲突时的公开优先级：先保护受影响人口，或先保全主力以维持防线。两种方向都仍须安排救援和复核，不能用一个口号抹去另一方的风险。\n\n这份决定只界定责任；真正的舰队调动、撤离与战争结果仍要由文明在现实中完成。"
 aemusa_ms.820.civilians:0 "优先保护受影响人口，同时复核防线风险。"
 aemusa_ms.820.fleet:0 "优先维持主力防线，同时保留撤离与救援。"
 aemusa_ms.830.title:0 "由现实取得的胜利"
 aemusa_ms.830.desc:0 "同一场由觉醒失落帝国发起、我国从开战起承担主要防守责任的战争，现在留下了我国获胜的结果。\n\n它来自真实的文明行动。爱缪莎的提示既不是一支舰队，也不能证明任何决策没有代价。"
 aemusa_ms.830.continue:0 "记录结果，也准备核对代价。"
 aemusa_ms.840.title:0 "胜利之后仍有账要查"
 aemusa_ms.840.desc:0 "中央庭保留了战时优先级、公开决定和这场战争的结果。伤亡、撤离、盟约与受损设施的具体情况仍须依各自的现实记录查证；未知数不能填作零。\n\n爱缪莎的停止权也不因获胜而失效。第五章只结算战争事实与责任入口，不替战后复盘给出无损结论。"
 aemusa_ms.840.finish:0 "进入战后复盘。"

 aemusa_ms.900.title:0 "第六章：胜利并非证明"
 aemusa_ms.900.desc:0 "战争结束了，合格的胜利已经记录。安托涅瓦拒绝将它解释为所有决定都正确，更不会把文明的生存归因于某种宇宙偏爱。\n\n战后篇从核对可追溯事实开始。"
 aemusa_ms.900.continue:0 "先核对战争记录。"
 aemusa_ms.910.title:0 "仍未完成的统计"
 aemusa_ms.910.desc:0 "中央庭要求分别核对伤亡、撤离、盟约、紧急权力和未完成恢复。现有故事记录不能代替实际统计；缺少证据的项目必须保持待核实，不能凭胜利画面写成零。\n\n幸存者与未能保护的人都应得到继续追问的渠道。"
 aemusa_ms.910.continue:0 "保留待核实项目和更正渠道。"
 aemusa_ms.920.title:0 "安托涅瓦的公共说明"
 aemusa_ms.920.desc:0 "安托涅瓦亲自说明中央庭当时的优先级、依据与仍须查证的后果。她可以立即公开已核实的内容，也可以为保护必要细节分阶段公布；无论哪种方式，都必须保留独立监督和后续追问。\n\n第四章和第五章留下的决定不会在这里被改写。"
 aemusa_ms.920.open:0 "公开已核实记录，允许持续追问。"
 aemusa_ms.920.phased:0 "分阶段公开，并保留独立监督与期限。"
 aemusa_ms.930.title:0 "没有被选中的未来"
 aemusa_ms.930.desc:0 "爱缪莎想起一些曾被担忧、却再也无法验证的可能性。晏华提醒她：这些不是能够重新选择的历史。能够证明的，只是文明共同维持了眼前这一条未来。\n\n胜利没有让观测变成命运的裁决，她也尚不能主动改写现实。"
 aemusa_ms.930.continue:0 "承认未知，不改写已经发生的历史。"
 aemusa_ms.940.title:0 "恢复的先后"
 aemusa_ms.940.desc:0 "战争结束不等于重建完成。中央庭必须安排本国持续行动能力，也不能抹去盟友与更广泛银河中的责任。两种次序都需要公开复核，具体损失与补偿仍须依据现实资料落实。"
 aemusa_ms.940.domestic:0 "先稳住本国服务，并保留盟友恢复承诺。"
 aemusa_ms.940.shared:0 "优先协调共同恢复，同时守住本国基本服务。"
 aemusa_ms.990.title:0 "第二幕之后"
 aemusa_ms.990.desc:0 "中央庭将战争、公开责任与恢复优先级分别归档。爱缪莎现在是共同选择的参与者，仍有拒绝透支的权利；她没有得到主动干涉命运的权限。\n\n第二幕在这里结算，恢复期从这里开始。文明可以继续处理战争留下的问题；下一次危机不会因为这一页而自动到来。"
 aemusa_ms.990.finish:0 "开始恢复，暂不催促下一场危机。"
 aemusa_dialogue.2.title:0 "白夜馆名册"
 aemusa_dialogue.2.desc:0 "前台将一册带有白色封边的委托名册推到屏幕中央。档案没有按星海职务排列，而是沿用原作登记习惯：主线剧情、记忆殿堂、白夜馆・记忆隙间，以及联动来客会分别归档。\n\n已核验：§Y赛斯§!、§Y幽桐§!、§Y拉比§!。待整理：§Y冈部伦太郎§!、§Y格蕾莎§!。"
 aemusa_dialogue.2.central_church:0 "中央庭 / 圣星教会"
 aemusa_dialogue.2.memory_palace:0 "主线剧情 / 记忆殿堂"
 aemusa_dialogue.2.white_night_gap:0 "白夜馆 / 记忆隙间"
 aemusa_dialogue.2.collaboration:0 "联动来客"
 aemusa_dialogue.2.back:0 "返回白夜馆前台。"
 aemusa_dialogue.2.goodbye:0 "合上名册。"
 aemusa_dialogue.3.title:0 "白夜馆通讯"
 aemusa_dialogue.3.desc:0 "右上第一枚菱形框亮起。白夜馆将已经接入星海网络的神器使线路排列在屏幕中央，等待接线。"
 aemusa_dialogue.3.aemusa:0 "联络爱缪莎。"
 aemusa_dialogue.3.seth:0 "联络赛斯。"
 aemusa_dialogue.3.yutong:0 "联络幽桐。"
 aemusa_dialogue.3.rabi:0 "联络拉比。"
 aemusa_dialogue.3.empty:0 "当前没有可接通的神器使。"
 aemusa_dialogue.3.back:0 "返回白夜馆前台。"
 aemusa_dialogue.3.goodbye:0 "结束通讯。"
 aemusa_dialogue.4.title:0 "白夜馆回忆"
 aemusa_dialogue.4.desc:0 "右上第三枚菱形框亮起。这里会归档已经接入白夜馆的神器使通讯、委托记录与后续回忆片段。"
 aemusa_dialogue.4.seth_memory:0 "回放赛斯的通讯记录。"
 aemusa_dialogue.4.yutong_memory:0 "回放幽桐的通讯记录。"
 aemusa_dialogue.4.rabi_memory:0 "回放拉比的通讯记录。"
 aemusa_dialogue.4.empty:0 "当前没有可回放的回忆。"
 aemusa_dialogue.4.back:0 "返回白夜馆前台。"
 aemusa_dialogue.4.goodbye:0 "离开回忆归档。"
 aemusa_dialogue.30.title:0 "赛斯的登记页"
 aemusa_dialogue.30.desc:0 "白夜馆前台翻开一页已经盖好印章的档案。照片下方写着§Y赛斯§!的名字，旁边附着简短的备注：辅助型神器使，神官，权杖・羽蛇神杖。\n\n“不良神官”听起来不太像可靠的行政头衔，但他确实常在最危险的时候赶去救人。接入星海通讯后，赛斯会以行政官身份协助殖民地恢复民心、组织避难与维持白夜馆的临时支援。"
 aemusa_dialogue.30.accept:0 "确认接入赛斯。"
 aemusa_dialogue.30.back:0 "暂不接入，返回名册。"
 aemusa_dialogue.31.title:0 "来自赛斯的通讯"
 aemusa_dialogue.31.desc:0 "“这里是赛斯。白夜馆的值班记录我已经看过了。”\n\n他敲了敲权杖，羽蛇神杖的辉光在通讯画面边缘短暂亮起。\n\n“安抚民众、安排避难点、处理伤员名单，这些交给我就好。至于神官该有的样子……偶尔也可以不那么拘谨吧？”"
 aemusa_dialogue.31.profile:0 "查看赛斯的白夜馆档案。"
 aemusa_dialogue.31.duty:0 "确认赛斯的值班安排。"
 aemusa_dialogue.31.communication:0 "返回白夜馆通讯台。"
 aemusa_dialogue.31.back:0 "返回白夜馆名册。"
 aemusa_dialogue.31.goodbye:0 "结束通讯。"
 aemusa_dialogue.32.title:0 "赛斯：档案页"
 aemusa_dialogue.32.desc:0 "白夜馆调出赛斯的登记页。\n\n§Y姓名§!：赛斯\n§Y称号§!：神官\n§Y属性§!：刚\n§Y定位§!：辅助型神器使\n§Y神器§!：权杖・羽蛇神杖\n§Y登记来源§!：主线剧情 / 中央庭与圣星教会支援线\n\n档案备注写得很克制：他看上去不像传统意义上循规蹈矩的神职者，却总会在民众最需要的时候出现。接入星海后，赛斯暂以§Y行政官§!身份登记，负责殖民地安抚、避难调度与白夜馆临时救援。"
 aemusa_dialogue.32.back:0 "返回赛斯通讯。"
 aemusa_dialogue.32.roster:0 "返回中央庭 / 圣星教会名册。"
 aemusa_dialogue.33.title:0 "赛斯：值班安排"
 aemusa_dialogue.33.desc:0 "“白夜馆的支援线路我已经接上了。”赛斯把一张临时排班表推到镜头前，语气比纸面记录轻松许多。\n\n当前安排随领袖等级提升：\n§Y殖民地安抚§!：每级使管辖行星人口幸福度 §G+1%§!\n§Y避难点维护§!：每级使管辖行星舒适度 §G+1§!\n§Y救援秩序§!：每级使管辖行星稳定度 §G+1§!\n§Y圣星教会支援§!：每级使任职议会时凝聚力产出 §G+1%§!，法令经费 §G+5§!\n\n“我会把伤员名单和避难点放在第一优先级。其他麻烦事，等把人救出来以后再说。”"
 aemusa_dialogue.33.back:0 "返回赛斯通讯。"
 aemusa_dialogue.33.communication:0 "返回白夜馆通讯台。"
 aemusa_dialogue.34.title:0 "幽桐的登记页"
 aemusa_dialogue.34.desc:0 "白夜馆从主线剧情与记忆殿堂档案中调出一页安静的记录。照片下方写着§Y幽桐§!的名字，旁边标注：射手，巧属性，A级，物理伤害，神器为神弓・甘狄拔。\n\n他没有多余的寒暄，只在确认通讯稳定后轻轻点头。接入星海通讯后，幽桐会以指挥官身份协助舰队进行远程压制、火力校准与警戒射击。"
 aemusa_dialogue.34.accept:0 "确认接入幽桐。"
 aemusa_dialogue.34.back:0 "暂不接入，返回名册。"
 aemusa_dialogue.35.title:0 "来自幽桐的通讯"
 aemusa_dialogue.35.desc:0 "通讯接通时，幽桐已经把弓弦调到合适的张力。\n\n“这里是幽桐。航道警戒线和交战距离，我已经看过了。”\n\n他停顿片刻，像是在确认屏幕另一端是否也听见了那声轻微的弦鸣。\n\n“如果需要远程支援，我会在敌人接近之前完成第一轮射击。”"
 aemusa_dialogue.35.profile:0 "查看幽桐的白夜馆档案。"
 aemusa_dialogue.35.duty:0 "确认幽桐的值班安排。"
 aemusa_dialogue.35.communication:0 "返回白夜馆通讯台。"
 aemusa_dialogue.35.back:0 "返回主线剧情 / 记忆殿堂名册。"
 aemusa_dialogue.35.goodbye:0 "结束通讯。"
 aemusa_dialogue.36.title:0 "幽桐：档案页"
 aemusa_dialogue.36.desc:0 "白夜馆调出幽桐的登记页。\n\n§Y姓名§!：幽桐\n§Y定位§!：射手型神器使\n§Y属性§!：巧\n§Y评级§!：A级\n§Y伤害类型§!：物理伤害\n§Y神器§!：神弓・甘狄拔\n§Y登记来源§!：主线剧情 / 记忆殿堂\n\n档案备注很短：他习惯站在队伍后方，以最少的话和最准确的箭完成支援。星海舰队将这种能力转译为远程火力校准与射程优势。"
 aemusa_dialogue.36.back:0 "返回幽桐通讯。"
 aemusa_dialogue.36.roster:0 "返回主线剧情 / 记忆殿堂名册。"
 aemusa_dialogue.37.title:0 "幽桐：值班安排"
 aemusa_dialogue.37.desc:0 "幽桐把一张射界标定图推到屏幕中央，几条细线从舰队阵列延伸到远处的拦截点。\n\n当前安排随领袖等级提升：\n§Y神弓校准§!：每级使所在舰队武器射程 §G+1%§!\n§Y连续压制§!：每级使所在舰队武器射速 §G+5%§!\n§Y精准打击§!：每级使所在舰队武器伤害 §G+5%§!\n\n“我会保持在能看清目标、也能保护同伴的位置。需要我出手的时候，直接下令就好。”"
 aemusa_dialogue.37.back:0 "返回幽桐通讯。"
 aemusa_dialogue.37.communication:0 "返回白夜馆通讯台。"
 aemusa_dialogue.40.title:0 "中央庭 / 圣星教会"
 aemusa_dialogue.40.desc:0 "这一册收纳与中央庭调度、圣星教会支援关系最紧密的神器使。§Y爱缪莎§!作为中央庭七人众之一，负责命运与职责调整；§Y赛斯§!则以神官身份维系中央庭与圣星教会之间的救援线路。"
 aemusa_dialogue.40.seth_recruit:0 "邀请赛斯入驻白夜馆。"
 aemusa_dialogue.40.seth_contact:0 "联络赛斯。"
 aemusa_dialogue.40.aemusa_contact:0 "联络爱缪莎。"
 aemusa_dialogue.40.back:0 "返回名册分类。"
 aemusa_dialogue.40.goodbye:0 "合上这一册。"
 aemusa_dialogue.41.title:0 "主线剧情 / 记忆殿堂"
 aemusa_dialogue.41.desc:0 "这一册收纳从主线剧情与记忆殿堂档案中接入的神器使。\n\n§Y幽桐§!：射手，巧属性，A 级，物理伤害，神器为神弓・甘狄拔。登记来源：主线剧情、记忆殿堂。\n§Y拉比§!：战士，刚属性，A 级，物理伤害，称号为地精，神器为怪兽・阿米特。登记来源：记忆殿堂。"
 aemusa_dialogue.41.yutong_recruit:0 "邀请幽桐入驻白夜馆。"
 aemusa_dialogue.41.yutong_contact:0 "联络幽桐。"
 aemusa_dialogue.41.rabi_recruit:0 "邀请拉比入驻白夜馆。"
 aemusa_dialogue.41.rabi_contact:0 "联络拉比。"
 aemusa_dialogue.41.back:0 "返回名册分类。"
 aemusa_dialogue.41.goodbye:0 "合上这一册。"
 aemusa_dialogue.44.title:0 "拉比的登记页"
 aemusa_dialogue.44.desc:0 "白夜馆从记忆殿堂档案中调出一页边角磨损明显的记录。照片下方写着§Y拉比§!的名字，旁边标注：地精，战士，刚属性，A 级，物理伤害，神器为怪兽・阿米特。\n\n镜头还没完全稳定，他已经把作战图拖到近前，像是随时准备撞开最硬的那道防线。接入星海通讯后，拉比会以指挥官身份协助登陆军进行地面突破、阵地压制与近战清扫。"
 aemusa_dialogue.44.accept:0 "确认接入拉比。"
 aemusa_dialogue.44.back:0 "暂不接入，返回名册。"
 aemusa_dialogue.45.title:0 "来自拉比的通讯"
 aemusa_dialogue.45.desc:0 "通讯接通时，拉比正把一枚标记推到敌方据点正中央。\n\n“这里是拉比。要打哪里，直接标出来。”\n\n他看起来并不喜欢冗长的作战会议，但对突破路线的判断异常干脆。\n\n“我会从最硬的地方进去。后面的人跟上就行。”"
 aemusa_dialogue.45.profile:0 "查看拉比的白夜馆档案。"
 aemusa_dialogue.45.duty:0 "确认拉比的值班安排。"
 aemusa_dialogue.45.communication:0 "返回白夜馆通讯台。"
 aemusa_dialogue.45.back:0 "返回主线剧情 / 记忆殿堂名册。"
 aemusa_dialogue.45.goodbye:0 "结束通讯。"
 aemusa_dialogue.46.title:0 "拉比：档案页"
 aemusa_dialogue.46.desc:0 "白夜馆调出拉比的登记页。\n\n§Y姓名§!：拉比\n§Y称号§!：地精\n§Y定位§!：战士型神器使\n§Y属性§!：刚\n§Y评级§!：A级\n§Y伤害类型§!：物理伤害\n§Y神器§!：怪兽・阿米特\n§Y登记来源§!：记忆殿堂\n\n档案备注很直接：拉比擅长在近距离压制敌方阵线，承担最危险的开路任务。星海舰队将这种能力转译为登陆军地面突破、士气压制与正面攻坚。"
 aemusa_dialogue.46.back:0 "返回拉比通讯。"
 aemusa_dialogue.46.roster:0 "返回主线剧情 / 记忆殿堂名册。"
 aemusa_dialogue.47.title:0 "拉比：值班安排"
 aemusa_dialogue.47.desc:0 "拉比把登陆路线压在屏幕中央，粗重的箭头从轨道投送点一路贯穿到敌方阵地核心。\n\n当前安排随领袖等级提升：\n§Y阿米特突破§!：每级使所指挥陆军伤害 §G+5%§!\n§Y正面压制§!：每级使所指挥陆军士气 §G+3%§!\n§Y近战韧性§!：每级使所指挥陆军生命值 §G+3%§!\n\n“别把路线画得太绕。正面打穿，问题就少一半。”"
 aemusa_dialogue.47.back:0 "返回拉比通讯。"
 aemusa_dialogue.47.communication:0 "返回白夜馆通讯台。"
 aemusa_dialogue.42.title:0 "白夜馆 / 记忆隙间"
 aemusa_dialogue.42.desc:0 "这一册收纳通过白夜馆与记忆隙间登记的神器使。\n\n§Y格蕾莎§!：射手，巧属性，A 级，法术伤害，神器为神符・安卡。登记来源：白夜馆・记忆隙间。"
 aemusa_dialogue.42.gresha_pending:0 "格蕾莎档案整理中。"
 aemusa_dialogue.42.back:0 "返回名册分类。"
 aemusa_dialogue.42.goodbye:0 "合上这一册。"
 aemusa_dialogue.43.title:0 "联动来客"
 aemusa_dialogue.43.desc:0 "这一册收纳不属于交界都市常规来源的联动神器使。\n\n§Y冈部伦太郎§!：来自联动神器使档案。后续接入时会单独处理其世界线观测与通讯风格。"
 aemusa_dialogue.43.okabe_pending:0 "冈部伦太郎档案整理中。"
 aemusa_dialogue.43.back:0 "返回名册分类。"
 aemusa_dialogue.43.goodbye:0 "合上这一册。"
 aemusa_dialogue.10.title:0 "来自爱缪莎的通讯"
 aemusa_dialogue.10.desc:0 "“命运的牌面已经翻开。告诉我，接下来该由我走向战场、治理星球，还是探索未知？”"
 aemusa_dialogue.10.commander:0 "请担任指挥官——让敌人见证逆命之牌。"
 aemusa_dialogue.10.official:0 "请担任行政官——让秩序织成新的命运。"
 aemusa_dialogue.10.scientist:0 "请担任科学家——让群星回答所有疑问。"
 aemusa_dialogue.10.goodbye:0 "暂时不调整职责。"
 # 中央庭守望传统、飞升与科技。
 tradition_artifact_court:0 "中央庭守望"
 tradition_artifact_court_desc:0 "黑门之外是未知的灾厄，黑门之内仍有必须守护的日常。中央庭以神器使为纽带，在七日的轮回里记录命运、守望城市，并将这份意志带向群星。"
 tr_artifact_court_adopt:0 "中央庭集结"
 tr_artifact_court_adopt_desc:0 "§Y领袖经验获取§!：§G+20%§!\n§Y法令经费§!：§G+50§!"
 tr_artifact_court_finish:0 "守望不息"
 tr_artifact_court_finish_desc:0 "§Y法令经费§!：§G+200§!\n§Y全科技研究速度§!：§G+10%§!\n§Y飞升槽位§!：§G+1§!"
 tr_artifact_court_black_gate_watch:0 "黑门守望"
 tr_artifact_court_black_gate_watch_desc:0 "§Y陆军伤害§!：§G+25%§!\n§Y稳定度§!：§G+5§!"
 tr_artifact_court_seven_guardians:0 "七人众协同"
 tr_artifact_court_seven_guardians_desc:0 "§Y指挥官上限§!：§G+2§!\n§Y行政官上限§!：§G+2§!\n§Y海军容量§!：§G+100§!"
 tr_artifact_court_tarot_archive:0 "塔罗档案"
 tr_artifact_court_tarot_archive_desc:0 "§Y研究选项§!：§G+1§!\n§Y科学家初始等级§!：§G+1§!\n§Y全科技研究速度§!：§G+10%§!"
 tr_artifact_court_city_network:0 "都市联络网"
 tr_artifact_court_city_network_desc:0 "§Y凝聚力产出§!：§G+20%§!\n§Y人口舒适度使用§!：§G-10%§!"
 tr_artifact_court_final_day:0 "第七日的约定"
 tr_artifact_court_final_day_desc:0 "§Y境内舰船射速§!：§G+20%§!\n§Y装甲硬化§!：§G+20%§!"
 ap_artifact_user_resonance_path:0 "神器共鸣之路"
 ap_artifact_user_resonance_path_desc:0 "神器使文明开始把契约、武装和生产制度稳定写入国家机器。这是神器使物种线的一段飞升，解锁中期独立军备科技。\n\n§Y三系研究速度§!：§G+5%§!\n§Y合金产出§!：§G+5%§!\n§Y消费品产出§!：§G+5%§!\n§Y海军容量§!：§G+10%§!"
 ap_artifact_user_apotheosis_path:0 "神器终解之路"
 ap_artifact_user_apotheosis_path_desc:0 "神器使不再只是使用神器，而是让整个文明进入终解协议。这是神器使物种线的二段飞升，解锁后期超模军备科技。\n\n§Y三系研究速度§!：§G+10%§!\n§Y合金产出§!：§G+10%§!\n§Y消费品产出§!：§G+10%§!\n§Y凝聚力产出§!：§G+10%§!\n§Y海军容量§!：§G+20%§!\n§Y舰船射速§!：§G+10%§!\n§Y舰船武器伤害§!：§G+10%§!"
 ap_artifact_court_destiny:0 "爱缪莎：命运主宰"
 ap_artifact_court_destiny_desc:0 "当爱缪莎抵达足以独自推演星海分歧的高度，中央庭不再只守望一座都市。该飞升解锁爱缪莎个人科技线。\n\n§Y法令经费§!：§G+250§!\n§Y全科技研究速度§!：§G+15%§!\n§Y海军容量§!：§G+20%§!\n§Y境内舰船射速§!：§G+25%§!\n§Y装甲硬化§!：§G+25%§!\n§Y领袖池容量§!：§G+3§!"
 requires_ascension_perks_2:0 "$TRIGGER_FAIL$需要先选择至少 2 个飞升。"
 requires_ascension_perks_4:0 "$TRIGGER_FAIL$需要先选择至少 4 个飞升。"
 requires_aemusa_level_30:0 "$TRIGGER_FAIL$需要爱缪莎达到 30 级。"
 tech_artifact_tarot_calculation:0 "塔罗演算"
 tech_artifact_tarot_calculation_desc:0 "神器使的直觉并非不可理解的奇迹。通过记录无数牌阵与抉择，中央庭正在建立一门能够预判危险分歧的科学。"
 tech_artifact_black_gate_observation:0 "黑门观测体系"
 tech_artifact_black_gate_observation_desc:0 "将交界都市对黑门的长期观测扩展为跨星系预警网络，使灾厄的征兆无处遁形。"
 tech_artifact_relic_fabrication:0 "神器锻造"
 tech_artifact_relic_fabrication_desc:0 "把神器共鸣的结构稳定地复现于舰船材料之中。星舰将获得如契约者般回应危机的能力。"
 tech_artifact_central_court_protocols:0 "中央庭调度协议"
 tech_artifact_central_court_protocols_desc:0 "将神器使行动、城市巡查和黑门警戒编制成跨殖民地的行政协议，让中央庭不再只是一座城市的中枢。"
 tech_artifact_tarot_economy:0 "塔罗经济演算"
 tech_artifact_tarot_economy_desc:0 "无数次七日轮回留下了足够多的选择样本。中央庭将这些分歧整理成科研、生产与行政预测模型。"
 tech_artifact_resonance_manufacturing:0 "共鸣制造体系"
 tech_artifact_resonance_manufacturing_desc:0 "神器碎片、相位合金与中央庭工坊规范被合并为可复制的后期工业流程。"
 tech_artifact_seven_day_logistics:0 "七日后勤网络"
 tech_artifact_seven_day_logistics_desc:0 "中央庭把每一次轮回中的疏散、补给与作战记录转化为行星级调度制度。"
 tech_artifact_destiny_economy:0 "命运经济矩阵"
 tech_artifact_destiny_economy_desc:0 "在命运观测塔真正完工前，中央庭先行建立行星级演算节点，让科研、工业与守望体系进入同一个经济矩阵。"
 tech_artifact_phase_energy:0 "相位能源网"
 tech_artifact_phase_energy_desc:0 "中央庭将黑门相位涨落接入城市电网，以高风险监测换取稳定的后期能源输出。"
 tech_artifact_phase_extraction:0 "相位矿脉采掘"
 tech_artifact_phase_extraction_desc:0 "神器共鸣可以稳定深层矿脉，使原本难以开采的相位矿层成为可靠的工业来源。"
 tech_artifact_crossing_trade:0 "交界商业网络"
 tech_artifact_crossing_trade_desc:0 "商业街、巡查路线和星际市场被整合为神器使专属贸易网络。"
 tech_artifact_civic_industry:0 "神器民生产业"
 tech_artifact_civic_industry_desc:0 "神器纹样与中央庭工坊规范进入民用制造，使消费品生产兼具都市审美与高维材料稳定性。"
 tech_artifact_rare_resonance:0 "稀有共鸣精炼"
 tech_artifact_rare_resonance_desc:0 "黑门残响与相位材料可以被拆解为易爆微粒、稀有水晶和异星天然气。"
 tech_artifact_covenant_administration:0 "星海契约行政"
 tech_artifact_covenant_administration_desc:0 "中央庭把神器使契约扩展为星际承认、特许与外交协调制度，以此积累政治影响力。"
 tech_artifact_relic_archive_restoration:0 "旧日神器档案修复"
 tech_artifact_relic_archive_restoration_desc:0 "旧日神器残片并非只能作为纪念。被修复、分类和登记后，它们将成为可持续的小型文物来源。"
 tech_artifact_destiny_city_project:0 "命运都市工程"
 tech_artifact_destiny_city_project_desc:0 "中央庭将理想城工程、神器共鸣和命运观测塔前置演算合并，准备把殖民地改造为神器使专属的命运都市。"
 building_artifact_black_gate_observatory:0 "黑门观测站"
 building_artifact_black_gate_observatory_desc:0 "中央庭以塔罗与高维传感器交叉验证黑门异动，并训练塔罗分析员把灾厄征兆转化为可执行的科研结论。"
 building_artifact_relic_workshop:0 "中央庭神器工坊"
 building_artifact_relic_workshop_desc:0 "在严格管控下处理神器碎片与相位合金。神器铸造师在这里为舰队、装甲与命运之主准备后期工业底座。"
 building_artifact_seven_day_command:0 "七日调度中枢"
 building_artifact_seven_day_command_desc:0 "中央庭把轮回中的疏散、巡查、补给与作战经验整合为行星级指挥中心，使黑门守望者能稳定维持都市秩序。"
 building_artifact_fate_calculus_institute:0 "命运经济演算院"
 building_artifact_fate_calculus_institute_desc:0 "一座服务于神器使后期经济的行星级演算院。塔罗分析员与神器铸造师在此共同校准科研、工业和命运观测塔的前置数据。"
 job_artifact_tarot_analyst:0 "塔罗分析员"
