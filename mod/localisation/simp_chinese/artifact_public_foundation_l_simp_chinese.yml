l_simp_chinese:
 tech_artifact_baseline_observation_calibration:0 "基准观测标定"
 tech_artifact_baseline_observation_calibration_desc:0 "从交界都市的旧观测点到远方殖民地，记录只有采用共同尺度，才能彼此比较。基准站持续校正仪器，让研究者分辨测量误差与真正的异常。\n\n§H应用§!：解锁基准观测站；取得黑门观测体系后可升级为黑门观测站。"
 tech_artifact_standard_parts:0 "标准构件工程"
 tech_artifact_standard_parts_desc:0 "统一的尺寸、公差与接头，让损坏的构件能够在遥远殖民地得到替换。可维护性从设计之初就成为工程标准。\n\n§H应用§!：解锁标准件工坊，为材料试制和模块化营建提供场地；取得神器锻造后可升级为中央庭神器工坊。"
 tech_artifact_colony_public_services:0 "殖民地公共服务"
 tech_artifact_colony_public_services_desc:0 "交界都市的重建经验首先关乎人的生活：有水、有食物、有能够求助的地方。殖民规划把供给、维护与社区服务一同带入新的家园。\n\n§H应用§!：解锁社区公共服务中心和基础民生工场，为后续灾害应对与驻防提供场地。"
 building_artifact_baseline_observation_station:0 "基准观测站"
 building_artifact_baseline_observation_station_desc:0 "以经过标定的仪器开展初级观测，为公共研究提供可靠记录。完成黑门观测体系研究后，可以升级为黑门观测站。"
 building_artifact_standard_parts_workshop:0 "标准件工坊"
 building_artifact_standard_parts_workshop_desc:0 "生产可更换的基础构件，并积累工程记录。完成神器锻造研究后，可以升级为中央庭神器工坊。"
 building_artifact_community_service_center:0 "社区公共服务中心"
 building_artifact_community_service_center_desc:0 "由社区协调员维持公共服务、日常联络和公共空间，使殖民地的生活与工作得以持续。研究中央庭灾害统筹后，正常运作且由本国控制的中心在轨道轰炸期间提供稳定度增加5、舒适度需求降低10%的民生保障。"
 building_artifact_basic_civic_factory:0 "基础民生工场"
 building_artifact_basic_civic_factory_desc:0 "将基础原料加工成居民需要的日常用品。完成神器民生产业研究后，可以升级为神器民生工坊。"
 job_artifact_junior_observer:0 "初级观测员"
 job_artifact_junior_observer_plural:0 "初级观测员"
 job_artifact_junior_observer_desc:0 "校准仪器并整理现场记录，为公共科学研究建立可靠的比较基准。"
 mod_job_artifact_junior_observer_add:0 "$job_artifact_junior_observer$岗位"
 job_artifact_standard_parts_worker:0 "标准件技工"
 job_artifact_standard_parts_worker_plural:0 "标准件技工"
 job_artifact_standard_parts_worker_desc:0 "制造通用构件、维护生产接口，并把加工经验转化为工程知识。"
 mod_job_artifact_standard_parts_worker_add:0 "$job_artifact_standard_parts_worker$岗位"
 job_artifact_community_coordinator:0 "社区协调员"
 job_artifact_community_coordinator_plural:0 "社区协调员"
 job_artifact_community_coordinator_desc:0 "安排社区公共服务与日常联络，在实际就业时提供舒适度与少量凝聚力。"
 mod_job_artifact_community_coordinator_add:0 "$job_artifact_community_coordinator$岗位"
 job_artifact_basic_civic_artisan:0 "民生技工"
 job_artifact_basic_civic_artisan_plural:0 "民生技工"
 job_artifact_basic_civic_artisan_desc:0 "加工普通原料，持续生产城市居民需要的消费品。"
 mod_job_artifact_basic_civic_artisan_add:0 "$job_artifact_basic_civic_artisan$岗位"
