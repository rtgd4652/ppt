 mod_job_artifact_directed_resonator_per_pop:0 "每$VALUE$人口提供§G+1§!$job_artifact_directed_resonator$岗位"
 mod_job_artifact_directed_resonator_per_pop_short:0 "每$VALUE$人口§G+1§!£mod_job_artifact_directed_resonator_add£"
 decision_artifact_civil_reserve:0 "工程物资：预留"
 decision_artifact_civil_reserve_desc:0 "投入§Y500矿物、100合金§!，在当地预留一份物资。每个殖民地最多一份。失去殖民地时物资损失，不返还。"
 acs_offer_reserve:0 "投入§Y500矿物、100合金§!，在当地预留一份物资。每个殖民地最多一份。失去殖民地时物资损失，不返还。"
