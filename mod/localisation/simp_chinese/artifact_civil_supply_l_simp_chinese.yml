l_simp_chinese:
 tech_artifact_manufacturing_quality_control:0 "共鸣精密制造"
 tech_artifact_manufacturing_quality_control_desc:0 "持续记录炉况与构件误差，使共鸣制造能够控制更细的公差。生产规模扩大时，合格材料的稳定供应同样得到保障。\n\n§H应用§!：共鸣合金圣炉可升级为共鸣精密合金炉，增加冶金岗位容量并承担更高维护。"
 tech_artifact_distributed_supply_storage:0 "分布式配给仓储"
 tech_artifact_distributed_supply_storage_desc:0 "工程所需的材料在使用之前就被分类、编组和留存。殖民地因此能够在日常供给之外，为明确的施工任务准备物资。\n\n§H应用§!：解锁分布式配给仓。每颗殖民地可付费预留一份工程物资，用于当地施工或后续联运。"
 tech_artifact_directed_resonance_refining:0 "定向共鸣精炼"
 tech_artifact_directed_resonance_refining_desc:0 "同一批原料可以通过不同的共鸣条件偏向某种产物。调节生产线需要时间，却让稀有资源供应能够响应实际需求。\n\n§H应用§!：精炼所可升级为定向共鸣精炼中心，付费切换均衡生产或一种优先产物。"
 tech_artifact_intercolony_transport:0 "星际物资联运"
 tech_artifact_intercolony_transport_desc:0 "物资在始发地就按用途编组，并在接收地完成交接。两处设施共同维护的调度记录，让分散的储备能够服务同一项工程。\n\n§H应用§!：解锁联运换装站，连接一处始发端和一处接收端，转运已预留物资或共同供应大型工程。"
 tech_artifact_covenant_cogovernance:0 "文明契约共治"
 tech_artifact_covenant_cogovernance_desc:0 "公共资源的分配需要让生产、研究与生活保障都拥有明确的位置。共同约定的调整程序，使城市能够有序改变运行重点。\n\n§H应用§!：升级中央庭治理设施，在工业、科研和民生之间付费调整当地方案。"
 building_artifact_precision_alloy_forge:0 "共鸣精密合金炉"
 building_artifact_precision_alloy_forge_desc:0 "在共鸣合金圣炉原址升级。标准检验与稳定炉况提高可用冶金岗位容量，也提高设施维护。"
 building_artifact_directed_resonance_refinery:0 "定向共鸣精炼中心"
 building_artifact_directed_resonance_refinery_desc:0 "在稀有共鸣精炼所原址升级。通过行星决议调整主产物；调整期90日，期间三类产物均按基础配方生产。"
 building_artifact_coordination_center:0 "中央庭统筹中心"
 building_artifact_coordination_center_desc:0 "在中央庭指挥中心原址升级。保留当地驻防接入，并允许选择公共共治方案。与文明共治议事院并存时，同一方案仅提供一份收益。"
 building_artifact_cogovernance_assembly:0 "文明共治议事院"
 building_artifact_cogovernance_assembly_desc:0 "在契约议事厅原址升级。允许通过行星决议选择公共共治方案；与中央庭统筹中心并存时，同一方案仅提供一份收益。"
 building_artifact_distribution_depot:0 "分布式配给仓"
 building_artifact_distribution_depot_desc:0 "通过行星决议支付500矿物和100合金，预留一份当地工程物资。可用于施工、转运或撤回；主动撤回返还80%，失去殖民地不返还。"
 building_artifact_intercolony_terminal:0 "联运换装站"
 building_artifact_intercolony_terminal_desc:0 "与当地配给仓共同运作。通过行星决议登记为始发端或接收端，每国各限一处；两地正常运作时可进行物资调度。"
 job_artifact_directed_resonator:0 "定向共鸣精炼师"
 job_artifact_directed_resonator_desc:0 "按照当前精炼方向调节生产线，在稀有资源之间分配同一批原料。"
 job_artifact_directed_resonator_plural:0 "定向共鸣精炼师"
 job_artifact_directed_resonator_effect_desc:0 "£job_gas_refiner£$job_artifact_directed_resonator_plural$消耗£minerals£§Y矿物§!和£energy£§Y能源§!，生产£volatile_motes£§Y易爆微粒§!、£rare_crystals£§Y稀有水晶§!及£exotic_gases£§Y异星天然气§!。"
