l_simp_chinese:
 artifact_engineering.open:0 "中央庭工程：首都工坊"
 artifact_engineering.title:0 "首都工坊试验"
 artifact_engineering.locked:0 "中央庭希望把个人积累的工作经验转成可以反复使用的工程方法。\n\n先研究§Y塔罗经济演算§!，再由丽或安承担首都工坊试验。共有神器科技沿文明研究路线开放。"
 artifact_engineering.prepare:0 "地点为启动时的首都殖民地，整个试验保持同一个对象。由丽或安单独负责，也可一人主导、一人协作。\n\n每位参与者须完成过一次自己的核心工作，并结束原任务与恢复期。安担任行政官；丽担任行政官或科学家。参与工程期间暂不新开其个人核心任务，转职仍可操作，但不合适的职业会暂停工程。\n\n一次投入：§Y500能源、1000矿物、300合金、200凝聚力§!。所需工作量：§Y120§!；按有效月度工作积累。基础效率20，主导者1～10／11～20／21～30级分别×1／1.25／1.5；协作者分别×1.1／1.2／1.3；已研究共鸣制造体系再×1.25。\n\n完成后选一个后续研究方向作为常驻科技选项，仍需正常研究；原工坊获得五年建设效率+10%，参与者各结算一次200基础经验，实际增长受原生经验结算影响。此首批试验完成一次，不循环领取。若三个方向均已研究或取得常驻选项，无需再新建试验。\n\n先前中止次数：[Root.ae_eng_failed_count]；最近中止前工作量：[Root.ae_eng_last_progress]。"
 artifact_engineering.working:0 "试验对象：§Y[ae_eng_target.GetName]§!\n工作量：§Y[Root.ae_eng_progress]/[Root.ae_eng_required_work]§!；当前有效月度效率：§Y[Root.ae_eng_monthly_work]§!。\n\n已投入：[Root.ae_eng_cost_energy]能源、[Root.ae_eng_cost_minerals]矿物、[Root.ae_eng_cost_alloys]合金、[Root.ae_eng_cost_unity]凝聚力。下一次有效月度工作继续积累，关闭通讯不会中止。\n\n主导成长×[Root.ae_eng_primary_factor]，协作×[Root.ae_eng_support_factor]，文明工程×[Root.ae_eng_civilization_factor]。完成后指定一个研究方向；成果只结算一次。"
 artifact_engineering.paused:0 "试验对象：§Y[ae_eng_target.GetName]§!\n工作量保留：§Y[Root.ae_eng_progress]/[Root.ae_eng_required_work]§!。\n\n目前无法作业。请检查殖民地是否受占领或轰炸，以及参与者是否保持合适职业。安需要行政官职责，丽需要行政官或科学家职责；已参与的人员均须恢复，才能继续。\n\n原物资、人员安排与已完成工作保留；恢复条件后继续按月作业。失去原殖民地所有权或主动止损，会保留成本记录并进入90日整理期，不自动换到新首都。"
 artifact_engineering.ready:0 "首都工坊试验已经完成，研究记录保留。请指定一个仍符合前置条件的后续方向；关闭通讯可以暂缓选择。\n\n已完成的试验不会因重复打开页面再次发放成果。"
 artifact_engineering.finished:0 "首都工坊试验已完成，研究选择或归档已经记录。原工坊的限期建设成果与人物经验已在完成时发放。\n\n已获得的研究选项仍需在科技界面正常研究；这次试验不重复启动。"
 artifact_engineering.start_li:0 "丽独立负责（投入试验物资）"
 artifact_engineering.start_an:0 "安独立负责（投入试验物资）"
 artifact_engineering.start_li_an:0 "丽主导，安协作（投入试验物资）"
 artifact_engineering.start_an_li:0 "安主导，丽协作（投入试验物资）"
 artifact_engineering.require_project:0 "需要塔罗经济演算、可作业的首都、未取得的后续研究方向，以及500能源、1000矿物、300合金、200凝聚力；本项目须空闲且不在整理期。"
 artifact_engineering.require_an:0 "安须为行政官，至少完成过一次时序学习，且没有未结任务或恢复期。"
 artifact_engineering.require_li:0 "丽须为行政官或科学家，至少完成过一次责任投资，且没有未结任务、风险处置或恢复期。"
 artifact_engineering.choose_research:0 "选择后续研究方向"
 artifact_engineering.stop:0 "止损退出，保留成本与记录"
 artifact_engineering.cooldown:0 "90日工程整理期内，暂不重开"
 artifact_engineering.back:0 "返回白夜馆"
 artifact_engineering.close:0 "暂时结束通讯"
 artifact_engineering.result.title:0 "第一次可重复利用的试验条件"
 artifact_engineering.result.desc:0 "工坊已完成校准。现场设施获得五年建设效率+10%，实际参与的人员各结算一次200基础经验，实际增长受原生经验结算影响；这些成果已经记录。\n\n请选择一个仍未研究、尚无常驻选项的方向，建立对应的研究候选。所选科技仍需正常投入科研；前置条件继续有效。其他方向以后仍可沿普通研究路线取得。\n\n若候选已经在试验期间取得，仍可保存并归档此次工作；关闭通讯会保留尚未选择的机会。"
 artifact_engineering.research_manufacturing:0 "材料试验：共鸣制造体系"
 artifact_engineering.research_energy:0 "能源试验：相位能源网"
 artifact_engineering.research_trade:0 "协作网络试验：交界商业网络"
 artifact_engineering.archive:0 "仅归档，不指定研究"
 artifact_engineering.keep_results:0 "保留研究选择，稍后决定"
 artifact_engineering.loss.title:0 "工程现场已经失去"
 artifact_engineering.loss.desc:0 "原首都工坊已失去殖民地或所有权，现场试验中止。投入不会返还；最近工作量[Root.ae_eng_last_progress]与中止记录[Root.ae_eng_failed_count]已经保存，参与者可以恢复其他职责。\n\n90日整理期后，可以在届时符合条件的首都重新投入。旧页面不会替换目标或追加成果。"
 artifact_engineering_calibrated_workshop:0 "首都工坊：协同校准"
 artifact_engineering_calibrated_workshop_desc:0 "实际工程试验形成了可重复利用的施工记录。五年内建筑建设速度+10%。"
