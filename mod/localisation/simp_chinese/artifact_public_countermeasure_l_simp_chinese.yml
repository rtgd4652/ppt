l_simp_chinese:
 tech_artifact_public_countermeasure_plan:0 "公共反制预案"
 tech_artifact_public_countermeasure_plan_desc:0 "中央庭把信号识别资料、可复核的工程方法与联防队伍的现场经验写入同一份预案。研究者说明反制能够干预的部分，物资部门准备器材，常规舰队在接触中把有限的机会转化为实际战果。\n\n§H应用§!：建设全国一处危机联合防务中心。在有效联防和公共档案支持下，投入800能源／500合金／100稀有水晶准备一份反制物资。作战舰队抵达投影所在星系后，由中心下达部署，使当时敌方投影作战舰的武器伤害修正−20%、射速修正−10%，持续90日；全帝国冷却180日。战斗仍由正常舰队完成。"
 building_artifact_crisis_joint_defense_center:0 "危机联合防务中心"
 building_artifact_crisis_joint_defense_center_desc:0 "信号研究、物资准备与现场作战在这里衔接。需要本国已归档的信号鉴别、公共神器工程方法及当地有效联防；全国一处。中心建成后，通过行星决议准备并部署反制。"
 decision_artifact_public_countermeasure_prepare:0 "准备联合反制物资"
 decision_artifact_public_countermeasure_prepare_desc:0 "基础投入800能源、500合金、100稀有水晶，准备一份全国唯一的反制物资，留待现场舰队需要时部署。"
 decision_artifact_public_countermeasure_deploy:0 "为现场舰队部署联合反制"
 decision_artifact_public_countermeasure_deploy_desc:0 "消耗本中心一份已准备物资，支援已经抵达投影星系的本国作战舰队。部署不再收取资源，之后全帝国冷却180日。"
 decision_artifact_public_countermeasure_discard:0 "放弃本中心反制物资"
 decision_artifact_public_countermeasure_discard_desc:0 "释放尚未部署的反制物资名额。材料不返还，其他库存与档案保持各自状态。"
 acc.require_prepare:0 "需要本国公共反制预案研究、已完成的危机信号鉴别与公共神器工程方法，活跃联合防务中心、原有驻防及同星本国轨道接口支持的有效联防。原拥有者控制且无轰炸，全国没有另一份已准备或暂停的反制物资。"
 acc.offer_prepare:0 "按基础800能源／500合金／100稀有水晶一次投入，准备1份反制物资；全国同时一份，暂停时仍占位。可在冷却期间为下一次备料。转让/毁灭会损失库存，放弃不退款。"
 acc.require_deploy:0 "需要原拥有者的可用反制物资，中心与联防仍有效，国家已结束180日冷却。本国作战舰队须由本国控制，非隐形/失能，且已进入有敌方危机投影舰队的星系；目标须存在尚未命中过本次反制的可用作战舰。"
 acc.offer_deploy:0 "消耗本中心1份反制物资，为一处已有本国作战舰队抵达的投影星系部署。命中当时在场的敌方投影作战舰，武器伤害修正−20%、射速修正−10%，90日。全帝国冷却180日；不续期旧命中，不补算后来者。投影仍须通过真实战斗清除，原调查与解析继续各自流程。"
 acc.require_discard:0 "需要本国原拥有者尚未部署的反制物资；中心停用/拆除、占领或研究失效时仍可放弃。"
 acc.offer_discard:0 "只清除本中心一份反制物资，不退款，不清其他库存、公共知识或已发动反制的剩余计时。"
 acc_countermeasure_ready:0 "联合反制物资就绪"
 acc_countermeasure_ready_desc:0 "本中心已支付一份反制物资，全国同时一份。中心/联防失效时保留但不能部署；恢复后继续。转让或毁灭时损失，可由原拥有者放弃，不退款。"
 acc_recharging:0 "联合反制协调中"
 acc_recharging_desc:0 "一次联合反制后的180日国家共享冷却。可提前准备下一份物资，部署需等待冷却结束。"
 acc_projection_disrupted:0 "投影受到联合反制"
 acc_projection_disrupted_desc:0 "信号识别与现场干预正在扰乱这艘投影舰船。武器伤害修正−20%、射速修正−10%，剩余时间由本舰保存；离开星系不会提前解除，重复部署不延长旧命中。"
