 aemusa_ms_flagship_capabilities:0 "获得唯一的§Y现实恒定旗舰§!。它能够参战，并在锚点所在星系提供现场恒定条件；锚点解除还需要普通舰队、巨构解析和现场作业。旗舰在战斗中瘫痪时立即原地复原。如果舰体彻底消失，可在「联络爱缪莎」中免费召回至本国控制的首都。现场恒定不要求爱缪莎占用本舰指挥官槽；若将她指派到本舰，系统会立即解除这一舰队任命，保留她的身份、经验与剧情进度。可为本舰指派普通指挥官。"
 aemusa_ms_flagship_recovery_status:0 "若旗舰已从舰队中消失，可在「联络爱缪莎」中召回。既有锚点战果和损失照常保留。"
 aemusa_contact.recall_flagship:0 "在首都召回「未闭合的航路」。"
