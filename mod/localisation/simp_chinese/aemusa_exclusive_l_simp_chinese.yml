l_simp_chinese:
 aemusa_exclusive.10.close:0 "暂时结束通讯。"
 aemusa_exclusive.10.begin:0 "共同准备，保留误差和退出观测的权利。"
 aemusa_exclusive.10.title:0 "第十一章：不一致的记录"
 aemusa_exclusive.10.desc:0 "白夜馆收到几份尚不能互相解释的记录。爱缪莎能指出正在消失的可能，却无法替我们证明原因。安托涅瓦提议把现场观测、独立实验和公共应对分开核对。\n\n中央庭可交付一艘“现实恒定旗舰”，并开放“现实基线枢纽”的工程建设。舰船承担作战和局部恒定，枢纽承担基线与解析；普通舰队、科研船和公共行动仍须实际参与。\n\n准备完成前不会形成战斗锚点。"
 aemusa_exclusive.20.close:0 "暂时结束通讯。"
 aemusa_exclusive.20.locate:0 "定位下一处现实记录缺口。"
 aemusa_exclusive.20.laboratory:0 "委托独立复核：150能量、50矿物，30天。"
 aemusa_exclusive.20.response:0 "公开风险，部署隔离与资料保护：200能量、150矿物，30天。"
 aemusa_exclusive.20.survey:0 "重新安排未完成的现场测量。"
 aemusa_exclusive.20.relocate:0 "撤下失效、失控或不可达的目标，返回重新定位。"
 aemusa_exclusive.20.confirm:0 "三线记录吻合。公布目标并启动90天预警。"
 aemusa_exclusive.20.title:0 "三线验证与现实准备"
 aemusa_exclusive.20.desc:0 "定位后，请在§Y情报日志§!中选择§Y现场现实基线测量§!，派有科学家的科研船前往目标完成30天项目。定位不会自动完成测量；中断后可重新安排。\n\n独立复核与公共响应各需30天，费用见选项。已完成的工作保留；预警前目标失效或失去控制时，可撤下重选。\n\n同时用工程船建造并升级§Y现实基线枢纽§!。现场测量、两项准备与运行中的枢纽齐备后，即可公开90天预警。\n\n目标需位于本国控制的非首都星系：仅含普通能源或矿物矿藏的无人天体，无异常、遗址或已用锚点。缺少目标时可继续调查与扩张。"
 aemusa_exclusive.25.close:0 "暂时结束通讯。"
 aemusa_exclusive.25.title:0 "预警中的资源节点"
 aemusa_exclusive.25.desc:0 "目标：[aemusa_ms_current_anchor_target.GetName]。预警已经公开，90游戏日后形成锚点；关闭窗口或重新载入不会重置计时。\n\n请将现实恒定旗舰与普通作战舰队部署到该星系，并备好科研船。成锚后，每个没有有效恒定窗口的月度核对增加1点失控压力；累计12点将永久移除这处已锁定的普通资源节点。\n\n局部失败不会删除帝国，也不会抹去已有资料；残余投影仍需真正清理。"
 aemusa_exclusive.30.close:0 "暂时结束通讯。"
 aemusa_exclusive.30.stabilize:0 "旗舰现场恒定：200能量、100矿物，持续180天。"
 aemusa_exclusive.30.field:0 "投影已经清除，派科研船完成30天战后勘查。"
 aemusa_exclusive.30.engineer:0 "弱点资料齐备，派科研船完成30天解除工程。"
 aemusa_exclusive.30.liberate:0 "现实作业已经完成。由爱缪莎重新打开当地的未来。"
 aemusa_exclusive.30.archive:0 "归档本处结果，保留代价与实测资料。"
 aemusa_exclusive.30.title:0 "第十二章：锚点与仍可选择的未来"
 aemusa_exclusive.30.desc:0 "当前目标：[aemusa_ms_current_anchor_target.GetName]。\n失控压力：[Root.aemusa_ms_country_anchor_pressure]/12；有效解析：[Root.aemusa_ms_country_anchor_analysis_ticks]/3；已归档节点：[Root.aemusa_ms_country_anchors_archived]/3。\n\n步骤：普通舰队与旗舰清除投影 → 科研船战后勘查 → 旗舰驻场并支付恒定投入 → 枢纽累计三个有效月度解析 → 科研船解除工程 → 爱缪莎独立重开未来。\n\n旗舰离场、恢复中或本星系失控时，恒定窗口不起效；枢纽被占领时暂停新增解析，已有资料保留。180天窗口可以付费补至180天，历史压力不清零。\n\n失控造成的资源损失不能修复。失败后仍可在遗址完成恒定、勘查和解析，清除残余投影后归档；不会把失败改记成解放。"
 aemusa_exclusive.35.close:0 "暂时结束通讯。"
 aemusa_exclusive.35.title:0 "未能保住的资源节点"
 aemusa_exclusive.35.desc:0 "预警中的失控压力已经达到上限。当地资源节点不再能够维持。若它仍是预先记录的普通矿藏，实际产出已经永久移除；若外部事件更早改变了现场，账本会单独记录这一差异。\n\n这里不能补记为解放，危机也不会替我们复原损失。请清除残余投影，并继续做遗址勘查与解析，随后归档这次失败。"
 aemusa_exclusive.40.close:0 "暂时结束通讯。"
 aemusa_exclusive.40.next:0 "按共同分工定位下一处节点，保留已发生的损失。"
 aemusa_exclusive.40.title:0 "节点之后，有限的核心目标"
 aemusa_exclusive.40.desc:0 "首处闭环使我们能把相关异常限定为三个需要处理的节点，而不是无穷无尽的追逐。还未归档的目标将逐个定位、预警和处理。\n\n晏华要求舰队承担清除现实载体的责任，安托涅瓦负责公开风险、协调保护和保留失败记录。爱缪莎保留暂停观测的权利；她最后需要重新开放未来，却不能替代这些现实行动。\n\n已归档：[Root.aemusa_ms_country_anchors_archived]/3；解放：[Root.aemusa_ms_country_anchors_liberated]；本危机造成的永久资源节点损失：[Root.aemusa_ms_country_anchor_losses]。"
 aemusa_exclusive.50.close:0 "暂时结束通讯。"
 aemusa_exclusive.50.reopen:0 "爱缪莎：在这些现实条件上，重新开放非毁灭的未来。"
 aemusa_exclusive.50.title:0 "第十三章：两把不同的钥匙"
 aemusa_exclusive.50.desc:0 "三个节点的现实载体都已经由实际作战清除，节点结果及现场资料也已归档。文明完成了其中一把钥匙：保存能够保存的现实，并移除了继续制造毁灭的载体。\n\n爱缪莎仍须独立完成另一项工作。请让旗舰停在最后一个节点所在星系，并保证现实基线枢纽运行。失去的资源不会因此回归；这一行动也不是接受最终身份或授予完整命运权限。"
 aemusa_exclusive.60.close:0 "暂时结束通讯。"
 aemusa_exclusive.60.settle:0 "确认危机结束，进入代价清点。"
 aemusa_exclusive.60.title:0 "毁灭不再是唯一结果"
 aemusa_exclusive.60.desc:0 "舰队的战果与爱缪莎重新开放未来的行动分别成立。锚点网络不再能够制造新的正式投影。我们可以确认危机结束，但不能据此宣称已经理解世界的一切。\n\n对外公开可验证的观测、行动和代价；尚未证实的问题继续保持未知。"
 aemusa_exclusive.80.close:0 "暂时结束通讯。"
 aemusa_exclusive.80.record:0 "记录代价，让众人先恢复。"
 aemusa_exclusive.80.title:0 "危机后的静默"
 aemusa_exclusive.80.desc:0 "解放节点：[Root.aemusa_ms_country_anchors_liberated]；永久失去的资源节点：[Root.aemusa_ms_country_anchor_losses]。\n\n中央庭保留全部失败记录与恢复责任。过去的损失没有因为最后的胜利被抹掉，已经验证的资料也不会随着战斗结束失去意义。\n\n爱缪莎察觉到新的问题，但现在仍不足以回答。下一步应是危机后的调查与对话，而不是催促她接受另一个身份。"
 aemusa_exclusive.90.close:0 "暂时结束通讯。"
 aemusa_exclusive.90.title:0 "第十三章之后"
 aemusa_exclusive.90.desc:0 "专属危机已经结束，节点结果和永久损失已经保存。第十四章以后的真相调查、三种结局和正式转变属于下一里程碑。\n\n这份记录不会自动授予最终授权，也不要求此刻已经达到30级。"
 AEMUSA_MS_ANCHOR_SURVEY:0 "现场现实基线测量"
 AEMUSA_MS_ANCHOR_SURVEY_DESC:0 "前往标记天体测量异常。独立于第八章历史资料，需要科研船和科学家30天现场作业。"
 AEMUSA_MS_ANCHOR_FIELD:0 "投影清除后的空间勘查"
 AEMUSA_MS_ANCHOR_FIELD_DESC:0 "清除投影后，科研船用30天采集当地物质、能量与空间残余。宿主已失去也可以留下真实记录。"
 AEMUSA_MS_ANCHOR_ENGINEERING:0 "现实解除工程"
 AEMUSA_MS_ANCHOR_ENGINEERING_DESC:0 "完成弱点解析后进行30天现场工程。完成时仍需有效恒定窗口及运行枢纽；若条件失效，可恢复后重新安排。"
 aemusa_ms.1560.exclusive:0 "查看专属危机的观测与共同准备。"
 NAME_Aemusa_Convergence:0 "毁灭收敛投影"
 NAME_Aemusa_Projection:0 "现实载体"
 aemusa_exclusive_assets_hint:0 "获得唯一现实恒定旗舰，并开放两阶段现实基线枢纽。原版模型为开发占位；旗舰损毁后免费等待90天，在有效首都恢复。枢纽总建设需360天、750合金和300凝聚力。"
 aemusa_exclusive_warning_hint:0 "90天预警不会因重开或读档重置。成锚后的12个无有效恒定月份会导致已锁定普通资源节点永久损失。"
 aemusa_exclusive_relocate_hint:0 "仅适用于尚未公开预警的失效、失控目标，或可用旗舰没有航路抵达的目标。撤销该处测量记录并返回待定位；公共响应、独立复核和既有损失保留。旗舰暂时恢复中不构成重选理由，已公开的预警不能借此重置。"
