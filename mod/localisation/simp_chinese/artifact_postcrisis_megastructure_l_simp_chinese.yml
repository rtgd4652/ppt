l_simp_chinese:
 tech_artifact_postcrisis_megastructure_engineering:0 "传承造境工程"
 tech_artifact_postcrisis_megastructure_engineering_desc:0 "造境工程把物质处理、行星尺度的能量分配与环境建设纳入同一项长期施工。中央庭将胜利后解译的观测资料交给工程团队，使荒芜天体的地表、水循环和大气成为能够共同设计的对象。文明由此获得将一颗不宜居世界建设为新家园的能力，殖民者仍需亲自完成此后的定居与发展。\n\n§H应用§!：解译共同胜利资料后，开放传承造境平台。建造船在本国受控星系的已调查、10～30规模空置荒芜星球旁建设基址，再升级为运行态；启用法令将该星球改为普通大陆世界，随后正常殖民。矿藏、异常、遗址、正在改造或殖民的天体及旧危机锚点均不纳入；正常建设要求本国尚无平台，每处启用一次。"
 artifact_postcrisis_world_former_0:0 "传承造境平台基址"
 artifact_postcrisis_world_former_0_DESC:0 "围绕荒芜世界建设物料处理、供能与环境观测的施工枢纽，让后续行星工程具备可以依托的现场。\n\n180天基础工期，投入5000合金和2000能源，基址维护10能源/月；升级为运行态后才能启用造境。"
 artifact_postcrisis_world_former_0_MEGASTRUCTURE_DETAILS:0 "将地表处理、水循环与大气建设组织为行星尺度的工程，把安全空置荒芜世界变为可供正常殖民的大陆世界。需要先建设基址、再升级并主动启用；正常建设限本国尚无平台，每处启用一次。"
 artifact_postcrisis_world_former_1:0 "传承造境平台"
 artifact_postcrisis_world_former_1_DESC:0 "平台已经具备统筹行星尺度物质处理、能量分配与环境建设的条件。造境完成后，新世界能够承接正常殖民，让一次巨型工程的成果延续为居民的家园。\n\n升级投入10000合金和5000能源、基础工期360天，运行维护25能源/月。保持星系控制与目标安全，通过“启用传承造境平台”法令完成一次造境；完成后世界自持，平台保留且仍有维护。"
 edict_edict_artifact_activate_world_former:0 "启用传承造境平台"
 edict_edict_artifact_activate_world_former_desc:0 "为一处本国拥有、星系仍受控制的运行态平台启用造境系统。目标将成为普通大陆世界，并具备瀑流、富矿山脉与沃土地貌；殖民和后续开发仍由正常流程完成。平台保留且每处只生效一次；兼并取得多处时，每次启用一处合格平台。入口1天后可再次使用，效果点击时立即执行。"
 apm_requires_owned_controlled_system:0 "星系必须属于本国，且星港控制者与拥有者一致。"
 apm_requires_no_owned_platform:0 "本国不能同时拥有另一处传承造境平台或基址。"
 apm_requires_safe_barren_world:0 "需要已调查、规模10～30的空置荒芜或寒冷荒芜非卫星天体；不能有矿藏、异常、遗址、其他巨构、正在改造/殖民或旧危机锚点记录。"
 apm_requires_ready_platform:0 "需要本国已研究传承造境工程并解译共同胜利资料，以及一处尚未启用的运行态平台；星系保持本国控制，目标仍符合造境条件。"
 apm_world_forming_result:0 "一处合格平台将目标改造为§Y大陆世界§!，生成适用的能源、采矿与农业地貌；不额外收费。每处仅能启用一次，随后正常殖民，平台继续维护。"
