 ARTIFACT_TERMINAL_HYPER_DRIVE:0 "终解承载航道引擎"
 ARTIFACT_TERMINAL_HYPER_DRIVE_DESC:0 "经过承载联试的航道引擎，改善充能和超空间航行。需要本国承载定型记录，保留普通航道航行方式。"
 ARTIFACT_TERMINAL_LOAD_FRAME:0 "终解承载缓冲器"
 ARTIFACT_TERMINAL_LOAD_FRAME_DESC:0 "辅助槽中的承载框架与缓冲结构提高舰体耐久并提供比例减伤。需要本国承载定型记录，代价为功率、合金和维护投入。"
