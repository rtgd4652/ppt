l_simp_chinese:
 tech_artifact_terminal_hull_support:0 "终解舰体承载"
 tech_artifact_terminal_hull_support_desc:0 "神器研究需要普通工业提供仪器、材料与安全环境。中央庭将共鸣设备的负荷记录交给造舰团队，让供能、推进与防护在同一套承载结构上协同运行；能够复制的是经过试验的构件和工艺。\n\n§H应用§!：在工程物资集成场投入一份大型工程备料，完成6次有效月度的舰体承载试验，永久取得本国承载定型记录。开放承载缓冲器；结合舰载相位供能、相位机动推进和超空间航行协调，分别开放对应高阶组件。仍须正常付费造舰或改装。"
 decision_artifact_civil_hull_start:0 "舰体承载试验"
 decision_artifact_civil_hull_start_desc:0 "将当地一份工程备料交付承载试验，检验供能、推进与防护结构在持续负荷下的协同。全国同时开展一项，定型后无需重复试验。"
 decision_artifact_civil_hull_cancel:0 "撤销承载试验"
 decision_artifact_civil_hull_cancel_desc:0 "撤销未完成的承载试验，丢弃本次进度。已经投入的材料不返还，其他库存保留。"
 decision_artifact_civil_hull_status:0 "查看舰体承载记录"
 decision_artifact_civil_hull_status_desc:0 "查看当地试验进度或本国定型记录。"
 artifact_hull.require_start:0 "需要原拥有者控制且无轰炸、活跃配给仓、联运站、工程物资集成场和相关研究，以及当地1份可用大型工程备料。供给身份须为常规联运接收端，或E11已登记的工程接收点。本国尚未定型，且没有另一项进行中或暂停的承载试验。"
 artifact_hull.offer_start:0 "消耗1份大型工程备料，开始6次有效月度的承载试验。试验完成后永久取得本国承载定型记录，开放相应公共组件；造舰与改装仍需正常付费。"
 artifact_hull.require_cancel:0 "需要原拥有者控制、无轰炸，且当地有本国尚未完成的承载试验。"
 artifact_hull.offer_cancel:0 "清除本次试验和进度；已投入材料不返还，其他普通物资与工程备料保留。"
 artifact_hull.title:0 "舰体承载记录"
 artifact_hull.intro:0 "尚未取得本国承载定型记录。\n\n在有效工程物资集成场投入1份大型工程备料，完成6次有效月度试验。当地须为常规接收端，或掌握星系协同基础设施后登记的工程接收点；后者可从其他星系运入备料。"
 artifact_hull.working:0 "§Y承载试验进行中§!\n有效工作：[Root.acs_hull_work|0]/6。\n\n本次备料已经投入。保持当地设施、控制与常规／工程接收身份，试验将按月继续；不再分段追加材料。"
 artifact_hull.paused:0 "§Y承载试验暂停§!\n有效工作：[Root.acs_hull_work|0]/6。\n\n请恢复本国控制、结束轰炸，并恢复配给仓、联运站、集成场、常规／工程接收身份及相应研究。已付材料及进度保留，停工月份不补算。"
 artifact_hull.qualified:0 "§G承载定型记录已归档§!\n\n本国可在正常舰船设计器中选用承载缓冲器。反应堆、推进器、航道引擎还分别要求舰载相位供能、相位机动推进、超空间航行协调研究。\n\n首批适配护卫舰、雷击舰、驱逐舰、巡洋舰和战列舰。造舰或改装仍由正常船厂完成。定型知识已归本国，场地停用或失去该殖民地不会抹去记录；其他国家不能继承未完成的试验。"
 artifact_hull.close:0 "关闭承载记录"
 acs_hull_project:0 "舰体承载试验"
 acs_hull_project_desc:0 "已交付工程备料，全国同时一项。经6次有效月度取得公共组件定型记录；通过行星决议查看进度或撤销。"
 acs_hull_qualified:0 "舰体承载定型"
 acs_hull_qualified_desc:0 "承载试验成果已归档，永久开放对应公共组件的装配资格；各组件仍要求相应分支研究。本记录自身不提供战斗修正，也不发放舰船。"
 CORVETTE_ARTIFACT_TERMINAL_REACTOR:0 "轻型终解承载反应堆"
 CORVETTE_ARTIFACT_TERMINAL_REACTOR_DESC:0 "经承载试验定型的高负荷供能组件。提高可用功率，并承担更高的合金造价和维护；需要本国承载定型记录。"
 CORVETTE_ARTIFACT_TERMINAL_THRUSTER:0 "轻型终解承载推进器"
 CORVETTE_ARTIFACT_TERMINAL_THRUSTER_DESC:0 "承载框架在机动过程中分散共鸣设备的负荷，提高亚光速机动能力；消耗更多功率，需要本国承载定型记录。"
