l_simp_chinese:
 tech_artifact_public_reproduction_protocol:0 "公共研究复现协议"
 tech_artifact_public_reproduction_protocol_desc:0 "将经过实际试验的方法提交、复核并归档，让公共知识可以在另一处设施复现。\n\n样本分析或材料试制完成后，趁成果有效，在§Y当地公共项目§!页通过活跃的§Y记忆档案室／中央庭记忆宫§!免费归档。每国每种方法只需一次。随后可在研究园区付费复现；已消失的历史成果不会自动补算，也不授予个人命运权限。"
 tech_artifact_research_campus_integration:0 "研究园区整合"
 tech_artifact_research_campus_integration_desc:0 "把演算、人员和实验条件整合为可持续使用的公共科研平台。\n\n解锁§Y公共研究园区§!，提供400单位研究主管容量，可沿原槽升级§Y命运研究尖塔§!。已研究公共研究复现协议且归档对应方法后，可经受控样本分析／工坊公共工程页投入§Y300能源、150消费品§!，经§Y6次有效月度§!复现成果。"
 building_artifact_public_research_campus:0 "公共研究园区"
 building_artifact_public_research_campus_desc:0 "园区将已经归档的方法变成可重复使用的实验条件，无需把原始危险样本搬到每一颗殖民地。\n\n提供§Y400单位研究主管容量§!；研究及本国档案满足后，可复现样本或材料成果。与其他公共工程共用当地项目名额，现场失效时保留进度并暂停。"
 artifact_research.archive_sample:0 "提交并归档这份样本分析成果"
 artifact_research.archive_materials:0 "提交并归档这份材料试制成果"
 artifact_research.require_archive_sample:0 "需要公共研究复现协议、当地仍有效的样本分析成果、活跃的记忆档案室或中央庭记忆宫、拥有与控制一致且无轰炸；本国尚未归档此方法。旧窗口在转让后不可使用。"
 artifact_research.require_archive_materials:0 "需要公共研究复现协议、当地仍有效的材料试制成果、活跃的记忆档案室或中央庭记忆宫、拥有与控制一致且无轰炸；本国尚未归档此方法。旧窗口在转让后不可使用。"
 artifact_research.archive_offer:0 "免费把方法保存在本国公共档案中；不消耗或延长当地成果，不赠送科技与资源。其他殖民地可在具备条件后付费复现。已归档时无需重复提交。"
 artifact_foundation.start_reproduce_sample:0 "复现已归档的样本分析方法"
 artifact_foundation.start_reproduce_materials:0 "复现已归档的材料试制方法"
 artifact_foundation.offer_reproduce_sample:0 "投入§Y300能源、150消费品§!，经§Y6次有效月度§!复现。完成后当地岗位物理研究+10%，持续720日；与当地其他公共方案互斥。无需原始样本保管库。"
 artifact_foundation.offer_reproduce_materials:0 "投入§Y300能源、150消费品§!，经§Y6次有效月度§!复现。完成后当地岗位工程研究+10%，持续720日；与当地其他公共方案互斥。无需原始材料工坊。"
 artifact_foundation.require_reproduce_sample:0 "需要公共研究复现协议、研究园区整合、本国已归档样本方法、当地活跃研究园区或研究尖塔、实际控制且无轰炸、空闲公共名额，以及300能源／150消费品。"
 artifact_foundation.require_reproduce_materials:0 "需要公共研究复现协议、研究园区整合、本国已归档材料方法、当地活跃研究园区或研究尖塔、实际控制且无轰炸、空闲公共名额，以及300能源／150消费品。"
 artifact_foundation.working_reproduce_sample:0 "现场：§Y[Root.GetName]§!\n方案：§Y公共样本成果复现§!\n进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n已投入300能源、150消费品。活跃研究园区或研究尖塔按月复现本国已归档方法，无需把原始危险样本搬到当地。完成后物理岗位研究+10%，持续720日。"
 artifact_foundation.paused_reproduce_sample:0 "现场：§Y[Root.GetName]§!\n方案：§Y公共样本成果复现§!\n保留进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n现场控制、轰炸、研究资格或园区不可用，工作暂停。已付物资不再次收取；恢复合格现场后继续，园区升级为研究尖塔可接续。转让、毁灭或主动中止不退费。"
 artifact_foundation.working_reproduce_materials:0 "现场：§Y[Root.GetName]§!\n方案：§Y公共材料成果复现§!\n进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n已投入300能源、150消费品。活跃研究园区或研究尖塔按月复现本国已归档方法，无需当地原材料工坊。完成后工程岗位研究+10%，持续720日。"
 artifact_foundation.paused_reproduce_materials:0 "现场：§Y[Root.GetName]§!\n方案：§Y公共材料成果复现§!\n保留进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n现场控制、轰炸、研究资格或园区不可用，工作暂停。已付物资不再次收取；恢复合格现场后继续，园区升级为研究尖塔可接续。转让、毁灭或主动中止不退费。"
