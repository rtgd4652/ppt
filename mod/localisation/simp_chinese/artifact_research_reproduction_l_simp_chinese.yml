l_simp_chinese:
 tech_artifact_public_reproduction_protocol:0 "实验复现体系"
 tech_artifact_public_reproduction_protocol_desc:0 "研究方法与结果一起保存，其他研究者才能重新建立相同的实验条件。一次试验的价值因此能够延伸到更多殖民地。\n\n§H应用§!：通过当地项目页归档仍有效的样本或材料成果；配合科研园区，在其他殖民地付费复现对应成果。完成公共神器理论汇编后，也可在合格工程现场复现。"
 tech_artifact_research_campus_integration:0 "科研平台工程"
 tech_artifact_research_campus_integration_desc:0 "黑门研究曾依赖少数难以重建的现场条件。长期科研平台把隔离、标定、演算和人员支持纳入可维护的设施，使已经归档的方法能在其他殖民地重新实施。中央庭因此能够围绕共同的实验条件接续研究，而无需每次从危险的首次接触开始。\n\n§H应用§!：解锁公共研究园区，可升级为命运研究尖塔。掌握$tech_artifact_public_reproduction_protocol$并归档方法后，可付费复现样本或材料成果。"
 building_artifact_public_research_campus:0 "公共研究园区"
 building_artifact_public_research_campus_desc:0 "园区将已经归档的方法变成可重复使用的实验条件，无需把原始危险样本搬到每一颗殖民地。\n\n提供§Y400单位研究主管容量§!；研究及本国档案满足后，可复现样本或材料成果。与其他公共工程共用当地项目名额，现场失效时保留进度并暂停。"
 artifact_research.archive_sample:0 "提交并归档这份样本分析成果"
 artifact_research.archive_materials:0 "提交并归档这份材料试制成果"
 artifact_research.require_archive_sample:0 "需要$tech_artifact_public_reproduction_protocol$、当地仍有效的样本分析成果、活跃的记忆档案室或中央庭记忆宫、拥有与控制一致且无轰炸；本国尚未归档此方法。旧窗口在转让后不可使用。"
 artifact_research.require_archive_materials:0 "需要$tech_artifact_public_reproduction_protocol$、当地仍有效的材料试制成果、活跃的记忆档案室或中央庭记忆宫、拥有与控制一致且无轰炸；本国尚未归档此方法。旧窗口在转让后不可使用。"
 artifact_research.archive_offer:0 "免费把方法保存在本国公共档案中；不消耗或延长当地成果，不赠送科技与资源。其他殖民地可在具备条件后付费复现。已归档时无需重复提交。"
 artifact_foundation.start_reproduce_sample:0 "复现已归档的样本分析方法"
 artifact_foundation.start_reproduce_materials:0 "复现已归档的材料试制方法"
 artifact_foundation.offer_reproduce_sample:0 "投入§Y300能源、150消费品§!，经§Y6次有效月度§!复现。完成后当地岗位物理研究+10%，持续720日；与当地其他公共方案互斥。无需原始样本保管库。"
 artifact_foundation.offer_reproduce_materials:0 "投入§Y300能源、150消费品§!，经§Y6次有效月度§!复现。完成后当地岗位工程研究+10%，持续720日；与当地其他公共方案互斥。无需原始材料工坊。"
 artifact_foundation.require_reproduce_sample:0 "需要本国已归档样本方法、$tech_artifact_public_reproduction_protocol$、实际控制且无轰炸、空闲公共名额，以及300能源／150消费品。场地满足其一：掌握$tech_artifact_research_campus_integration$的活跃研究园区或研究尖塔；已汇编公共神器工程方法，且掌握对应场地研究的活跃工程物资集成场或规则锚定试验场。"
 artifact_foundation.require_reproduce_materials:0 "需要本国已归档材料方法、$tech_artifact_public_reproduction_protocol$、实际控制且无轰炸、空闲公共名额，以及300能源／150消费品。场地满足其一：掌握$tech_artifact_research_campus_integration$的活跃研究园区或研究尖塔；已汇编公共神器工程方法，且掌握对应场地研究的活跃工程物资集成场或规则锚定试验场。"
 artifact_foundation.working_reproduce_sample:0 "现场：§Y[Root.GetName]§!\n方案：§Y公共样本成果复现§!\n进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n已投入300能源、150消费品。合格科研或工程场地按月复现本国已归档方法，无需把原始危险样本搬到当地。完成后物理岗位研究+10%，持续720日。"
 artifact_foundation.paused_reproduce_sample:0 "现场：§Y[Root.GetName]§!\n方案：§Y公共样本成果复现§!\n保留进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n现场控制、轰炸、研究资格或场地不可用，工作暂停。已付物资不再次收取；恢复合格现场后继续。园区升级可接续，工程路线还需本国公共工程资格与对应场地研究。转让、毁灭或主动中止不退费。"
 artifact_foundation.working_reproduce_materials:0 "现场：§Y[Root.GetName]§!\n方案：§Y公共材料成果复现§!\n进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n已投入300能源、150消费品。合格科研或工程场地按月复现本国已归档方法，无需当地原材料工坊。完成后工程岗位研究+10%，持续720日。"
 artifact_foundation.paused_reproduce_materials:0 "现场：§Y[Root.GetName]§!\n方案：§Y公共材料成果复现§!\n保留进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n现场控制、轰炸、研究资格或场地不可用，工作暂停。已付物资不再次收取；恢复合格现场后继续。园区升级可接续，工程路线还需本国公共工程资格与对应场地研究。转让、毁灭或主动中止不退费。"
