l_simp_chinese:
 tech_artifact_long_range_phase_projection:0 "长程相位投射"
 tech_artifact_long_range_phase_projection_desc:0 "将相位能量集中并维持到更远距离，使舰队能够在目标接近前展开火力。稳定投射所需的准备限制了开火频率。\n\n§H应用§!：解锁远程相位武器；较低追踪和较长发射间隔使其更适合远距交战。"
 tech_artifact_layered_phase_defense:0 "分层相位防御"
 tech_artifact_layered_phase_defense_desc:0 "多层防护分别处理冲击与穿透，降低单一防护层失效后的风险。分层结构需要更复杂的供能与维护。\n\n§H应用§!：解锁分层护盾；另具备符文舰体装甲研究时，可使用复合符文装甲。"
 tech_artifact_battle_damage_reclamation:0 "舰内维修循环"
 tech_artifact_battle_damage_reclamation_desc:0 "受损材料经过分选与处理，重新进入舰内维修流程。恢复设备和材料循环共同降低长期航行的补给压力。\n\n§H应用§!：解锁辅助槽维修模块，恢复舰体与装甲，并降低本舰维护；装置持续消耗能源和材料。"
 tech_artifact_hyperspace_coordination:0 "超空间航行协调"
 tech_artifact_hyperspace_coordination_desc:0 "舰载系统持续校正进入航道前的相位条件，减少充能准备中的冗余。舰队因而能够更有效地沿既有航道移动。\n\n§H应用§!：解锁协同超空间引擎，以更高功耗与维护改善充能和星际航行效率。"
 tech_artifact_resonance_siege_engineering:0 "共鸣攻坚工程"
 tech_artifact_resonance_siege_engineering_desc:0 "共鸣防护与重型突破装备共同支撑持续推进。更高耐久让部队能够承担强攻任务，也提高了部署成本与战场破坏。\n\n§H应用§!：解锁共鸣攻坚军，具有较高耐久，同时承担更长训练、更高维护和更大附带伤害。"
