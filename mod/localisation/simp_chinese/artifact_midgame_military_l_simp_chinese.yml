 tech_artifact_long_range_phase_projection:0 "长程相位投射"
 tech_artifact_long_range_phase_projection_desc:0 "把相位能量汇聚为远距离投射，扩大交战距离。低追踪与较长发射间隔使其不擅长应付近身高速目标。"
 tech_artifact_layered_phase_defense:0 "分层相位防御"
 tech_artifact_layered_phase_defense_desc:0 "分层维持相位护盾并缓解穿透；复合符文装甲还需要实体装甲研究。更高功耗、制造和维护投入构成防护代价。"
 tech_artifact_battle_damage_reclamation:0 "战损回收与补给"
