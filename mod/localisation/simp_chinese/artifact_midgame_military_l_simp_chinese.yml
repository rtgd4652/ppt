 tech_artifact_hyperspace_coordination:0 "超空间航行协调"
 tech_artifact_hyperspace_coordination_desc:0 "通过航道协同缩短超空间充能并改善星际航行。以更高功耗与维护换取常规航道效率。"
 tech_artifact_resonance_siege_engineering:0 "共鸣攻坚工程"
