l_simp_chinese:
 tech_artifact_high_dimensional_model_review:0 "高维模型复核"
 tech_artifact_high_dimensional_model_review_desc:0 "联校让分散记录具有了共同尺度，受控实验则为解释这些记录划定了边界。研究者将假说的适用条件写入可重复审查的档案，再把已经掌握的危机事实和实际损失逐项纳入比对。每一次修正都应说明证据来自哪里，还有哪些问题尚未得到回答。\n\n§Y应用：§!将黑门观测站升级为高维观测复核站。取得本国联校档案与真实公共接口后，可付费完成四次有效月度复核，保存模型档案；新出现的已知危机事实和锚点损失可付费补录。成果为后续公共理论保留依据，升级继续承接原样本比对与地方观测支持。"
 building_artifact_high_dimensional_review_station:0 "高维观测复核站"
 building_artifact_high_dimensional_review_station_desc:0 "在既有塔罗分析与异常记录比对的基础上，提供模型复核所需的工作条件。沿用原岗位与样本比对收益，并继续承担跨殖民地联校对照端和地方观测方案的供源。"
 decision_artifact_model_review_start:0 "模型复核：启动公共复核"
 decision_artifact_model_review_start_desc:0 "投入600能源、300消费品、100稀有水晶，在本站进行四次有效月度复核。需要本国已完成的联校档案，以及受控实验结算得到的真实公共接口；每国同时一处。"
 decision_artifact_model_review_append:0 "模型复核：补录已知事实"
 decision_artifact_model_review_append_desc:0 "投入300能源、100消费品，将新出现的已知危机事实或实际锚点损失纳入已完成的复核档案。只在存在尚未纳入的新资料时执行。"
 decision_artifact_model_review_status:0 "模型复核：查看进度与档案"
 decision_artifact_model_review_status_desc:0 "查看当地工作量和本国已完成的模型/事实复核记录。查看不付款、不推进工作或改写主线。"
 decision_artifact_model_review_cancel:0 "模型复核：撤销未完成工作"
 decision_artifact_model_review_cancel_desc:0 "由本次复核的原拥有国撤销当地工作；设施失效或暂时失控时也可放弃登记。已投入物资不退还，其他工程库存和已完成国家档案保留。"
 amr.requires_start:0 "需要本国控制、未受轰炸的活动高维观测复核站，本国联校档案、边界稳定研究和已结算的公共接口；本国尚未完成模型复核，也没有另一处正在进行。"
 amr.requires_new_records:0 "需要有效复核站、本国模型档案，以及尚未纳入的既有危机事实或实际锚点损失记录。没有新资料时不重复付费。"
 amr.requires_owner:0 "只能由本次复核的原拥有国撤销当地登记；殖民地转让后按既有拥有者记录清理。"
 amr.offer_start:0 "开始§Y4次有效月度§!的模型复核。控制、观测设施、资料或安全条件暂时失效时保留工作量；原拥有者变更时清理未完成项目，投入不返还。\n\n完成后保存本国模型档案；当时确实存在的危机事实和锚点损失一并核对，无资料时只完成普通模型。"
 amr.offer_append:0 "把当前尚未纳入的危机事实和/或锚点损失补入本国档案。此操作不生成危机、不改变已有损失，也不表示反制或战争胜利已经通过。"
 amr.offer_cancel:0 "撤销本次未完成复核，不退款；保留其他库存、联校成果和已完成的国家知识。"
 amr.title:0 "高维模型复核"
 amr.intro:0 "本国尚未完成公共模型复核。\n\n请先完成跨殖民地观测联校，并将受控边界实验的真实结果提交为公共接口。两项成果就绪后，可在活动复核站投入物资，完成四次有效月度。\n\n普通复核可在危机发生以前进行；它为后续公共理论保存可审查依据。"
 amr.working:0 "§Y模型复核进行中§!\n有效工作：[Root.acs_model_review_work|0]/4。\n\n正在用本国联校档案与受控实验接口核对模型的适用条件。每个有效月度完成一份工作，不再次扣费。"
 amr.paused:0 "§Y模型复核暂停§!\n有效工作：[Root.acs_model_review_work|0]/4。\n\n请恢复本国控制、结束轰炸，使复核站和必要资料资格重新有效。已完成工作保留，停工月份不补算；转让或消失清理未完成项目。"
 amr.reviewed_basic:0 "§G公共模型已复核§!\n本国模型档案已保存，可供后续公共理论使用。\n\n当前尚未纳入危机事实或锚点损失。以后取得新资料时，可在有效复核站付费补录；这份普通模型不代表危机反制已得到验证。"
 amr.reviewed_crisis:0 "§G公共模型已复核§!\n已有危机事实已与模型背景一并核对；尚无已纳入的实际锚点损失。\n\n危机发生记录或现场基准不等于反制已经成功。以后出现实际损失，可付费补录。"
 amr.reviewed_loss:0 "§G公共模型已复核§!\n已核对实际锚点损失，原损失结果保留；尚无已纳入的危机背景记录。\n\n后续新资料可付费补录，复核不会恢复已失资源或改写历史。"
 amr.reviewed_both:0 "§G公共模型已复核§!\n既有危机事实和实际锚点损失均已纳入本国档案。\n\n这些记录为后续公共研究保留依据；损失本身没有被清除，反制成效仍需实际行动证明。"
 amr.close:0 "结束查看"
 acs_model_review_project:0 "公共模型复核中"
 acs_model_review_project_desc:0 "本站已投入公共模型复核。保持活动设施、本国控制与真实资料资格，按有效月度完成；转让时不让新国家继承进度。"
 amr_model_reviewed:0 "公共模型复核档案"
 amr_model_reviewed_desc:0 "本国已完成联校数据与受控公共接口的模型复核。知识在设施失效后仍保留，为后续公共理论提供资格。"
 amr_crisis_context_reviewed:0 "既有危机事实复核"
 amr_crisis_context_reviewed_desc:0 "本国已将原有危机发生记录或现场基准纳入模型背景。这不表示危机反制或胜利已经得到验证。"
 amr_loss_reviewed:0 "实际锚点损失复核"
 amr_loss_reviewed_desc:0 "本国已有实际锚点资源损失记录被纳入复核。既有损失及其后果保留，档案只供后续研究使用。"
