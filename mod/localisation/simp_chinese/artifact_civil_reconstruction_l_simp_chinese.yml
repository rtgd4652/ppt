l_simp_chinese:
 tech_artifact_civilization_joint_recovery:0 "文明联合恢复"
 tech_artifact_civilization_joint_recovery_desc:0 "中央庭曾把疏散、救治、配给与城市重建接续成一项长期责任。进入星海后，这种经验成为各殖民地能够共同调用的恢复方法：防卫仍在继续时，工场也可以开始修复生活与生产所依赖的环境。\n\n§H应用§!：建设灾后重建工场。殖民地荒废度至少10时，投入一份已备物资、500能源和200消费品，开展全国同时一处的重建项目。每个有效月度降低5点荒废度，最多6次；低于5时提前收尾，余量按原生机制恢复。失控、轰炸或工场停用时暂停，保留进度；危机期间可用。"
 building_artifact_post_disaster_reconstruction_workshop:0 "灾后重建工场"
 building_artifact_post_disaster_reconstruction_workshop_desc:0 "在当地组织工程、物资与公共服务的接续。工场本身不免费消除损伤；需要实际物资及安全施工条件，才能开展分期降低荒废度的重建项目。建筑维修仍走原生队列。"
 decision_artifact_civil_reconstruction_start:0 "组织殖民地重建"
 decision_artifact_civil_reconstruction_start_desc:0 "投入本地一份已预留物资，再支付500能源、200消费品，组织最多6次有效月度施工。每次实际降低5点殖民地荒废度，全国同时一处项目。"
 decision_artifact_civil_reconstruction_cancel:0 "撤销本轮重建"
 decision_artifact_civil_reconstruction_cancel_desc:0 "放弃剩余施工，不退款。已经降低的荒废度保留，其他物资与工程不受影响。"
 decision_artifact_civil_reconstruction_status:0 "查看殖民地重建记录"
 decision_artifact_civil_reconstruction_status_desc:0 "查看本轮施工次数、现场条件或最近一次收尾记录，不支付物资或推进工程。"
 acr.require_start:0 "需要本国原拥有者控制、无轰炸、活跃灾后重建工场、文明联合恢复研究、当地一份已预留物资，以及500能源、200消费品。殖民地荒废度至少10，全国没有其他进行或暂停的重建项目。"
 acr.offer_start:0 "消耗本地1份已预留物资，另付500能源、200消费品。每个有效月度实际降低5点荒废度，最多6次；低于5时提前收尾，余量自然恢复。不要求危机胜利或人物在场。新轰炸/占领/设施失效会暂停施工，不补跑；撤销/转让损失未完成投入，不退款。"
 acr.require_cancel:0 "需要原拥有者尚未结束的重建项目。占领、设施停用或研究失效时仍可撤销。"
 acr.offer_cancel:0 "清除本轮项目与施工计数，释放全国名额；不退款，不回滚已降低的荒废度，不清其他库存或工程。"
 acr.title:0 "[Root.GetName]：殖民地重建记录"
 acr.intro:0 "尚未组织本轮重建。\n\n荒废度达到10后，可交付一份已预留物资、500能源、200消费品开展施工。每个有效月度降低5点，最多6次；低于5时提前收尾。危机仍在发生也可安排。"
 acr.working:0 "§Y重建施工中§!\n本轮有效施工：[Root.acr_rebuild_work|0]/6。\n\n每次有效月度降低5点荒废度；低于5时提前收尾，余量自然恢复。保持本国控制、无轰炸、工场及研究有效。项目没有每月追加扣费。"
 acr.paused:0 "§Y重建施工暂停§!\n已完成有效施工：[Root.acr_rebuild_work|0]/6。\n\n请恢复本国控制、结束轰炸并恢复工场与研究资格。已付款和实际恢复保留，暂停月份不补算；项目仍占全国名额。"
 acr.done:0 "§G本轮重建已收尾§!\n本轮实际有效施工：[Root.acr_rebuild_work|0]/6。\n\n这是一轮施工记录，未表示全部损失已经恢复。剩余荒废度低于5时由原生机制继续恢复；仍达到10时可再安排一轮。维修废墟、补充人口及重建其他设施仍需各自投入。"
 acr.close:0 "结束查阅"
 acr_rebuild_project:0 "殖民地重建施工"
 acr_rebuild_project_desc:0 "已支付物资的本地重建项目。有效月度降低5点荒废度，最多6次，低于5时提前收尾。失控、轰炸或工场/研究失效时暂停并保留进度；全国同时一处，撤销或失去殖民地不退款。"
 acr_rebuild_done:0 "本轮重建已收尾"
 acr_rebuild_done_desc:0 "本国最近一轮地方重建的实际施工记录，不提供免费数值收益。余下损伤仍按当前殖民地状况处理；新一轮重建会更新本记录，转让或毁灭时清除。"
