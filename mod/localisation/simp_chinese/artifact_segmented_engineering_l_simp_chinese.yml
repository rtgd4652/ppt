l_simp_chinese:
 tech_artifact_segmented_large_engineering:0 "分段大型工程"
 tech_artifact_segmented_large_engineering_desc:0 "交界都市重建时，中央庭学会让不同队伍接续同一项工程。进入星海后，营建被拆分为可以独立验收的区段，物资、装配与试运行各有责任和交接条件。\n\n§H应用§!：解锁大型工程营建场。投入工程备料，逐段完成准备、装配与试运行；有效营建场提供§G+1§!巨型结构同时建造名额，全国一处。具体巨构仍需各自的研究与建造条件。"
 building_artifact_large_engineering_yard:0 "大型工程营建场"
 building_artifact_large_engineering_yard_desc:0 "营建场将构件、装配队伍与施工调度汇集到长期运行的平台。建成场地后，仍需通过行星决议完成准备、装配与试运行，才能承担另一项并行的大型建设。研究和施工期间维持设施的供给，也属于工程成本。"
 decision_artifact_civil_segmented_start:0 "大型营建：场地准备"
 decision_artifact_civil_segmented_start_desc:0 "将当地一份工程备料交给营建项目，开始准备承载结构与施工安排。完成本阶段后等待下一次投入。"
 decision_artifact_civil_segmented_assemble:0 "大型营建：结构装配"
 decision_artifact_civil_segmented_assemble_desc:0 "验收场地准备后，投入追加材料，装配构件交接、设备维护与施工调度所需的结构。"
 decision_artifact_civil_segmented_commission:0 "大型营建：联合试运行"
 decision_artifact_civil_segmented_commission_desc:0 "完成装配后，让供给、维护与调度一同运行，检验营建场能否长期承担并行工程。"
 decision_artifact_civil_segmented_cancel:0 "撤销营建项目"
 decision_artifact_civil_segmented_cancel_desc:0 "终止当前营建安排，或撤销已交付营建场的运行资格。全部已投入材料不返还；场地建筑保留，可重新投入建设。"
 decision_artifact_civil_segmented_status:0 "查看大型营建进度"
 decision_artifact_civil_segmented_status_desc:0 "查看本地营建阶段、有效工作月份、后续投入与运行状态。查看记录不会推进工程或支付物资。"
 artifact_segmented.require_start:0 "需要原拥有者控制且无轰炸、有效的联运接收端／配给仓／集成场／营建场、$tech_artifact_segmented_large_engineering$及当地一份可用大型工程备料。全国尚无其他营建项目或完成态营建场。"
 artifact_segmented.offer_start:0 "消耗1份大型工程备料，开始场地准备，需3次有效月度。已交付备料不能撤回退款；本项目占用全国唯一营建名额。后续阶段分别确认投入。"
 artifact_segmented.require_assemble:0 "需要本国原有项目完成场地准备、原拥有者控制且无轰炸、施工设施及接收端有效，并拥有1000矿物、1500合金。"
 artifact_segmented.offer_assemble:0 "支付1000矿物、1500合金，开始结构装配，需4次有效月度。不会自动支付试运行费用。"
 artifact_segmented.require_commission:0 "需要本国原有项目完成结构装配、原拥有者控制且无轰炸、施工设施及接收端有效，并拥有1000能源、300消费品。"
 artifact_segmented.offer_commission:0 "支付1000能源、300消费品，开始联合试运行，需2次有效月度。交付后，有效营建场提供额外1个巨型结构同时建造名额。"
 artifact_segmented.require_cancel:0 "需要原拥有者仍拥有并控制该殖民地、无轰炸，且本项目尚有建设状态或运行资格。设施拆除后仍可撤销。"
 artifact_segmented.offer_cancel:0 "清除本项目进度、运行资格及全国占位，不退款。普通库存、重新准备的工程备料与其他设施状态保留。"
 artifact_segmented.title:0 "[Root.GetName]：大型营建记录"
 artifact_segmented.intro:0 "场地尚未投入营建。\n\n先在有效接收端准备一份大型工程备料，再通过行星决议开始场地准备。准备3次、装配4次、试运行2次有效月度；每段完成后由你决定下一次投入。"
 artifact_segmented.preparing:0 "§Y场地准备§!\n有效工作：[Root.acs_segmented_work|0]/3。\n\n工程备料已经交付。准备完成后，需另投入1000矿物、1500合金才能开始结构装配。"
 artifact_segmented.prepared:0 "§Y等待结构装配投入§!\n场地准备已完成。通过行星决议支付1000矿物、1500合金，开始4次有效月度的结构装配。等待期间不自动扣费。"
 artifact_segmented.assembling:0 "§Y结构装配§!\n有效工作：[Root.acs_segmented_work|0]/4。\n\n材料已经支付。装配完成后，需另投入1000能源、300消费品才能开始联合试运行。"
 artifact_segmented.assembled:0 "§Y等待试运行投入§!\n结构装配已完成。通过行星决议支付1000能源、300消费品，开始2次有效月度的联合试运行。等待期间不自动扣费。"
 artifact_segmented.commissioning:0 "§Y联合试运行§!\n有效工作：[Root.acs_segmented_work|0]/2。\n\n供给、维护与调度正在共同运行。验收完成后，营建场可以支持另一项并行的大型建设。"
 artifact_segmented.paused:0 "§Y工程暂停§!\n当前阶段已完成有效工作：[Root.acs_segmented_work|0]。\n\n请恢复本国控制、结束轰炸，并恢复接收端、配给仓、集成场、营建场和研究资格。已付阶段与进度保留；停工月份不补算。"
 artifact_segmented.operational:0 "§G营建场已投入运行§!\n本国巨型结构同时建造名额：§G+1§!。\n\n完成态继续占用本国唯一营建名额。保持营建场有效、本国控制、无轰炸及研究资格；接收端可以调往其他工程。具体巨构仍需各自研究和建造条件。"
 artifact_segmented.offline:0 "§Y营建场暂停运行§!\n交付记录保留，暂不提供额外建造名额。请恢复本国控制、结束轰炸，并恢复营建场与研究资格。"
 artifact_segmented.close:0 "关闭工程记录"
 acs_segmented_project:0 "大型营建项目"
 acs_segmented_project_desc:0 "本国唯一的大型营建项目，完成态继续占位。可通过行星决议查看进度或撤销；转让、失去拥有者或毁灭时清除，不退款。"
 acs_segmented_preparing:0 "营建：场地准备中"
 acs_segmented_preparing_desc:0 "已交付工程备料，需3次有效月度。失控、轰炸或施工设施失效时保留进度并暂停。"
 acs_segmented_prepared:0 "营建：待装配投入"
 acs_segmented_prepared_desc:0 "场地准备完成，等待通过行星决议支付1000矿物、1500合金；不自动扣款。"
 acs_segmented_assembling:0 "营建：结构装配中"
 acs_segmented_assembling_desc:0 "追加材料已支付，需4次有效月度。失控、轰炸或施工设施失效时保留进度并暂停。"
 acs_segmented_assembled:0 "营建：待试运行投入"
 acs_segmented_assembled_desc:0 "结构装配完成，等待通过行星决议支付1000能源、300消费品；不自动扣款。"
 acs_segmented_commissioning:0 "营建：联合试运行中"
 acs_segmented_commissioning_desc:0 "试运行费用已支付，需2次有效月度。失控、轰炸或施工设施失效时保留进度并暂停。"
 acs_segmented_operational:0 "大型营建交付记录"
 acs_segmented_operational_desc:0 "三阶段已完成。原拥有者控制下、无轰炸且有效的营建场提供1个额外巨型结构同时建造名额；失效时暂停供给，恢复后继续。"
