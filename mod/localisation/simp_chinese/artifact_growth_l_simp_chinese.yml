 artifact_growth.page_1:0 "基础（1～10级）、熟练（11～20级）、高阶（21～30级）对应档位1／2／3；0表示当前未入驻。\n\n§Y爱缪莎§!：档位[Root.ag_aemusa_stage]；主导×[Root.ag_aemusa_primary]，协作×[Root.ag_aemusa_support]。旗舰恢复90／75／60日。\n§Y安托涅瓦§!：档位[Root.ag_antoniva_stage]；主导×[Root.ag_antoniva_primary]，协作×[Root.ag_antoniva_support]。方舟校准60／45／30日。\n§Y晏华§!：档位[Root.ag_yanhua_stage]；主导×[Root.ag_yanhua_primary]，协作×[Root.ag_yanhua_support]。研判工作×主导系数；结论180／240／300日。\n§Y赛斯§!：档位[Root.ag_seth_stage]；主导×[Root.ag_seth_primary]，协作×[Root.ag_seth_support]。调查与履责工作×主导系数；完成支援360／450／540日。\n§Y幽桐§!：档位[Root.ag_yutong_stage]；主导×[Root.ag_yutong_primary]，协作×[Root.ag_yutong_support]。射界校准×主导系数；越界支援30／40／50日。\n\n工程系数在符合资格的项目中使用。首都工坊需要丽／安自己的核心记录与合适职责，成长档位不会替代这些条件。核心效期依次对应档位1／2／3，不补发旧奖励；费用、实际对象和人物确认仍须满足。"
