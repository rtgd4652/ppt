l_simp_chinese:
 tech_artifact_multi_source_comparison:0 "多源异常比对"
 tech_artifact_multi_source_comparison_desc:0 "远距观测给出异常的轮廓，封存样本揭示其局部响应。两类证据彼此校正，可以排除单一观测手段无法识别的误差。\n\n§H应用§!：同一殖民地的黑门观测站与样本保管库或受控边界实验室同时运行时，提高当地物理与工程研究产出。"
 tech_artifact_low_loss_phase_transmission:0 "低损耗相位传输"
 tech_artifact_low_loss_phase_transmission_desc:0 "以共鸣材料约束能量传输中的相位偏移，可以减少途中耗散。持续校准所需的设备和耗材成为这套供能体系的一部分。\n\n§H应用§!：解锁相位供能试验站，生产能源与物理研究；取得相位能源网后可升级为黑门相位反应堆。"
 building_artifact_phase_power_test_station:0 "相位供能试验站"
 building_artifact_phase_power_test_station_desc:0 "在普通城市建筑槽提供200劳动力单位的相位供能师岗位，以消费品投入换取能源和物理研究，建筑每月维护1合金。取得相位能源网科技后可升级为黑门相位反应堆；已有高级反应堆不要求补研或重建本试验站。"
