l_simp_chinese:
 tech_artifact_precision_vein_mapping:0 "精准矿脉测绘"
 tech_artifact_precision_vein_mapping_desc:0 "以共鸣材料研究标定矿区，记录矿体分布与采掘边界。\n\n解锁§Y矿脉测绘站§!；当地须已有普通采矿区，后续仍需完成原§Y相位矿脉采掘§!研究才能升级。"
 tech_artifact_byproduct_recycling:0 "副产物闭环利用"
 tech_artifact_byproduct_recycling_desc:0 "将采矿与制造副产物纳入持续回收，通过岗位、能源和耗材投入换取可再利用物资。\n\n解锁§Y循环回收处理厂§!；不会凭空结算资源或返还已消耗的工程预算。"
 building_artifact_vein_mapping_station:0 "矿脉测绘站"
 building_artifact_vein_mapping_station_desc:0 "为已开发的普通矿区绘制精密记录，提供矿脉测绘员岗位。完成相位矿脉采掘后，可升级为原相位矿脉稳定站；同一殖民地上下级不能并存。"
 building_artifact_byproduct_recycling_plant:0 "循环回收处理厂"
 building_artifact_byproduct_recycling_plant_desc:0 "在当地采矿区、矿脉设施或基础工业工坊运行时提供回收技师岗位，耗用能源与消费品，产出矿物和少量合金。失去全部合格现场后停岗，建筑维护仍需支付。"
 job_artifact_vein_surveyor:0 "矿脉测绘员"
 job_artifact_vein_surveyor_plural:0 "矿脉测绘员"
 job_artifact_vein_surveyor_desc:0 "测绘采掘边界并整理矿体记录，以能源和耗材支撑矿物生产及工程研究。"
 mod_job_artifact_vein_surveyor_add:0 "$job_artifact_vein_surveyor$岗位"
 job_artifact_recycling_technician:0 "回收技师"
 job_artifact_recycling_technician_plural:0 "回收技师"
 job_artifact_recycling_technician_desc:0 "在有效生产现场维护回收流程，持续投入能源与耗材，回收矿物和少量合金。"
 mod_job_artifact_recycling_technician_add:0 "$job_artifact_recycling_technician$岗位"
