l_simp_chinese:
 # R3a公共舰载研究及独立装备；图标暂用既有素材，后续统一绘图。
 tech_artifact_shipboard_interface:0 "神器舰载接口"
 tech_artifact_shipboard_interface_desc:0 "以标准件与神器使编制为基础，开放标准化供能适配器。该A槽组件提供固定功率，仍占用槽位并承担费用和维护；不替换主反应堆。"
 tech_artifact_phase_ranging_array:0 "相位测距阵列"
 tech_artifact_phase_ranging_array_desc:0 "把长基线测量接入舰载系统，开放观测型与射控型相位测距仪。两者占同一原生传感器槽，分别在远距观测与近距射控之间取舍。"
 tech_artifact_runic_hull_armor:0 "符文舰体装甲"
 tech_artifact_runic_hull_armor_desc:0 "开放小型、中型和大型符文舰体装甲。以部分装甲量及额外维护换取装甲硬化；复合强化留待后续研究，旧装甲保持原条件。"
 ARTIFACT_RUNIC_HULL_ARMOR:0 "符文舰体装甲"
 ARTIFACT_STANDARD_POWER_ADAPTER:0 "标准化供能适配器"
 ARTIFACT_STANDARD_POWER_ADAPTER_DESC:0 "标准化的神器供能辅助件，提供固定30功率，占用一个A槽；持续承担能源和合金维护。不会随反应堆规模按比例增长。"
 ARTIFACT_PHASE_OBSERVATION_SENSOR:0 "观测型相位测距仪"
 ARTIFACT_PHASE_OBSERVATION_SENSOR_DESC:0 "观测范围4、航道探知6，追踪加值5；消耗25功率并承担能源维护。保留远距信息能力，射控低于专用型号；不提供隐形探测。"
 ARTIFACT_PHASE_FIRE_CONTROL_SENSOR:0 "射控型相位测距仪"
 ARTIFACT_PHASE_FIRE_CONTROL_SENSOR_DESC:0 "军用近距射控：观测范围2、航道探知3，追踪加值20；消耗20功率并承担能源维护。牺牲远距信息以支持近距跟踪。"
 SMALL_ARTIFACT_RUNIC_HULL_ARMOR:0 "小型符文舰体装甲"
 SMALL_ARTIFACT_RUNIC_HULL_ARMOR_DESC:0 "提供140装甲及8%装甲硬化，以部分厚度、造价与维护换取抗穿透。硬化按原生规则相加，不代表最终伤害固定降低8%。"
 MEDIUM_ARTIFACT_RUNIC_HULL_ARMOR:0 "中型符文舰体装甲"
 MEDIUM_ARTIFACT_RUNIC_HULL_ARMOR_DESC:0 "提供420装甲及8%装甲硬化，以部分厚度、造价与维护换取抗穿透。硬化按原生规则相加，不代表最终伤害固定降低8%。"
 LARGE_ARTIFACT_RUNIC_HULL_ARMOR:0 "大型符文舰体装甲"
 LARGE_ARTIFACT_RUNIC_HULL_ARMOR_DESC:0 "提供1260装甲及8%装甲硬化，以部分厚度、造价与维护换取抗穿透。硬化按原生规则相加，不代表最终伤害固定降低8%。"
