l_simp_chinese:
 tech_artifact_strategic_engineering_supply:0 "战略工程供应"
 tech_artifact_strategic_engineering_supply_desc:0 "中央庭曾在黑门危机中协调救援、城防与重建物资。面向星海的大型建设，这份经验成为长期备料制度：材料有明确去向，下一项工程也知道还有多少余量。\n\n§H应用§!：解锁工程物资集成场，在联运接收端把实存物资集成为一份大型工程备料。全国同时保留一份，交付前可撤回并回收部分材料。"
 building_artifact_engineering_supply_yard:0 "工程物资集成场"
 building_artifact_engineering_supply_yard_desc:0 "配给仓、联运调度与构件检验在此衔接，让大型建设所需的材料提前集结。需要当地配给仓和联运站；登记为接收端后，可通过行星决议投入实存物资，建立专用工程备料。"
 decision_artifact_civil_strategic_reserve:0 "集成大型工程备料"
 decision_artifact_civil_strategic_reserve_desc:0 "将当地实存的普通物资与追加材料一起编组，留作大型工程使用。全国同时保留一份专用备料，已投入的材料不再用于普通施工或联运。"
 decision_artifact_civil_strategic_release:0 "撤回大型工程备料"
 decision_artifact_civil_strategic_release_desc:0 "撤销这份尚未交付的工程备料，拆分并回收其中可继续使用的材料。处理损耗与已经支付的能源不予退还。"
 artifact_strategic_supply.require_reserve:0 "需要本国仍拥有并控制且无轰炸的联运接收端，有效配给仓、联运站和工程物资集成场，$tech_artifact_strategic_engineering_supply$研究，以及当地一份实存普通物资。全国尚无工程备料；另需1500矿物、900合金和500能源。"
 artifact_strategic_supply.offer_reserve:0 "消耗当地1份普通物资，另支付1500矿物、900合金、500能源，集成1份大型工程备料。含原物资的材料面额共2000矿物、1000合金。备料保留至交付或撤回；占领、轰炸或设施停用时不可使用，转让或毁灭时损失。"
 artifact_strategic_supply.require_release:0 "需要原拥有者仍拥有并控制该殖民地、无轰炸，且这份工程备料尚未交付。设施停用、拆除或取消接收端登记后仍可撤回。"
 artifact_strategic_supply.offer_release:0 "移除这份工程备料，返还1600矿物、800合金。能源和运输费用不返还，不恢复普通库存。"
 acs_strategic_supply_reserved:0 "大型工程备料"
 acs_strategic_supply_reserved_desc:0 "已集成2000矿物、1000合金的材料面额，占用本国唯一的工程备料名额。保持原拥有者、控制权、无轰炸、有效接收端与集成场后才可交付。撤回可收回1600矿物、800合金；转让或毁灭时损失。"
