l_simp_chinese:
 tech_artifact_sample_containment:0 "异常样本封存"
 tech_artifact_sample_containment_desc:0 "建设异常样本保管库，付费分析受控样本，为当地物理研究提供有限期成果；不需要额外样本货币。"
 tech_artifact_resonance_material_screening:0 "共鸣材料筛选"
 tech_artifact_resonance_material_screening_desc:0 "在当地标准件工坊或神器工坊中开展材料试制，也可为模块化营建准备精密构件；无需另建试验场。"
 tech_artifact_memory_cataloguing:0 "记忆档案编目"
 tech_artifact_memory_cataloguing_desc:0 "建设记忆档案室，保存殖民地公共记录；取得七日后勤网络后可升级为中央庭记忆宫。"
 tech_artifact_modular_colony_construction:0 "殖民地模块化营建"
 tech_artifact_modular_colony_construction_desc:0 "在当地标准件工坊或神器工坊组织付费营建，改善当地建筑施工；无需另建低级营建站。"
 building_artifact_sample_repository:0 "异常样本保管库"
 building_artifact_sample_repository_desc:0 "以分区封存和受控分析处理异常样本。研究后可从行星决议开启样本分析；付费方案在选择时扣除物资。"
 building_artifact_memory_archive_room:0 "记忆档案室"
 building_artifact_memory_archive_room_desc:0 "公共档案员维护当地记录。完成七日后勤网络研究后可升级为中央庭记忆宫。"
 job_artifact_junior_archivist:0 "初级档案员"
 job_artifact_junior_archivist_plural:0 "初级档案员"
 job_artifact_junior_archivist_desc:0 "将公共记录整理为可查证的档案，保存居民共同的制度与记忆。"
 mod_job_artifact_junior_archivist_add:0 "$job_artifact_junior_archivist$岗位"
 decision_artifact_foundation_sample:0 "公共科研：样本分析"
 decision_artifact_foundation_sample_desc:0 "查看当地样本分析方案或正在进行的公共项目。打开页面不收费；选定方案后扣除物资。"
 decision_artifact_foundation_workshop:0 "公共工程：工坊方案"
 decision_artifact_foundation_workshop_desc:0 "查看当地工坊的材料试制与营建方案，或查看当前公共项目。打开页面不收费；选定方案后扣除物资。"
 artifact_foundation.sample_title:0 "受控样本分析"
 artifact_foundation.sample_intro:0 "现场：§Y[Root.GetName]§!\n\n将封存样本转为可靠的研究成果。当地需要样本保管库，并保持实际控制且未遭轰炸。每颗星球只有一个公共项目名额，成果有效期间不能另开其他方案。\n\n选择付费方案后才扣除物资，关闭页面不会产生费用。"
 artifact_foundation.workshop_title:0 "工坊公共工程"
 artifact_foundation.workshop_intro:0 "现场：§Y[Root.GetName]§!\n\n从材料试制、普通营建与精密营建中选择适合当地的方案。需要标准件工坊或中央庭神器工坊，并保持实际控制且未遭轰炸。各方案共用当地的一个公共项目名额。\n\n选择付费方案后才扣除物资。"
 artifact_foundation.status_title:0 "当地公共项目"
 artifact_foundation.idle:0 "§Y[Root.GetName]§!当前没有进行中的公共项目，或此前成果已到期。原先中止的项目不退还物资，也不继承到新拥有者。可以关闭页面后选择适合当地的新方案。"
 artifact_foundation.close:0 "关闭"
 artifact_foundation.abort:0 "中止项目，不返还已投入物资"
 artifact_foundation.start_sample_analysis:0 "封存样本分析"
 artifact_foundation.offer_sample_analysis:0 "一次投入：§Y200能源、100消费品§!。\n完成3次有效月度工作后，获得§G当地岗位物理研究+10%§!，持续720日。与当地其他公共项目互斥。"
 artifact_foundation.require_sample_analysis:0 "需要对应研究、有效现场、实际控制且无轰炸、空闲项目名额，以及§Y200能源、100消费品§!。原拥有者的窗口不可在转让后使用。"
 artifact_foundation.working_sample_analysis:0 "现场：§Y[Root.GetName]§!\n方案：§Y封存样本分析§!\n进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n已投入：200能源、100消费品。现场正常时按月继续，关闭页面不会停止工作。完成后：当地岗位物理研究+10%，持续720日。"
 artifact_foundation.paused_sample_analysis:0 "现场：§Y[Root.GetName]§!\n方案：§Y封存样本分析§!\n保留进度：§Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§!\n\n目前因现场失控、轰炸或设施不可用而暂停，已投入物资和进度保留。恢复现场后继续；转让所有权或中止项目不会退费。"
 artifact_foundation.benefit_sample_analysis:0 "§Y[Root.GetName]§!已完成§Y封存样本分析§!。\n\n当前成果：§G当地岗位物理研究+10%§!。剩余期限见行星效果；成果到期前不能再开其他公共项目。关闭或重新打开页面不会延长期限。"
 artifact_foundation_sample_analysis:0 "封存样本分析成果"
 artifact_foundation_sample_analysis_desc:0 "通过公共研究和实际工程投入形成的当地成果。当地岗位物理研究+10%；不随界面访问重复结算。"
