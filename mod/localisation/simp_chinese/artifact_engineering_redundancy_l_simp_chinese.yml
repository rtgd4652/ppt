l_simp_chinese:
 tech_artifact_emergency_engineering_redundancy:0 "应急工程冗余"
 tech_artifact_emergency_engineering_redundancy_desc:0 "灾难中的重建经验让中央庭明白，关键工程不能把全部余地都留给一条供给线。锚定设施开始保存可替换构件和应急调度预算，在常规物流中断时，让已经投入的工作仍有条件继续。\n\n§H应用§!：把规则锚定试验场升级为冗余规则锚定站，保留原防护、监听和公共方法用途。将当地一份已实付的大型工程备料预存为备件，按需启用360日应急支援：当地建筑建造速度修正+25%，并为已付款的营建阶段提供备用物流。核心营建场和本国安全控制仍必需，新阶段投入保留原条件。"
 building_artifact_redundant_rule_anchor_station:0 "冗余规则锚定站"
 building_artifact_redundant_rule_anchor_station_desc:0 "保留规则锚定试验场的原有用途，并接入真实备件储备。在本国信号鉴别与工程研究有效时，可将已支付的大型工程备料转作一份应急备件；启用后提供360日当地施工支援。备件与支援期各全国同时一处，设施本身不免费开启支援或延长原防护。"
 decision_artifact_engineering_redundancy_reserve:0 "预存应急工程备件"
 decision_artifact_engineering_redundancy_reserve_desc:0 "将当地一份可用大型工程备料转作应急备件。原材料已经实际支付，此处不另收费；不能撤回为原备料或退款。"
 decision_artifact_engineering_redundancy_activate:0 "启用应急工程支援"
 decision_artifact_engineering_redundancy_activate_desc:0 "消耗本地一份预存备件，开启360日支援。备用物流只帮助已付款的营建阶段继续，不代付新阶段，不增加巨构容量，也不瞬间修好建筑。"
 decision_artifact_engineering_redundancy_discard:0 "放弃应急工程备件"
 decision_artifact_engineering_redundancy_discard_desc:0 "释放尚未使用的备件名额，不返还材料，不结束正在计时的支援。"
 aer.require_reserve:0 "需要本国已完成信号鉴别、应急工程冗余与分段大型工程研究，安全控制下的活跃冗余锚定站，以及当地一份可用大型工程备料。全国没有另一份已预存或暂停的备件。"
 aer.offer_reserve:0 "消费当地1份已实付大型工程备料，转为1份应急备件；全国同时一份，暂停时仍占位。释放原备料名额，不另扣资源；不能返还、复制或退款。"
 aer.require_activate:0 "需要原拥有者的预存备件，安全控制下的活跃冗余锚定站、信号鉴别及相关研究；全国当前没有尚未到期的应急工程支援。发动不再依赖原物流设施。"
 aer.offer_activate:0 "消耗本地1份备件，开启360日应急支援：当地建筑建造速度修正+25%。本地营建项目已付款的阶段可在配给仓、联运站或集成场失效时继续有效月度施工，仍须保有核心营建场。新开工与下一阶段付款保留原条件；不跳过工期或验收。失效停止供源，期限继续，不补跑或续期。"
 aer.require_discard:0 "需要本国原拥有者尚未使用的应急备件；设施停用、拆除、占领或研究失效时仍可放弃。"
 aer.offer_discard:0 "只清除本地1份未使用备件，不退款，不清理其他库存、营建进度或正在计时的应急支援。"
 aer_spares_reserved:0 "应急工程备件"
 aer_spares_reserved_desc:0 "由一份已实付的大型工程备料转存，供本地冗余锚定站按需启用。全国同时一份，失效保留占位；转让或毁灭时损失。不可撤回或退款。"
 aer_support_window:0 "应急工程支援期"
 aer_support_window_desc:0 "已投入备件的360日当地支援。有效冗余锚定站提供建筑建造速度修正+25%，并维持本地营建已付款阶段的备用物流。失控、轰炸或设施/研究失效时暂停供源，期限继续；恢复后使用剩余时间。转让或毁灭时清除，不退款。"
