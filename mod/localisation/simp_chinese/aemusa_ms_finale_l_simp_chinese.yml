l_simp_chinese:
 aemusa_finale.requirements:0 "请从白夜馆当前入口继续：真实历史、等级、责任保障与决定来源必须分别成立。"
 aemusa_finale.2.title:0 "需要先核对的记录"
 aemusa_finale.2.desc:0 "终局记录存在冲突，或专属危机仍有不可逆失败标记。通讯不会替双方补写决定，也不会自动挑选一个结局。请保留当前存档并核对记录。"
 aemusa_finale.2.close:0 "暂时结束通讯。"
 aemusa_finale.3.title:0 "私人谈话之前"
 aemusa_finale.3.training:0 "爱缪莎已开始本期研修。180游戏日结束后，若她仍不足30级且路线有效，将获得1基础等级。期间可以继续正常政务、科研与舰队任务；原生日常经验照常累计。\n\n本期不授予完整命运权限，也不代表任何一方同意。完成后可从白夜馆继续。"
 aemusa_finale.3.level:0 "文明证据与开放问题已经保留，私人终局互认需要爱缪莎达到30级。你可以继续安排她从事正常工作，或开展白夜馆研修：每期180游戏日，500凝聚力及200能源，完成获得1基础等级，最高30级。达到30级以后重新进入主线即可。\n\n本Mod把原生等级上限全局提高至30，其他领袖也受此影响。等级和30级肖像均不等于最终身份。"
 aemusa_finale.3.ready:0 "爱缪莎已达到30级。当前仍有终局资格缺口：必须完成前十三章及真实战争、两次危机、私人互认和责任保障。既有拒绝权、共同责任或责任修复不足时，请保留历史并核对原有保障；不会用等级或付费研修补写这些事实。"
 aemusa_finale.3.close:0 "先处理眼前的事务。"
 aemusa_finale.3.train:0 "安排一期研修：500凝聚力、200能源，180日。"
 aemusa_finale.10.title:0 "真相的边界"
 aemusa_finale.10.desc:0 "专属危机已经结束，现实却没有因此变成一份可以随意重写的记录。中央庭汇总了锚点、投影、解析和解除过程，保留每一项损失。爱缪莎提出先分清：哪些是文明能够复核的事实，哪些只能由她与你确认，哪些仍没有答案。\n\n先进行文明事实复盘；私人终局谈话另需30级资格。"
 aemusa_finale.10.later:0 "稍后再谈。"
 aemusa_finale.10.review:0 "从已经保存的证据开始。"
 aemusa_finale.20.title:0 "规律没有意志"
 aemusa_finale.20.desc:0 "能够重复核验的是路径收敛、概率反弹、代价转移和机会关闭。命运不曾发出命令，也没有喜恶：它是无人格、无意志、无敌意的修正规律。锚点与投影是本次危机的现象，不能被称为命运本人或使者。\n\n晏华保留证据、推断和异议的区分；安托涅瓦负责文明能够承担的公开说明。私人层面的世界差异与玩家连续不在公开档案之内。"
 aemusa_finale.20.later:0 "稍后决定公开节奏。"
 aemusa_finale.20.public:0 "公开已核实事实，保留异议与未知。"
 aemusa_finale.20.bounded:0 "分阶段公开，先说明现实后果与边界。"
 aemusa_finale.30.title:0 "四层记录"
 aemusa_finale.30.desc:0 "第一层，是文明能复核的危机事实；第二层，是爱缪莎与你的私人互认；第三层，是每个角色实际获得的证据和知情边界；第四层，是仍然开放的谜团。\n\n埃索林此前的受限证言只能补充边界，不能替任何人解释完整宇宙。中央庭不会因此全知；黑门、箱庭、世界重构与其他世界的机制仍保留空白。"
 aemusa_finale.30.later:0 "稍后继续。"
 aemusa_finale.30.boundaries:0 "把事实、知情边界与未知分别保存。"
 aemusa_finale.40.title:0 "仍然是与你同行的那个人"
 aemusa_finale.40.desc:0 "旧日七天与眼前的星际文明并非同一个世界。爱缪莎从双方持续的选择与承担中认出：过去的指挥使与你跨越不同世界状态保持着连续。你也确认这份互认，但它并未给出连续如何发生的精确机制。\n\n这份认识首先属于你们两人。中央庭只能核实她跨过了新的认知边界及其现实后果；未知仍然存在。接下来的谈话涉及未来的权限与责任，还没有任何一方因此默认同意。"
 aemusa_finale.40.later:0 "把私人谈话留到之后。"
 aemusa_finale.40.recognize:0 "确认彼此，也保留尚不能解释的部分。"
 aemusa_finale.90.begin:0 "进入危机后的真相复盘。"
 aemusa_finale.50.title:0 "谈话所需的保障"
 aemusa_finale.50.desc:0 "战争与两次危机已经归档，文明证据与私人互认保持分层。第十章建立的拒绝权、停止条件、异议和共同责任仍然有效；有过修复的历史也不会被删除。\n\n这次终审只保存实际成立的保障。爱缪莎30级是必要条件，既不替代你的授权，也不替代她的判断。"
 aemusa_finale.50.later:0 "把私人谈话留到之后。"
 aemusa_finale.50.continue:0 "确认既有保障，继续回望。"
 aemusa_finale.60.title:0 "与你谈论未来"
 aemusa_finale.60.desc:0 "从有限观测到现实行动，从战争到天灾，再到共同解除锚点，你们曾多次在不知道全部答案时作出选择。完整命运权限会让爱缪莎重新开放路径、改写命运领域的结果并覆盖命运修正；它不赋予政治统治、思想控制、物质全能或宇宙全知。\n\n“你希望我们用它做什么？”她把一张牌留在桌上。你可以表达自己的立场，但这不是授权，更不能替她回答。她会结合已经发生的责任与选择，决定是否接受这份身份。"
 aemusa_finale.60.later:0 "先不急着回答。"
 aemusa_finale.60.possibilities:0 "让未来保持多种可能，也保留彼此质疑的权利。"
 aemusa_finale.60.certainty:0 "我希望它最终给出唯一确定的答案。"
 aemusa_finale.70.title:0 "你的一份决定"
 aemusa_finale.70.desc:0 "你可以暂缓，也可以决定不建立完整命运权限关系，或向爱缪莎提出授权。暂缓能从白夜馆恢复；永久拒绝会正式收束本次主线，并关闭同一授权议题。\n\n提出授权仅表示你的一方愿意。爱缪莎随后会独立回应，仍可能拒绝。"
 aemusa_finale.70.defer:0 "暂时不决定，之后再谈。"
 aemusa_finale.70.refuse:0 "我决定不提出这份授权。"
 aemusa_finale.70.offer:0 "我愿意提出授权，并听取她自己的决定。"
 aemusa_finale.71.title:0 "确认不建立这份权限关系"
 aemusa_finale.71.desc:0 "这是永久拒绝，并非暂缓。确认后，主线将以玩家不授权的正式非转变结局收束；同一议题不会再次询问。爱缪莎仍保留原身份、职责、关系与已经共同经历的历史。"
 aemusa_finale.71.back:0 "还未作出永久决定，返回谈话。"
 aemusa_finale.71.refuse:0 "确认：我不授权，尊重这份结果。"
 aemusa_finale.72.title:0 "确认提出授权"
 aemusa_finale.72.desc:0 "你愿意建立完整命运权限关系，同时保留爱缪莎自己的判断与拒绝权。确认只记录玩家授权；不会创建她的同意，也不会立即改变身份。\n\n她的决定不会由好感数值、资源支付或重复询问改写。"
 aemusa_finale.72.back:0 "尚未提交，返回谈话。"
 aemusa_finale.72.authorize:0 "确认玩家授权，等待她的回应。"
 aemusa_finale.80.title:0 "她的一份决定"
 aemusa_finale.80.desc:0 "爱缪莎重新核对了自己能够拒绝的权利、你承担的责任，以及你愿意保留多种未来的立场。\n\n“我愿意。”她没有把牌翻开，“这份权限不会让我们永远正确。未来仍然需要选择，我也仍然可以怀疑你的答案。”\n\n她的接受已经独立记录。完整命运权限尚未成立，接下来只确认两份真实决定。"
 aemusa_finale.80.later:0 "稍后确认已经记录的结果。"
 aemusa_finale.80.listen:0 "听见她的决定，也接受她保留的边界。"
 aemusa_finale.90.title:0 "两份决定"
 aemusa_finale.90.desc:0 "玩家授权与爱缪莎接受分别存在。没有人替另一人作答，中央庭也没有代行任何一份决定。\n\n确认这份记录后才进入第十六章；此刻仍未授予完整命运权限。"
 aemusa_finale.90.later:0 "稍后进入最终收束。"
 aemusa_finale.90.continue:0 "确认两份决定，进入第十六章。"
 aemusa_finale.100.title:0 "仍然与你同行"
 aemusa_finale.100.desc:0 "你决定不建立这份完整权限关系，爱缪莎接受了你的回答。牌局、计算与彼此的质疑仍在，她不需要获得另一种身份才能继续生活。\n\n这是一种正式的非转变结局。战争、危机、资源损失和共同责任保持真实；现有旗舰与枢纽继续承担各自职责。同一授权议题至此结束。"
 aemusa_finale.100.later:0 "稍后确认收束。"
 aemusa_finale.100.accept:0 "确认玩家不授权的结局，继续现实生活。"
 aemusa_finale.110.title:0 "她选择保留的牌"
 aemusa_finale.110.desc:0 "爱缪莎听见了你的授权，也认真考虑了你希望获得唯一确定答案的立场。\n\n“我不愿意以这份身份作出那样的承诺。”她把牌留在桌上，“完整权限不会给出唯一正确的未来。我愿意继续同行，但不接受这次转变。”\n\n她的拒绝已经独立记录。这不是失败或惩罚；她保留原身份、职责、关系与价值。普通通讯不会再询问同一授权，也不能用资源或命令覆盖她的决定。"
 aemusa_finale.110.later:0 "稍后确认这份结果。"
 aemusa_finale.110.accept:0 "尊重她的拒绝，确认正式非转变结局。"
 aemusa_finale.120.title:0 "最终收束之前"
 aemusa_finale.120.desc:0 "真实战争、唯一原版天灾、专属危机、30级、私人互认与责任保障均已成立；玩家授权和爱缪莎接受来自各自的记录。第十六章只处理已经成熟的收束，不再追加战争、任务或权能试验。"
 aemusa_finale.120.later:0 "稍后继续收束。"
 aemusa_finale.120.continue:0 "保存真实历史，进入权限成立之时。"
 aemusa_finale.130.title:0 "命运主宰"
 aemusa_finale.130.desc:0 "从这次收束起，爱缪莎正式获得命运规律领域的完整主宰权：重新开放未来路径、改写命运领域的结果，并覆盖命运修正。此前每一次危机都仍属于有限能力与现实行动的历史，权限不会被倒写到过去的章节。\n\n她并非政治统治者，也不因此拥有思想控制、物质全能或宇宙全知。已经发生的损失不会在结算中消失。"
 aemusa_finale.130.later:0 "稍后确认正式成立。"
 aemusa_finale.130.continue:0 "确认权限从此刻成立，保留责任与边界。"
 aemusa_finale.140.title:0 "仍然是爱缪莎"
 aemusa_finale.140.desc:0 "她没有成为国家资产或一台永远正确的装置。计算、牌局、迟疑与玩笑仍属于她；与你之间仍是共同选择和相互质疑。\n\n安托涅瓦仍承担中央庭领袖的责任，晏华继续处理现实行动与证据。新身份只公开必要的能力与责任边界，不把私人互认变成全体共同拥有的答案。"
 aemusa_finale.140.later:0 "稍后继续。"
 aemusa_finale.140.continue:0 "保留人格、关系与各自职责。"
 aemusa_finale.150.title:0 "一段主线的结束"
 aemusa_finale.150.desc:0 "这段共同经历在完整权限成立后收束。现实损失、被放弃的方案与仍然开放的谜团原样保存；不会再出现一场必须由最终权能解决的新危机。\n\n未来的扩展只能从已经保存的真实历史继续。现在，可以看看明天的日常。"
 aemusa_finale.150.later:0 "稍后确认主线结束。"
 aemusa_finale.150.continue:0 "确认主线完成，进入尾声。"
 aemusa_finale.160.title:0 "历史留下的语气"
 aemusa_finale.160.desc:0 "尾声从已经发生的选择中形成：公开核实资料并承担更广责任，会侧重文明责任；保留首次干涉，会侧重未知未来；其余历史侧重共同守望。\n\n这只是叙述重点。三种语气拥有同一身份、权限与基础结果，不是最后一次挑选奖励的菜单。"
 aemusa_finale.160.later:0 "稍后看一看明天。"
 aemusa_finale.160.continue:0 "沿着已经发生的历史继续。"
 aemusa_finale.170.title:0 "明天仍然需要选择"
 aemusa_finale.170.tone1:0 "共同守望。爱缪莎仍会计算、游戏和怀疑，也仍愿意与你分担不知道答案时的选择。中央庭处理恢复事务，舰队、科研人员与其他神器使各自继续工作。你们之间的关系没有被新身份替代。\n\n永久损失和开放谜团仍留在档案中。银河没有因此永远安全。"
 aemusa_finale.170.tone2:0 "文明责任。核实过的资料进入公开档案，异议与复核继续存在。安托涅瓦、晏华、中央庭和盟友处理各自承担的现实；爱缪莎的权限没有取消他们的主体性。\n\n她仍会在忙完之后回来打牌。永久损失和开放谜团仍留在档案中，年轻的星际文明还须决定自己的明天。"
 aemusa_finale.170.tone3:0 "未知未来。爱缪莎把一张牌留在桌上，并不急于为所有人翻开。科研、舰队、中央庭与其他神器使继续行动；完整权限让未来重新开放，却没有让她无所不知。\n\n永久损失和开放谜团仍留在档案中。未知可以继续存在，选择也可以继续属于每一个人。"
 aemusa_finale.170.later:0 "稍后继续尾声。"
 aemusa_finale.170.continue:0 "让文明与日常继续。"
 aemusa_finale.180.title:0 "未翻之牌"
 aemusa_finale.180.desc:0 "“有能力选择，并不等于只剩一个答案。”\n\n爱缪莎没有命令银河消除全部风险，也没有替所有人翻开未来。旧日与今日的连续机制、黑门与箱庭的开放问题仍然没有被强行解释。\n\n这段主线和尾声到此结束。你们保留真实历史，继续各自的生活。"
 aemusa_finale.180.later:0 "稍后确认尾声结束。"
 aemusa_finale.180.continue:0 "保存这段历史，结束尾声。"
 aemusa_finale.200.title:0 "已经保存的结果"
 aemusa_finale.200.player:0 "爱缪莎主线已以玩家不授权的正式非转变结局完成。同一授权议题已永久关闭；爱缪莎的原身份、职责、关系、旗舰、枢纽与真实损失均保留。"
 aemusa_finale.200.aemusa:0 "爱缪莎主线已以她自主拒绝的正式非转变结局完成。同一授权议题已永久关闭；她的原身份、职责、关系、旗舰、枢纽与真实损失均保留。"
 aemusa_finale.200.sovereign:0 "爱缪莎主线与尾声已完成，完整命运权限及独立身份记录保留。已经发生的损失与开放谜团仍在，普通通讯不会重新授权或再次授予身份。"
 aemusa_finale.200.close:0 "继续处理现实事务。"
 leader_trait_aemusa_fate_sovereign:0 "命运主宰"
 leader_trait_aemusa_fate_sovereign_desc:0 "经玩家授权和爱缪莎自主接受后成立的独立身份。完整命运权限仅覆盖命运规律领域；人格、职业、公共责任、现实损失与开放谜团均保留。"
