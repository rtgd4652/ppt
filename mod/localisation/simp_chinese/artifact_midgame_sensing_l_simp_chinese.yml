l_simp_chinese:
 tech_artifact_long_baseline_measurement:0 "长基线高维测量"
 tech_artifact_long_baseline_measurement_desc:0 "拉开测量节点的距离，再将记录对齐到同一基准，微弱的相位差便能成为判断远方结构的线索。\n\n§H应用§!：解锁全帝国限一处的长基线传感阵列，扩展传感网络，并为轨道观测协同提供地表基线。"
 tech_artifact_phase_disturbance_warning:0 "相位扰动预警"
 tech_artifact_phase_disturbance_warning_desc:0 "航道活动与隐匿航迹都会扰动周围的相位环境。持续校正背景噪声，使观测网络能够更早辨认这些微小变化。\n\n§H应用§!：长基线阵列可升级为相位预警阵列，扩大航道探知；配合同星轨道观测接口可加强隐形探测。"
 tech_artifact_orbital_coordination:0 "轨道协同工程"
 tech_artifact_orbital_coordination_desc:0 "地表基线与轨道观测设备共享校正结果，使两处设施能够共同辨认更远的信号。维持这条观测链需要稳定的供源与控制。\n\n§H应用§!：解锁星港建筑轨道观测接口，配合同星本国有效阵列提供观测支援。"
 building_artifact_long_baseline_array:0 "长基线传感阵列"
 building_artifact_long_baseline_array_desc:0 "维持一处公共测量基准，使本国传感范围增加1，并为同星轨道观测接口提供资料。全帝国限一处基准阵列；停用、损坏或被占领时中断支援。后续可在原槽位升级。"
 building_artifact_phase_warning_array:0 "相位预警阵列"
 building_artifact_phase_warning_array_desc:0 "由长基线阵列升级而来，保留本国传感范围增加1，并使航道探知范围增加2。同星轨道观测接口额外获得1点隐形探测强度；目标须处于有效探测范围，且隐形强度未超过探测能力。停用、损坏或被占领时中断支援。"
 sm_artifact_orbital_observation_link:0 "轨道观测接口"
 sm_artifact_orbital_observation_link_desc:0 "占用正常星港建筑槽。有效本国长基线或预警阵列提供传感+1、航道探知+2；联校档案开放的地方观测支持也可供给这份基准，不重复叠加。高级预警阵列，或有危机信号鉴别档案并付费部署的当地锚定试验场，提供同一份隐形探测+1。来源须同星系且本国控制；失效时接口待机，仍支付原维护。"
