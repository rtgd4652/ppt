l_simp_chinese:
 # R3b公共研究与新件；尺寸和原生核心槽不另算科技。
 tech_artifact_close_resonance_weapons:0 "近程共鸣武器"
 tech_artifact_close_resonance_weapons_desc:0 "近距离持续扰动目标的能量场，可以使护盾难以维持完整结构。快速追踪让共鸣束能够跟随短促而频繁的机动。\n\n§H应用§!：解锁短射程、高追踪的共鸣武器，擅长削弱护盾，对实体装甲效果较弱。"
 tech_artifact_resonance_deflection:0 "共鸣偏折护盾"
 tech_artifact_resonance_deflection_desc:0 "防护场持续重建受击区域，以更快的恢复补偿有限的容量。维持这种响应需要更高的供能。\n\n§H应用§!：解锁共鸣偏折护盾，在护盾容量、恢复速度和功耗之间形成新的取舍。"
 tech_artifact_ship_phase_power:0 "舰载相位供能"
 tech_artifact_ship_phase_power_desc:0 "相位传输装置被整合进常规舰用反应堆，为高负荷装备提供稳定功率。更复杂的结构提高了制造和维护成本。\n\n§H应用§!：解锁适配常规舰体的相位反应堆，为高耗能配装提供供能选择。"
 tech_artifact_phase_maneuvering:0 "相位机动推进"
 tech_artifact_phase_maneuvering_desc:0 "推进控制把更多功率用于姿态修正和规避动作。舰船获得更灵活的战术机动，同时为持续加速保留不同的取舍。\n\n§H应用§!：解锁相位推进器，以较高功耗强化亚光速规避与机动。"
 ARTIFACT_CLOSE_RESONANCE_EMITTER:0 "近程共鸣投射器"
 ARTIFACT_CLOSE_RESONANCE_EMITTER_DESC:0 "短程共鸣束偏重破盾与追踪，对实体装甲较弱。"
 ARTIFACT_RESONANCE_DEFLECTOR:0 "共鸣偏折护盾"
 ARTIFACT_RESONANCE_DEFLECTOR_DESC:0 "以较低护盾容量和额外功耗换取更快的护盾回复。"
