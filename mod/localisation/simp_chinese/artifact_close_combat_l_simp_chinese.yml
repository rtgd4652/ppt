l_simp_chinese:
 # R3b公共研究与新件；尺寸和原生核心槽不另算科技。
 tech_artifact_close_resonance_weapons:0 "近程共鸣武器"
 tech_artifact_close_resonance_weapons_desc:0 "以短射程、高追踪的共鸣束破坏护盾，对实体装甲效率较低；不提供绕过防御或全国伤害加成。"
 tech_artifact_resonance_deflection:0 "共鸣偏折防护"
 tech_artifact_resonance_deflection_desc:0 "解锁容量较低、原生回复较快的偏折护盾，以更高功耗维持护盾重建；硬化与复合防御留给后续研究。"
 tech_artifact_ship_phase_power:0 "舰载相位供能"
 tech_artifact_ship_phase_power_desc:0 "将低损耗相位传输应用于常规舰用反应堆，以额外造价和维护支持高功耗配装。"
 tech_artifact_phase_maneuvering:0 "相位机动推进"
 tech_artifact_phase_maneuvering_desc:0 "以额外功耗换取更强闪避，基础速度增幅低于原版同阶推进器；仅改变亚光速机动，不提供跃迁。"
