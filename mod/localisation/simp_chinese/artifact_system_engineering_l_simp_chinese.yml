l_simp_chinese:
 tech_artifact_interstellar_engineering_coordination:0 "星系协同基础设施"
 tech_artifact_interstellar_engineering_coordination_desc:0 "中央庭的资源协调不再局限于一座城市或一颗行星。分散在不同星系的仓储、换装站与施工队采用共同的清单和交接标准，让已经集成的工程备料能够送到真正需要它的现场。\n\n§H应用§!：登记一处异星系工程接收点，从常规联运接收端支付500能源，将一份已备妥的大型工程备料运抵当地。施工点可接续分段营建或舰体承载试验，无需搬动原常规接收端；原工程的研究、设施、费用和工期仍须满足。命运都市的文明工程统筹生效时，运输费降为300能源。"
 decision_artifact_system_engineering_register:0 "登记跨星系工程接收点"
 decision_artifact_system_engineering_register_desc:0 "让当地工程物资集成场承接其他星系送来的备料。全国同时一处，不占用原常规联运接收端。"
 decision_artifact_system_engineering_unregister:0 "撤销跨星系工程接收点"
 decision_artifact_system_engineering_unregister_desc:0 "释放工程端点名额。当地库存保留，依赖此端点的未完成工程暂停；重新登记后可继续。"
 decision_artifact_system_engineering_dispatch:0 "向跨星系施工点交付备料"
 decision_artifact_system_engineering_dispatch_desc:0 "从当前常规接收端取出一份已经集成的大型工程备料，支付运输费用后送至唯一登记的异星系工程接收点。"
 ase.require_register:0 "需要$tech_artifact_interstellar_engineering_coordination$与当地活跃配给仓、联运站、工程物资集成场，本国控制且无轰炸。本国已有另一个星系的有效常规联运接收端及集成场，尚未登记其他工程接收点。"
 ase.offer_register:0 "免费登记全国唯一工程接收点，不占用C11常规接收端，不生成物资。运抵备料可用于当地大型营建或舰体承载试验；当地仍需对应设施和研究。"
 ase.require_unregister:0 "需要本国原拥有者的跨星系工程端点。设施停用、研究失效或被占领时仍可撤销登记。"
 ase.offer_unregister:0 "只撤销工程接收点，不退款或搬运库存，不清除既有工程进度。依赖此端点的工程暂停，重新登记或改为合格常规接收端后继续。已交付运行的营建场按自身条件工作。"
 ase.require_dispatch:0 "需要有效常规接收端及三种供给设施、本国原拥有者控制且无轰炸，并有1份实存工程备料与E11研究。运输费标准500能源，命运都市统筹生效时300能源；异星系工程目标须有效且未存大型备料。"
 ase.offer_dispatch:0 "支付当前运输费：标准§Y500能源§!，命运都市统筹生效时§Y300能源§!。将始发地§Y1份大型工程备料§!立即送至唯一异星系工程点，不复制备料，普通库存不动。到货后不要求源站持续在线，后续施工按原阶段继续。"
 acs_remote_engineering_receiver:0 "跨星系工程接收点"
 acs_remote_engineering_receiver_desc:0 "本国唯一登记的工程施工端点，可接收来自异星系常规联运接收端的大型工程备料。控制、设施及研究有效时可支持当地营建或承载试验，不另占常规接收端名额。\n\n失效时已付进度和库存保留；转让或毁灭按原拥有者规则清理，不能被新国家继承。"
