 ar.li.register.desc:0 "登记一个公共项目：一处本国可控殖民地的建设与工程服务，或丽亲自指挥舰队的补给防护。受益对象只限原目标，私人企业不能取代中央庭的公共制度。\n\n先投入100能源、50凝聚力核账；随后明确完整或缩减范围、费用与真实风险。暂不可作业则暂停，永久失去对象则止损，已付物资不退。"
