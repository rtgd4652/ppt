 ar_greysa_stable_care:0 "生命档案：稳定照护"
 ar_greysa_stable_care_desc:0 "已核对损伤与自愿配合边界后的有限公共照护。"
 ar_greysa_fleet_care:0 "生命档案：舰队照护"
 ar_greysa_fleet_care_desc:0 "原舰队的有限维修照护；已被摧毁的舰船不会恢复。"
 ar_greysa_emergency_shelter:0 "生命档案：应急避难"
 ar_greysa_emergency_shelter_desc:0 "对正在发生的轰炸提供短暂防护，不完成诊断。"
 ar_greysa_emergency_cover:0 "生命档案：应急掩护"
 ar_greysa_emergency_cover_desc:0 "损伤舰队的短暂脱离支援，不保证免伤或成功脱离。"
 ar_wenzi_balanced_service:0 "经纬共局：推进与维护"
 ar_wenzi_balanced_service_desc:0 "双方约定边界内的有限公共布局成果。"
 ar_wenzi_balanced_cover:0 "经纬共局：进退有据"
 ar_wenzi_balanced_cover_desc:0 "原舰队有限掩护，保留退路而非无损承诺。"
 ar_li_public_engineering:0 "责任投资：公共工程履约"
 ar_li_public_engineering_desc:0 "本殖民地工程服务的有限成果，不影响全国其他研究领域。"
 ar_li_scaled_engineering:0 "责任投资：缩减工程履约"
