 ar.greysa.register.title:0 "生命档案 · 约定对象与边界"
 ar.greysa.register.desc:0 "只从已经发生的损伤立案。首版使用匿名环境／舰船损伤资料与自愿提供的记录；中央庭不因此获得任何人的身体或样本所有权。正在受害时的保护与后续分析分别处理。\n\n殖民地须荒废度>10；舰队须由格蕾莎亲自指挥并确有受损舰船。立案投入100能源、50消费品。"
