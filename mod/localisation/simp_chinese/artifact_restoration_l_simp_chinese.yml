 ar.li.task.idle:0 "当前没有进行中的安排。已完成记录：§Y[Root.ar_li_completed_count]§!\n\n核账需一次有效月度工作，随后选择完整或缩减投入；施工需三次或两次有效工作。占领、轰炸或交战受损会进入风险待处理；恢复作业条件后追加责任物资，或止损退出。转职保留原项目与账目，科学家只服务本地工程研究。\n\n本次累计投入：[Root.ar_li_cost_energy]能源、[Root.ar_li_cost_unity]凝聚力、[Root.ar_li_cost_consumer_goods]消费品、[Root.ar_li_cost_minerals]矿物、[Root.ar_li_cost_alloys]合金。\n休整结束后才能登记下一项；物资不足、职业不符或没有实际对象时不显示开始选项。"
