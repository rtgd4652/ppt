 ar.an.recruit.title:0 "安 · 接入职责"
 ar.an.recruit.desc:0 "中央庭所属神器使，也是拥有完整人格的人工生命。她记录亲历的工作与战斗，逐步理解选择和责任。时光之刃只能握住局部、短暂的一束时间；她不属于任何人的财产。\n\n初始职责与核心按既定方案接入。投入500凝聚力；人物离开后不重新创建替身。"
 ar.an.contact.title:0 "安 · 职责通讯"
 ar.an.contact.desc:0 "中央庭所属神器使，也是拥有完整人格的人工生命。她记录亲历的工作与战斗，逐步理解选择和责任。时光之刃只能握住局部、短暂的一束时间；她不属于任何人的财产。\n\n可以调整当前职业，也可以开展本人的专属任务。同一人物转职保留经验、原对象、进度、成本与恢复期。正式人物肖像尚在制作。"
 ar.an.task:0 "开展时序学习，查看任务记录"
 ar.an.task.title:0 "安 · 时序学习"
 ar.an.register.title:0 "时序学习 · 约定对象与边界"
 ar.an.register.desc:0 "安同意记录一项有限工作，而不是交出自己的意识。\n\n殖民地：优先首都，否则一处本国可控殖民地，公共协调记录。\n舰队：本人实际指挥的普通舰队，先准备观察，之后必须真实参战。\n\n开始投入100能源、50凝聚力。已付物资不因转职或撤回退还。"
 ar.an.begin_planet:0 "登记一处殖民地工作"
 ar.an.begin_fleet:0 "登记本人实际指挥的舰队"
 ar.an.confirm_planet:0 "确认边界，按所需物资登记殖民地"
 ar.an.confirm_fleet:0 "确认边界，按所需物资登记原舰队"
 ar.an.task.idle:0 "当前没有进行中的安排。已完成记录：§Y[Root.ar_an_completed_count]§!\n\n公共工作由行政官协调；军事观察须本人带领原舰队实际参战，再在非交战状态整理。两次有效月度工作形成一个可消耗记录，并获得200经验。记录只帮助原目标，不复活舰船或回滚历史。\n\n本次累计投入：[Root.ar_an_cost_energy]能源、[Root.ar_an_cost_unity]凝聚力、[Root.ar_an_cost_consumer_goods]消费品、[Root.ar_an_cost_minerals]矿物、[Root.ar_an_cost_alloys]合金。\n休整结束后才能登记下一项；物资不足、职业不符或没有实际对象时不显示开始选项。"
 ar.an.task.planet.active:0 "当前对象：§Y[ar_an_target.GetName]§!\n整理工作：§Y[Root.ar_an_progress]/2§!。公共工作正在记录。\n\n本次累计投入：[Root.ar_an_cost_energy]能源、[Root.ar_an_cost_unity]凝聚力、[Root.ar_an_cost_consumer_goods]消费品、[Root.ar_an_cost_minerals]矿物、[Root.ar_an_cost_alloys]合金。\n\n公共工作由行政官协调；军事观察须本人带领原舰队实际参战，再在非交战状态整理。两次有效月度工作形成一个可消耗记录，并获得200经验。记录只帮助原目标，不复活舰船或回滚历史。\n\n暂不满足职责、本人任职或控制条件时，原工作暂停；失去所有权或人物离开则止损，不替换对象、不退成本。"
 ar.an.task.planet.record:0 "当前对象：§Y[ar_an_target.GetName]§!\n记录已经形成，可以用于原殖民地的下一步有限改进：90日建筑速度+10%、舒适度+3。\n\n本次累计投入：[Root.ar_an_cost_energy]能源、[Root.ar_an_cost_unity]凝聚力、[Root.ar_an_cost_consumer_goods]消费品、[Root.ar_an_cost_minerals]矿物、[Root.ar_an_cost_alloys]合金。\n\n公共工作由行政官协调；军事观察须本人带领原舰队实际参战，再在非交战状态整理。两次有效月度工作形成一个可消耗记录，并获得200经验。记录只帮助原目标，不复活舰船或回滚历史。\n\n暂不满足职责、本人任职或控制条件时，原工作暂停；失去所有权或人物离开则止损，不替换对象、不退成本。"
 ar.an.task.fleet.active:0 "当前对象：§Y[ar_an_target.GetName]§!\n整理工作：§Y[Root.ar_an_progress]/2§!。一次真实参战已登记，继续带领原舰队在非交战状态整理。\n\n本次累计投入：[Root.ar_an_cost_energy]能源、[Root.ar_an_cost_unity]凝聚力、[Root.ar_an_cost_consumer_goods]消费品、[Root.ar_an_cost_minerals]矿物、[Root.ar_an_cost_alloys]合金。\n\n公共工作由行政官协调；军事观察须本人带领原舰队实际参战，再在非交战状态整理。两次有效月度工作形成一个可消耗记录，并获得200经验。记录只帮助原目标，不复活舰船或回滚历史。\n\n暂不满足职责、本人任职或控制条件时，原工作暂停；失去所有权或人物离开则止损，不替换对象、不退成本。"
 ar.an.task.fleet.record:0 "当前对象：§Y[ar_an_target.GetName]§!\n记录已经形成。原舰队仍由安带领、实际交战受损且允许紧急脱离时，下方可消耗这份记录进行一次撤离，60日后返回；恢复180日。它不会恢复已被摧毁的舰船。\n\n本次累计投入：[Root.ar_an_cost_energy]能源、[Root.ar_an_cost_unity]凝聚力、[Root.ar_an_cost_consumer_goods]消费品、[Root.ar_an_cost_minerals]矿物、[Root.ar_an_cost_alloys]合金。\n\n公共工作由行政官协调；军事观察须本人带领原舰队实际参战，再在非交战状态整理。两次有效月度工作形成一个可消耗记录，并获得200经验。记录只帮助原目标，不复活舰船或回滚历史。\n\n暂不满足职责、本人任职或控制条件时，原工作暂停；失去所有权或人物离开则止损，不替换对象、不退成本。"
