 ar.wenzi.recruit.desc:0 "东方古街的公共代表与中央庭协作者。她以共同目标、居民意愿和保护边界组织布局；黑子承担推进，白子照顾维护、掩护与退路。合作保留拒绝和退出权。\n\n初始职责与核心按既定方案接入。投入500凝聚力；人物离开后不重新创建替身。"
 ar.wenzi.contact.title:0 "雯梓 · 职责通讯"
 ar.wenzi.contact.desc:0 "东方古街的公共代表与中央庭协作者。她以共同目标、居民意愿和保护边界组织布局；黑子承担推进，白子照顾维护、掩护与退路。合作保留拒绝和退出权。\n\n可以调整当前职业，也可以开展本人的专属任务。同一人物转职保留经验、原对象、进度、成本与恢复期。正式人物肖像尚在制作。"
 ar.wenzi.task:0 "开展经纬共局，查看任务记录"
 ar.wenzi.task.title:0 "雯梓 · 经纬共局"
 ar.wenzi.register.title:0 "经纬共局 · 约定对象与边界"
 ar.wenzi.register.desc:0 "共同目标：殖民地发展与服务并行，或原舰队推进时保留退路。\n保护边界：维护居民／同伴的安全与退出权，不以一方永久牺牲换取另一方发展。\n\n居民与协作者可以拒绝安排；退出保留已经投入的实际成本。按上述目标和边界立局，投入200能源、50凝聚力；每一步还需单独物资。"
 ar.wenzi.begin_planet:0 "登记一处殖民地工作"
 ar.wenzi.begin_fleet:0 "登记本人实际指挥的舰队"
 ar.wenzi.confirm_planet:0 "确认边界，按所需物资登记殖民地"
 ar.wenzi.confirm_fleet:0 "确认边界，按所需物资登记原舰队"
 ar.wenzi.task.idle:0 "当前没有进行中的安排。已完成记录：§Y[Root.ar_wenzi_completed_count]§!\n\n先约定目标、保护边界及退出权。每28日最多一步；黑子推进，白子维护。每步100能源：殖民地黑子另50矿物、白子另50消费品；舰队另25合金。连续同色增加失衡，达到2后只能换色纠正或退出。两色都出现、至少四步且失衡小于2才能完成。\n\n本次累计投入：[Root.ar_wenzi_cost_energy]能源、[Root.ar_wenzi_cost_unity]凝聚力、[Root.ar_wenzi_cost_consumer_goods]消费品、[Root.ar_wenzi_cost_minerals]矿物、[Root.ar_wenzi_cost_alloys]合金。\n休整结束后才能登记下一项；物资不足、职业不符或没有实际对象时不显示开始选项。"
 ar.wenzi.task.planet.active:0 "当前对象：§Y[ar_wenzi_target.GetName]§!\n共同目标与保护边界已约定。\n已走步数：§Y[Root.ar_wenzi_progress]§!，当前失衡：§Y[Root.ar_wenzi_imbalance]§!。\n\n每步是实际投入；连续同色达到2点失衡时必须换色纠正。完成提供180日有限公共服务或原舰队掩护。\n\n本次累计投入：[Root.ar_wenzi_cost_energy]能源、[Root.ar_wenzi_cost_unity]凝聚力、[Root.ar_wenzi_cost_consumer_goods]消费品、[Root.ar_wenzi_cost_minerals]矿物、[Root.ar_wenzi_cost_alloys]合金。\n\n先约定目标、保护边界及退出权。每28日最多一步；黑子推进，白子维护。每步100能源：殖民地黑子另50矿物、白子另50消费品；舰队另25合金。连续同色增加失衡，达到2后只能换色纠正或退出。两色都出现、至少四步且失衡小于2才能完成。\n\n暂不满足职责、本人任职或控制条件时，原工作暂停；失去所有权或人物离开则止损，不替换对象、不退成本。"
