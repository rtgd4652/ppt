 ar.greysa.task.idle:0 "当前没有进行中的安排。已完成记录：§Y[Root.ar_greysa_completed_count]§!\n\n殖民地须实际荒废度超过10，或本人舰队确有受损舰船，才能立案。科学家分析殖民地，指挥官分析原舰队；轰炸、交战和不符职责时暂停诊断。三次有效工作后可付费稳定照护并归档。紧急保护不增加分析进度。\n\n本次累计投入：[Root.ar_greysa_cost_energy]能源、[Root.ar_greysa_cost_unity]凝聚力、[Root.ar_greysa_cost_consumer_goods]消费品、[Root.ar_greysa_cost_minerals]矿物、[Root.ar_greysa_cost_alloys]合金。\n休整结束后才能登记下一项；物资不足、职业不符或没有实际对象时不显示开始选项。"
