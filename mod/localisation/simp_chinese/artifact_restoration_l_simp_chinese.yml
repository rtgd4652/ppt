 ar.greysa.archive.current:0 "最近归档对象：§Y[ar_greysa_archive.GetName]§!\n已完成档案：§Y[Root.ar_greysa_completed_count]§!\n该档实际投入：§Y[Root.ar_greysa_archive_cost_energy]能源、[Root.ar_greysa_archive_cost_consumer_goods]消费品§!\n\n资料来自已经发生的殖民地荒废或舰船损伤。匿名记录、自愿配合与必要的紧急保护构成首版边界；已完成照护不是对个人身体的所有权。对象以后消失也不撤销已完成的记录。"
 ar.greysa.archive.unavailable:0 "已完成档案：§Y[Root.ar_greysa_completed_count]§!\n\n最近记录的对象已经无法定位。保留已完成档案数量与实际投入，不创造替代对象，也不把缺失资料说成已经治愈。"
 ar.an.name:0 "安"
 ar.an.background:0 "中央庭所属神器使，也是拥有完整人格的人工生命。她记录亲历的工作与战斗，逐步理解选择和责任。时光之刃只能握住局部、短暂的一束时间；她不属于任何人的财产。"
 leader_trait_ar_an_identity:0 "时序学习"
 leader_trait_ar_an_identity_desc:0 "中央庭所属神器使，也是拥有完整人格的人工生命。她记录亲历的工作与战斗，逐步理解选择和责任。时光之刃只能握住局部、短暂的一束时间；她不属于任何人的财产。\n\n通过白夜馆开展本人的专属任务；身份特质不自动给予全国加成。"
