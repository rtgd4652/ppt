 leader_trait_ar_wenzi_identity_desc:0 "东方古街的公共代表与中央庭协作者。她以共同目标、居民意愿和保护边界组织布局；黑子承担推进，白子照顾维护、掩护与退路。合作保留拒绝和退出权。\n\n通过白夜馆开展本人的专属任务；身份特质不自动给予全国加成。"
