l_simp_chinese:
 artifact_companions.entry:0 "开展本人的专属任务。"
 artifact_companions.back:0 "返回任务安排。"
 artifact_companions.close:0 "暂时结束通讯。"
 artifact_companions.status:0 "查看任务记录与条件。"
 artifact_companions.withdraw:0 "撤回这项任务，保留已付代价与恢复期。"
 artifact_companions.100.title:0 "赛斯：愿望履责"
 artifact_companions.100.desc:0 "“又有申请表？先别催，我会去看看。”赛斯把权杖靠在桌边。\n\n殖民地希望恢复日常服务。他会先核对当地状况，再决定用公共资源与羽蛇神杖协作支援，或亲自带队救援。\n\n每次只登记一项请求；调查需两次月度工作。行政官可安排公共支援，指挥官须亲自带领军用舰队抵达目标星系，才能完成现场救援。职业切换会解除任职，保留同一人的等级、请求、投入与进度。完成或撤回后休整90日。"
 artifact_companions.seth_start:0 "接入一项殖民地请求，开始调查（100能源、50凝聚力）。"
 artifact_companions.seth_public:0 "安排公共资源与神杖协作支援（300能源、100消费品；3次月度工作）。"
 artifact_companions.seth_direct:0 "赛斯带队在目标星系现场救援（200能源、50合金；2次月度工作）。"
 artifact_companions.seth_hasty:0 "不等调查，先按字面补给（100能源、50消费品；有调配失误风险）。"
 artifact_companions.seth_secondary:0 "补核需求，纠正调配失误（200能源）。"
 artifact_companions.seth_commander:0 "赛斯转为指挥官，随后由玩家安排带队。"
 artifact_companions.seth_official:0 "赛斯转为行政官，继续同一请求。"
 artifact_companions.110.title:0 "赛斯：责任记录"
 artifact_companions.110.investigating:0 "目标：§Y[ac_seth_target.GetName]§!\n调查工作：§Y[Root.ac_seth_progress]/2§!\n\n当地的希望并不等于已经查清的需求。赛斯会核对公共服务与可用条件；目标被占领时暂停，人不在时也不会凭空完成工作。保持通讯关闭并推进游戏时间即可，完成调查后从白夜馆回来选择履责方式。"
 artifact_companions.110.ready:0 "目标：§Y[ac_seth_target.GetName]§!\n调查已完成，尚未投入执行物资。\n\n行政官可组织公共支援；指挥官须实际带领军用舰队抵达该殖民地所在星系。返回任务安排后选择方式。"
 artifact_companions.110.working:0 "目标：§Y[ac_seth_target.GetName]§!\n本阶段工作次数：§Y[Root.ac_seth_progress]§!\n\n公共支援需行政官、玩家控制目标且没有正在发生的轰炸；现场救援需指挥官带领舰队留在目标星系。轰炸时有限应急防护接管公共支援，保留原进度。\n\n正常完成后，该殖民地获得一年稳定度§G+5§!、舒适度§G+5§!。它不能复活已经失去的人口，也不会抵消战争损失。"
 artifact_companions.110.secondary:0 "目标：§Y[ac_seth_target.GetName]§!\n\n临时补给已经发出，但仓促理解诉求造成了调配失误。舒适度短暂§G+10§!，当地稳定度在后续半年§R-3§!。\n\n这项请求仍占用任务名额。可以投入200能源补核需求并纠正失误，也可撤回，等待影响自然结束；已经发出的物资不会退回。"
 artifact_companions.110.idle:0 "当前没有在办的殖民地请求。已正常履责次数：§Y[Root.ac_seth_completed_count]§!。\n\n若刚完成或撤回，请休整90日；已有殖民地恢复效果按原期限保留。接新请求还需要赛斯在本国、一处由玩家控制的殖民地、100能源与50凝聚力。赛斯离世或离开后不会自动重新招募。"
 artifact_companions.200.title:0 "幽桐：自定射界"
 artifact_companions.200.desc:0 "“先说清楚保护谁，再谈这一箭要射到哪里。”\n\n首版以幽桐实际带领的军用舰队作为保护对象和作业舰队，选择一项交战原则，在当前星系进行三次月度校准。离开该星系或解除指挥会失去校准，回到原射界后重新开展工作。\n\n真实参战时可请求一次越界支援，由幽桐确认。它只提供30日有限火力增益，消耗校准，并留下180日恢复期；撤回、换舰、读档都不会抹掉恢复期。"
 artifact_companions.yutong_guard:0 "以保护舰队为先建立射界（200能源；追踪+10、射速+5%）。"
 artifact_companions.yutong_precision:0 "以明确目标精准射击建立射界（200能源；追踪+5、射程+15%）。"
 artifact_companions.yutong_exception:0 "就当前实际交战，请幽桐决定一次越界支援。"
 artifact_companions.yutong_confirm:0 "幽桐：仅这一次；随后撤回射界，进入恢复（30日射速+25%、追踪+10）。"
 artifact_companions.yutong_refuse:0 "幽桐：保持原有边界，不执行这次越界请求。"
 artifact_companions.210.title:0 "幽桐：射界记录"
 artifact_companions.210.calibrating:0 "保护舰队：§Y[ac_yutong_force.GetName]§!\n射界星系：§Y[ac_yutong_anchor.GetName]§!\n校准工作：§Y[Root.ac_yutong_progress]/3§!\n\n幽桐须继续指挥这支舰队，留在该星系、由玩家控制并处于非交战状态。脱离这些条件会暂停或重置校准。完成后按最初选择的原则提供局部支援；不向其他舰队或全国复制收益。"
 artifact_companions.210.stable:0 "保护舰队：§Y[ac_yutong_force.GetName]§!\n射界星系：§Y[ac_yutong_anchor.GetName]§!\n\n校准已完成，指定舰队获得所选交战原则的支援。幽桐继续在原射界指挥时，月度核对延续效果。换人、移出射界或失去控制会撤去支援并重新校准。\n\n只有这支舰队实际加入战斗，才会产生越界请求。"
 artifact_companions.210.recovery:0 "一次越界支援已经执行，幽桐进入§Y180日§!恢复期。原校准已消耗。\n\n这一期限保存在国家记录中，撤回任务或换舰不能清除。恢复后，仍有效的原任务可重新校准；新任务同样受恢复期限制。"
 artifact_companions.210.idle:0 "当前未建立射界。请将幽桐任命到普通军用舰队，再从任务安排选择交战原则。\n\n刚撤回任务后休整90日；另需200能源。新旗舰不作为该机制的工作舰队。"
 artifact_companions.211.title:0 "幽桐：边界之外的一箭"
 artifact_companions.211.desc:0 "指定舰队已实际加入战斗。请求送到幽桐面前，他先确认眼前的同伴与目标。\n\n“我可以为这一次交战扩展射界。之后需要恢复，下一次要重新校准。”\n\n若舰队已经离开战斗、幽桐不再带队或恢复期尚未结束，就不能执行。保持原有边界也可以，拒绝后90日内不重复催问。"
 artifact_companions.300.title:0 "拉比：阿米特的守则"
 artifact_companions.300.desc:0 "阿米特靠在拉比身旁，等待这次保护约定。\n\n中央庭的成年指挥链负责目标与退出安排。首版保护对象是拉比实际带领的军用舰队；拉比和阿米特确认后守护其中的人，不独自承担国家战略决定。\n\n威胁只从该舰队真实参战记录接入。有限保护不能抹掉伤亡；一次反击还需要拉比当次确认，随后恢复180日。阿米特是共同承担保护的守护者，不额外创建领袖或舰船。"
 artifact_companions.rabi_request:0 "提出保护本舰队的约定，等待拉比与阿米特确认。"
 artifact_companions.rabi_response:0 "听取对这项保护约定的回应。"
 artifact_companions.rabi_confirm:0 "拉比与阿米特：保护身边的同伴，保留随时退出的权利。"
 artifact_companions.rabi_refuse:0 "暂不接受这项约定。"
 artifact_companions.302.title:0 "拉比与阿米特的回应"
 artifact_companions.302.desc:0 "约定限定在拉比实际带领的舰队：先保护同伴，出现真实交战再登记一个主要威胁，不追逐无关对象。\n\n阿米特俯下身体，拉比看了看保护名单。接受这份约定并不等于提前同意所有反击；任何时候都可以撤回，已经发生的伤亡和恢复期照实保留。"
 artifact_companions.310.title:0 "拉比：保护记录"
 artifact_companions.310.active:0 "保护舰队：§Y[ac_rabi_force.GetName]§!\n\n保护约定已经确认。该舰队实际参战后，阿米特提供有限防护（装甲、护盾各§G+10%§!），并登记实际对手。和平时期和无关战争不登记威胁，也不提前授予反击。\n\n人物解除指挥、失去控制或交战结束时撤去作战支援；反击须另一次确认。"
 artifact_companions.310.recovery:0 "拉比与阿米特已确认并执行一次有限反击（30日射速§G+15%§!），现有§Y180日§!恢复期。\n\n有效约定中的保护仍可针对真实交战继续；不能再次执行反击，也不能通过撤回、换舰或读档刷新恢复期。"
 artifact_companions.310.idle:0 "当前没有生效的保护约定。请先将拉比安排到普通军用舰队，再提出限定目标的约定。\n\n刚撤回或拒绝约定后休整90日。拉比离世或离开后不自动重建；阿米特不作为独立单位复制。"
 artifact_companions.rabi_counter_request:0 "针对这次真实交战，请拉比与阿米特决定一次有限反击。"
 artifact_companions.rabi_counter_confirm:0 "拉比与阿米特：为了保护同伴，只反击这一次。"
 artifact_companions.rabi_counter_refuse:0 "保留保护约定，不执行这次反击。"
 artifact_companions.320.title:0 "拉比：为了保护谁"
 artifact_companions.320.desc:0 "保护对象与实际交战的对手已登记。拉比没有把一整个国家的人当作敌人，阿米特也没有因此接受无限追击。\n\n此次确认只提供30日有限舰队火力支援，不保证击杀，不复活舰船；之后恢复180日。拉比可以拒绝，原保护约定仍然有效，90日内不再催问。"
 ac_seth_fulfilled:0 "赛斯：已履行的愿望"
 ac_seth_hasty_relief:0 "赛斯：临时补给"
 ac_seth_misallocation:0 "赛斯：调配失误"
 ac_seth_emergency_aid:0 "赛斯：应急避难"
 ac_yutong_guard:0 "幽桐：同伴优先的射界"
 ac_yutong_precision:0 "幽桐：精准射界"
 ac_yutong_burst:0 "幽桐：一次越界支援"
 ac_rabi_protection:0 "阿米特：保护约定"
 ac_rabi_counter:0 "拉比与阿米特：一次有限反击"
 leader_trait_seth_commander:0 "羽蛇神杖：现场救援"
 leader_trait_seth_commander_desc:0 "赛斯可带领军用舰队，在已登记请求的殖民地星系亲自救援。与行政官身份共享同一人物、等级、任务与代价。请通过白夜馆的专属任务安排行动。"
