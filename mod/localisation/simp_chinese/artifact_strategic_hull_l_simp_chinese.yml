l_simp_chinese:
 tech_artifact_strategic_hull_engineering:0 "公共战略舰体工程"
 tech_artifact_strategic_hull_engineering_desc:0 "中庭级把分段装配和承载试验积累的能力用于公共造舰。结构、供能、武备与维护通道围绕共同的作战任务组织，分散工业交付的构件在船厂汇成能够持续服役的舰体。面对未知威胁，中央庭所展示的力量也包括支撑这类舰船建造、补充与整备的文明基础。\n\n§Y应用：§!开放中庭级战略舰及配套基础核心，可选择炮击或航母中段。建造需要本国承载定型记录、正在运营的大型工程营建场，以及擎天堡船厂或完工的巨型船坞。每艘正常支付合金、建造时间和维护；高阶供能、推进、航道与联合电脑仍需对应研究。"
 artifact_strategic_cruiser:0 "中庭级战略舰"
 artifact_strategic_cruiser_plural:0 "中庭级战略舰"
 artifact_strategic_cruiser_cap:0 "中庭级战略舰"
 artifact_strategic_cruiser_desc:0 "将公共承载工程用于远程火力或舰载机支援的大型作战平台。需要持续工业支持，正常建造、维修与改装。"
 ARTIFACT_STRATEGIC_BOW:0 "中庭级重炮舰首"
 ARTIFACT_STRATEGIC_MID_ARTILLERY:0 "中庭级炮击中段"
 ARTIFACT_STRATEGIC_MID_CARRIER:0 "中庭级航空中段"
 ARTIFACT_STRATEGIC_STERN:0 "中庭级承载舰尾"
 artifact_strategic_hull_requires_yard:0 "需要擎天堡船厂，或已完工／修复的巨型船坞。"
 artifact_strategic_hull_requires_qualification:0 "需要完成公共战略舰体研究，并通过舰体承载试验取得本国定型记录。"
 artifact_strategic_hull_requires_industry:0 "需要至少一处本国完成试运行、正常运营的大型工程营建场；停用、被占领、遭轰炸或继承他国设施不满足条件。"
 ARTIFACT_STRATEGIC_REACTOR:0 "中庭级承载反应堆"
 ARTIFACT_STRATEGIC_REACTOR_DESC:0 "适配公共战略舰体的基础供能单元。以已定型的承载结构分配负荷，为常规武备留出可用功率。"
 ARTIFACT_STRATEGIC_THRUSTER:0 "中庭级机动推进器"
 ARTIFACT_STRATEGIC_THRUSTER_DESC:0 "沿舰体骨架布置的基础推进单元。推进负荷通过承载框架传递，保持大型平台的可控机动。"
 ARTIFACT_STRATEGIC_COMPUTER_ARTILLERY:0 "中庭级炮击控制"
 ARTIFACT_STRATEGIC_COMPUTER_ARTILLERY_DESC:0 "为公共战略舰保留远程火力位置；需要更强的联合射击协调时，可改装联合战术核心提供的电脑。"
 ARTIFACT_STRATEGIC_COMPUTER_CARRIER:0 "中庭级航空控制"
 ARTIFACT_STRATEGIC_COMPUTER_CARRIER_DESC:0 "协调舰载机放飞与母舰交战位置。提高交战启动距离，不直接扩大各型武器射程，也不提供舰载机研究。"
 ARTIFACT_STRATEGIC_TERMINAL_REACTOR:0 "中庭级终解承载反应堆"
 ARTIFACT_STRATEGIC_TERMINAL_REACTOR_DESC:0 "将舰载相位供能应用于战略舰体的高负荷系统。额外功率伴随更高的造价与维护；基础舰体研究不能替代相位供能研究。"
 ARTIFACT_STRATEGIC_TERMINAL_THRUSTER:0 "中庭级终解承载推进器"
 ARTIFACT_STRATEGIC_TERMINAL_THRUSTER_DESC:0 "以相位机动研究改进战略舰的推进负荷分配。更快的亚光速机动需要更高功率，仍须完成对应推进研究。"
