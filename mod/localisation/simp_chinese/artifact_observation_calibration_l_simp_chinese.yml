l_simp_chinese:
 tech_artifact_cross_colony_calibration:0 "跨殖民地观测联校"
 tech_artifact_cross_colony_calibration_desc:0 "同一种扰动在不同殖民地留下的记录，也会混入仪器、环境和观测时序造成的差异。中央庭将长基线阵列与地方观测站纳入共同校核，在保留原始记录的同时辨认这些偏差，使一地积累的经验能够被别处的研究者继续使用。\n\n§Y应用：§!指定一处长基线基准端与另一星系的一处普通观测端，付费完成联校并保存本国档案。档案允许地方观测站按期投入物资，为同星本国轨道接口提供基准感知支持；后续模型复核也可读取这份成果。"
 decision_artifact_observation_register_source:0 "观测联校：登记基准端"
 decision_artifact_observation_register_source_desc:0 "将本殖民地的长基线阵列或相位预警阵列指定为基准端。每国同时一处，登记免费。"
 decision_artifact_observation_register_peer:0 "观测联校：登记对照端"
 decision_artifact_observation_register_peer_desc:0 "在基准端以外的另一星系，指定一处基准观测站或黑门观测站作为对照端。登记免费。"
 decision_artifact_observation_start:0 "观测联校：开始校核"
 decision_artifact_observation_start_desc:0 "一次投入600能源、300消费品、100合金，比较两个已指定端点的记录。六次有效月度后保存本国联校档案。"
 decision_artifact_observation_status:0 "观测联校：进度与档案"
 decision_artifact_observation_status_desc:0 "查看本国登记、有效月度进度和档案用途。查看不会支付物资或推进项目。"
 decision_artifact_observation_cancel:0 "观测联校：撤销本次登记"
 decision_artifact_observation_cancel_desc:0 "撤销本国这一次配对和未完成工作，随后可重新选端。已投入物资不退还。"
 decision_artifact_observation_apply:0 "观测联校：应用地方观测方案"
 decision_artifact_observation_apply_desc:0 "消耗300能源、100消费品，将档案应用于当地普通观测站，持续360日。需要同星本国轨道观测接口；已有有效长基线阵列的星系无需重复投入。"
 aoc.requires_source:0 "需要本国控制、未受轰炸的有效长基线阵列或相位预警阵列，且尚无其他联校登记或已完成档案。"
 aoc.requires_peer:0 "请先登记基准端，再在另一星系选择一处本国控制、未受轰炸的活动基准观测站或黑门观测站。每国同时仅一处对照端，启动后须先撤销才能重选。"
 aoc.requires_network:0 "需要两处原拥有者仍有效、分别位于不同星系的指定端点；两端须由本国控制、设施活动且未受轰炸，项目尚未启动或完成。"
 aoc.requires_application:0 "需要已完成的本国联校档案、有效普通观测站、同星本国控制的正常星港及轨道观测接口。当地已有应用窗口或同星已有有效长基线阵列时不能重复付费。"
 aoc.offer_source:0 "登记全国唯一的联校基准端。请到另一星系的普通观测站登记对照端。"
 aoc.offer_peer:0 "登记全国唯一的异星系对照端。两端均就绪后，可在任一本国殖民地选择“开始校核”。"
 aoc.offer_start:0 "开始§Y6次有效月度§!的记录校核。控制、设施或安全条件暂时失效时保留工作量；端点转让、消失或登记被清理后，在下一次月度核对撤销未完成项目，已付物资不返还。\n完成档案永久留在本国，可用于付费部署地方观测方案。"
 aoc.offer_cancel:0 "清除本次联校配对与工作量，不退还已投入物资；既有工程库存、已完成档案和地方应用窗口保留。"
 aoc.offer_apply:0 "当地普通观测站获得§Y360日§!应用窗口，可为同星本国轨道观测接口提供§G传感范围+1、超空间探测范围+2§!的基准支持。\n每座星港只取一份基准支持，不与完整阵列或其他地方端重复叠加。失控、轰炸或观测站失效时暂停收益，期限继续计算；转让后清除当地窗口。"
 aoc.title:0 "跨殖民地观测联校"
 aoc.intro:0 "尚未完成联校档案。\n\n先在长基线阵列或相位预警阵列登记基准端，再到另一星系的普通观测站登记对照端。随后通过行星决议支付物资，完成六次有效月度。\n\n成果将让普通观测站通过付费应用，为当地轨道接口提供基准支持。"
 aoc.pairing:0 "正在登记一对指定端点，尚未付款启动。\n\n可通过各行星的“联校基准端/对照端”修正确认角色。两端就绪后，选择“观测联校：开始校核”；需要重选时先撤销本次登记。若端点已丢失，月度核对会撤销旧登记。"
 aoc.working:0 "§Y校核进行中§!\n有效工作：[Root.aoc_work|0]/6。\n\n只核对两处指定端点，不自动寻找替代站，也不再次扣费。保持两端的本国控制、活动设施和安全条件，完成后档案将留在本国。"
 aoc.paused:0 "§Y校核暂停§!\n有效工作：[Root.aoc_work|0]/6。\n\n请恢复两端控制、结束轰炸并恢复相应观测设施。未完成工作保留，停工月份不补算；端点转让、消失或登记被清理后，下一次月度核对会撤销本项目。"
 aoc.archived:0 "§G联校档案已归档§!\n\n异地记录中的可测偏差已得到共同校核，档案永久保留在本国。\n\n在普通观测站所在殖民地选择“应用地方观测方案”，可投入300能源、100消费品，为同星本国轨道接口提供360日基准支持。应用按当地设施与控制条件生效，每座星港只算一份。档案也为后续模型复核保留来源。"
 aoc.close:0 "结束查看"
 aoc_tracking:0 "观测联校配对登记"
 aoc_tracking_desc:0 "本国已指定联校端点，可通过行星决议查看、启动或撤销。本记录不直接提供观测加成。"
 aoc_calibrating:0 "跨殖民地联校进行中"
 aoc_calibrating_desc:0 "已投入本次校核物资；两处指定端点均就绪时按有效月度推进。"
 aoc_calibration_archive:0 "跨殖民地联校档案"
 aoc_calibration_archive_desc:0 "已完成的公共观测成果保留在本国，允许地方观测站付费应用，并为后续模型复核提供记录。档案本身不附带全境传感或科研加成。"
 acs_observation_source:0 "联校基准端"
 acs_observation_source_desc:0 "本殖民地被指定为本国当前联校的基准端。临时停用/失控暂停工作，转让或消失使未完成项目在月度核对时撤销。"
 acs_observation_peer:0 "联校对照端"
 acs_observation_peer_desc:0 "本殖民地被指定为异星系对照端。工作须与本国指定基准端共同进行。"
 acs_observation_window:0 "地方观测方案应用窗口"
 acs_observation_window_desc:0 "在期限内，活动普通观测站可为同星本国轨道观测接口提供一份基准支持。失控、轰炸或观测站失效暂停收益，期限继续流逝；转让清除。"
