l_simp_chinese:
 tech_artifact_refuge_organization:0 "中央庭灾害统筹"
 tech_artifact_refuge_organization_desc:0 "把中央庭的疏散、安置与物资配给纳入社区日常预案。遭受轨道轰炸时，本国控制下正常运作的社区公共服务中心使当地稳定度增加5、舒适度需求降低10%，协助居民维持基本生活。"
 tech_artifact_city_functional_zoning:0 "城市功能分区"
 tech_artifact_city_functional_zoning_desc:0 "用塔罗演算协调研究、生产与民生设施的布局。解锁城市经济演算室，并允许在当地演算设施运行时付费选择一个规划方向；规划可以随建筑升级延续。"
 building_artifact_city_calculation_room:0 "城市经济演算室"
 building_artifact_city_calculation_room_desc:0 "为殖民地编制研究、生产或民生规划。每次选择消耗300能源和100凝聚力，同时只保留一个方向。设施停用、损坏或被占领时暂停收益，恢复后继续执行；可在原槽位升级为命运经济演算院。"
 decision_artifact_city_plan_research:0 "城市规划：科研分区"
 decision_artifact_city_plan_research_desc:0 "集中实验设施与公共资料，让研究团队共享服务。当地岗位的物理、社会和工程研究产出各增加5%。演算设施停用、损坏或被占领时暂停收益；升级保留规划。"
 decision_artifact_city_plan_production:0 "城市规划：生产分区"
 decision_artifact_city_plan_production_desc:0 "协调制造设施与原料流转。当地岗位的合金、消费品产出各增加5%，岗位矿物维护增加5%。演算设施停用、损坏或被占领时暂停收益；升级保留规划。"
 decision_artifact_city_plan_services:0 "城市规划：民生分区"
 decision_artifact_city_plan_services_desc:0 "让公共服务靠近居民生活区域。当地稳定度增加3、舒适度需求降低10%。演算设施停用、损坏或被占领时暂停收益；升级保留规划。"
 decision_artifact_city_plan_cancel:0 "取消城市规划"
 decision_artifact_city_plan_cancel_desc:0 "结束当地已选规划，撤回对应收益。取消不收费、不返还原投入；之后选择新方向时重新支付规划费用。"
 artifact_city_plan_research:0 "城市规划：科研分区"
 artifact_city_plan_research_desc:0 "已选择科研分区。由正常运作的城市经济演算室或命运经济演算院提供三类岗位研究产出各增加5%；设施失效时暂停，升级后延续。所有权改变时清除规划。"
 artifact_city_plan_production:0 "城市规划：生产分区"
 artifact_city_plan_production_desc:0 "已选择生产分区。由正常运作的演算设施提供岗位合金、消费品产出各增加5%，岗位矿物维护增加5%；设施失效时暂停，升级后延续。所有权改变时清除规划。"
 artifact_city_plan_services:0 "城市规划：民生分区"
 artifact_city_plan_services_desc:0 "已选择民生分区。由正常运作的演算设施提供稳定度增加3、舒适度需求降低10%；设施失效时暂停，升级后延续。所有权改变时清除规划。"
 artifact_city_plan_requires_control:0 "需要本国实际控制该殖民地。"
 artifact_city_plan_requires_active_facility:0 "需要正常运作的城市经济演算室或命运经济演算院。"
