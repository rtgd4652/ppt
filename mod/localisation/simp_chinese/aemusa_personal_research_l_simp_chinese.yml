l_simp_chinese:
 tech_aemusa_possibility_branch_modeling:0 "可能性分支建模"
 tech_aemusa_possibility_branch_modeling_desc:0 "爱缪莎把同一座工坊能走的几条路摆在一起。若把构件交给施工队，建筑可以更快完工。若留下做材料试验，研究人员就有机会弄清它们怎样承受负荷。两种未来依赖同一批物资，决定仍由承担后果的人来做。\n\n§H应用§!　在殖民地的「$decision_artifact_foundation_workshop$」中选择「比较工程分支」，可看到当下三种方案的开工资格、投入、工期与成果。"
 aemusa_p01.open:0 "比较工程分支"
 aemusa_p01.back:0 "返回工坊"
 aemusa_p01.ready:0 "§G可开工§!"
 aemusa_p01.unavailable:0 "§Y当前不可开工§!"
 tech_aemusa_selected_plan_reconfiguration:0 "选定方案重组"
 tech_aemusa_selected_plan_reconfiguration_desc:0 "工坊的支架已经搭好，装配也做了一半。爱缪莎从这些已经发生的事出发，算出接下来的工序还能怎样重排。工程人员可以保留共用的结构，调拨欠缺的构件，或把备好的精密构件用于更早交付普通营建。\n\n§H应用§!　在殖民地工坊的在建项目页，可付费将模块化营建与精密构件营建互相改选。每个项目可改选一次，已完成工时保留。"
 aemusa_p02.review:0 "查看营建改选工单"
 aemusa_p02.upgrade:0 "支付追加投入，改为精密构件营建。"
 aemusa_p02.simplify:0 "支付调度费，改为模块化营建。"
 aemusa_p02.close:0 "关闭工单。"
 aemusa_p02.finish_open_quote:0 "请先处理已打开的改选工单，或关闭它。"
 aemusa_p02.upgrade_cost:0 "[Root.GetAemusaUpgradeMinerals]矿物、[Root.GetAemusaUpgradeEnergy]能源、$@arf_workshop_precision_alloys$合金和$@arf_workshop_replan_unity$凝聚力"
 aemusa_p02.replanned_paid:0 "$artifact_foundation.cost_precision$、$@arf_workshop_replan_unity$凝聚力"
 aemusa_p02.quote_upgrade:0 "§Y[Root.GetName]§!的模块化营建已做 §Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§! 个有效工作月。\n\n改做精密构件营建，需追加§Y$aemusa_p02.upgrade_cost$§!。这笔费用包括两种方案的物资差价和调度费。已做工时全部保留，总工期照旧。完工后当地建筑建造速度提高§G15%§!，持续720天。\n\n本项目可改选一次。"
 aemusa_p02.quote_simplify:0 "§Y[Root.GetName]§!的精密构件营建已做 §Y[Root.arf_r1_progress]/[Root.arf_r1_required_work]§! 个有效工作月。\n\n改做模块化营建，需支付§Y$@arf_workshop_replan_unity$凝聚力§!调度费。已投入的全部精密材料留在工程中，已做工时照计。[Root.GetAemusaSimplifiedSchedule] 完工后当地建筑建造速度提高§G10%§!，持续720天。\n\n本项目可改选一次。"
 aemusa_p02.shorten_one_month:0 "剩余工期缩短一个有效工作月。"
 aemusa_p02.last_month:0 "已进入最后一个工作月。现场符合条件时，在下一次月检完工。"
 aemusa_p02.require_upgrade:0 "需要原拥有者安全控制、可施工的在途工坊项目，掌握两种营建所需研究，并备齐 $aemusa_p02.upgrade_cost$。"
 aemusa_p02.require_simplify:0 "需要原拥有者安全控制、可施工的在途精密营建，掌握模块化营建，并备有$@arf_workshop_replan_unity$凝聚力。"
 aemusa_p02.expired:0 "本单所指的在途工程已经结束或发生了变更。请回到该殖民地查看当前项目。"
 tech_aemusa_possibility_engineering_interface:0 "可能性工程接口"
 tech_aemusa_possibility_engineering_interface_desc:0 "面对同一颗荒芜星球，爱缪莎能沿着造境平台已有的观测，找出不同的水循环和热量分布。工程人员可以把水集中在少数绿洲，也可以令地热为寒冷地表供能。最终建成哪一种世界，要由筹措物资、在这里生活的人决定。\n\n§H应用§!　已有传承造境工程及运行态平台时，选中平台环绕的星球，在行星决议中查看干旱和极地两套配方。"
 decision_aemusa_choose_world_former_climate:0 "选择造境气候"
 decision_aemusa_choose_world_former_climate_desc:0 "查阅这颗荒芜星球的两套造境报价，确认一份后由其运行态平台实施。公共法令仍提供免费的大陆方案。"
 aemusa_p04.title:0 "造境平台的气候方案"
 aemusa_p04.arid_cost:0 "$@apm_p04_energy$能源和$@apm_p04_dry_crystals$稀有水晶"
 aemusa_p04.arctic_cost:0 "$@apm_p04_energy$能源和$@apm_p04_cold_gases$异星天然气"
 aemusa_p04.proposal:0 "目标为§Y[apm_p04_system.GetName]§!星系的§Y[apm_p04_planet.GetName]§!。该平台可以执行一份方案。\n\n§H$pc_arid$§!　$aemusa_p04.arid_cost$。将形成$d_searing_desert$、$d_ore_rich_caverns$和$d_marvelous_oasis$，额外支持2个发电、2个采矿、3个农业区划。\n\n§H$pc_arctic$§!　$aemusa_p04.arctic_cost$。将形成$d_geothermal_vent$、$d_rich_mountain$和$d_lichen_fields$，额外支持3个发电、3个采矿、1个农业区划。\n\n确认后目标立即成为可殖民世界。平台保留，殖民仍由你安排。"
 aemusa_p04.arid:0 "支付干旱方案费用，实施造境。"
 aemusa_p04.arctic:0 "支付极地方案费用，实施造境。"
 aemusa_p04.close:0 "收起方案。"
 aemusa_p04.handover_ready:0 "平台已可启用。打开它环绕的荒芜星球，在「$decision_aemusa_choose_world_former_climate$」中查看干旱与极地报价。原公共法令仍可免费造就大陆世界。"
 aemusa_p04.require_arid:0 "需要本国仍可启用原平台、目标仍适合造境，并备齐$aemusa_p04.arid_cost$。"
 aemusa_p04.require_arctic:0 "需要本国仍可启用原平台、目标仍适合造境，并备齐$aemusa_p04.arctic_cost$。"
 aemusa_p04.expired:0 "这份报价的原平台或目标已发生变化。请在可用的平台所环绕的荒芜星球上重新选择方案。"
 aemusa_p01.site_transferred:0 "工地的拥有者已变动。请在本国殖民地重新打开工坊。"
 aemusa_p01.compare_after_species_change:0 "本国保存着爱缪莎的工程模型。三项公共工坊工程目前均要求神器使主物种。\n\n$aemusa_p01.compare$"
 aemusa_p01.compare:0 "§Y[Root.GetName]§!的工坊一次承接一项工程。以下按本地项目名额、控制状况、设施、研究和库存核对。\n\n§H$artifact_foundation.start_basic_construction$§!　[Root.GetAemusaBasicConstructionAvailability]\n$artifact_foundation.offer_basic_construction$\n\n§H$artifact_foundation.start_precision_construction$§!　[Root.GetAemusaPrecisionConstructionAvailability]\n$artifact_foundation.offer_precision_construction$\n\n§H$artifact_foundation.start_materials_study$§!　[Root.GetAemusaMaterialsStudyAvailability]\n$artifact_foundation.offer_materials_study$"
