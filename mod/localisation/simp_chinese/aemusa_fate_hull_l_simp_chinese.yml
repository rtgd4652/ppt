l_simp_chinese:
 tech_aemusa_fate_hull_interface:0 "命运舰体接口"
 tech_aemusa_fate_hull_interface_desc:0 "走到命运的顶点之后，爱缪莎仍愿意为同行者留下能够亲自抵达的航路。择途级把她对可能性的判断接入舰载演算，再由舰员、武器和动力系统完成每一次实际行动。\n\n§H应用：§!解锁可自行配装的择途级重舰与五类专用核心。建造仍需中庭级工程定型、运行中的分段营建场，以及擎天堡或完工巨型船坞；武器与防护沿用已有研究。"
 aemusa_fate_escort:0 "择途级"
 aemusa_fate_escort_plural:0 "择途级"
 aemusa_fate_escort_cap:0 "择途级"
 aemusa_fate_escort_desc:0 "承接爱缪莎可能性演算的专属重舰，由舰员独立完成航行与战斗。可选六门大型武器，或在掌握主炮研究后改用一门X级主炮与四门大型武器。建造、维护和战损由现实中的船坞与物资承担。"
 AEMUSA_FATE_ESCORT_BOW:0 "择途级炮击舰首"
 AEMUSA_FATE_ESCORT_SPINAL_BOW:0 "择途级主炮舰首"
 AEMUSA_FATE_ESCORT_MID:0 "择途级火力中段"
 AEMUSA_FATE_ESCORT_STERN:0 "择途级航行舰尾"
 AEMUSA_FATE_ESCORT_REACTOR:0 "择途供能核心"
 AEMUSA_FATE_ESCORT_REACTOR_DESC:0 "为择途级舰载演算、航行与武装供能。研究资格来自爱缪莎个人路线，实际制造仍需要合金与维护物资。"
 AEMUSA_FATE_ESCORT_THRUSTER:0 "择途机动推进器"
 AEMUSA_FATE_ESCORT_THRUSTER_DESC:0 "把已选定的机动路径交给常规推进组件执行，提高航速与规避能力。"
 AEMUSA_FATE_ESCORT_HYPER_DRIVE:0 "择途航道引擎"
 AEMUSA_FATE_ESCORT_HYPER_DRIVE_DESC:0 "缩短进入超空间航道前的准备，并保留一次额外脱离战斗的机会。"
 AEMUSA_FATE_ESCORT_SENSOR:0 "择途观测阵列"
 AEMUSA_FATE_ESCORT_SENSOR_DESC:0 "持续比对目标轨迹与演算结果，为舰员提供可检验的射击数据。"
 AEMUSA_FATE_ESCORT_COMPUTER:0 "择途炮击演算器"
 AEMUSA_FATE_ESCORT_COMPUTER_DESC:0 "从仍可执行的方案中选择射击时机与接敌距离，提高本舰射速、射程与追踪。"
 aemusa_fate_hull_requires_personal_research:0 "需要合法完成爱缪莎正式转变与主线收束，并研究命运舰体接口；择途级使用机械舰体。"
