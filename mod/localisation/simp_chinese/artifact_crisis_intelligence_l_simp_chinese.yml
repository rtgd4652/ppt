l_simp_chinese:
 tech_artifact_crisis_signal_identification:0 "危机信号鉴别"
 tech_artifact_crisis_signal_identification_desc:0 "独立复测留下的边界回应，可以与现场记录中的异常模式相互对照。研究者为能够重现的征兆建立识别标准，让常规观测和公共防务知道应当注意什么，也清楚哪些解释仍然缺乏证据。\n\n§H应用§!：实际接触记录开放研究。配合已完成的模型复核，可在观测复核站或锚定试验场免费归档信号鉴别结果。此后在有本国轨道观测协同接口的星系，支付300能源／100消费品，使锚定试验场监听360日，为当地星港提供1点隐形探测；与预警阵列不叠加。档案供后续公共反制读取。"
 decision_artifact_crisis_signal_archive:0 "归档危机信号鉴别结果"
 decision_artifact_crisis_signal_archive_desc:0 "把已有模型复核与持久接触证据整理为本国公共识别档案。无需重新进行一轮月度调查。"
 decision_artifact_crisis_listening:0 "部署危机信号监听"
 decision_artifact_crisis_listening_desc:0 "在已有锚定试验场部署360日监听，与当地本国星港轨道观测接口协作。"
 aci.require_archive:0 "需要危机信号鉴别、规则锚定工程、已完成的高维模型复核档案，以及可复测的边界回应，或已初始化且至少一个真实归档的专属危机节点。当地观测复核站或锚定试验场须活跃，由本国拥有并控制且无轰炸；本国尚未归档本结果。"
 aci.offer_archive:0 "免费、立即保存本国危机信号鉴别档案。旧模型与接触资料保留，档案不随设施转让；公共监听和后续反制可读取这份资料。归档不等于反制成功或取得危机胜利。"
 aci.require_listening:0 "需要本国已完成信号鉴别、规则锚定工程与轨道观测协同研究，当地活跃锚定试验场、本国原拥有者控制且无轰炸。同星系须有本国拥有并控制的正常星港及轨道观测协同接口；没有尚未到期的监听窗口。"
 aci.offer_listening:0 "基础投入§Y300能源、100消费品§!，监听§Y360日§!，通过当地有效本国轨道接口提供§G1点隐形探测§!。与同星系预警阵列或其他监听点合计只提供一份。失控或设施失效时停止供源，窗口继续计时；恢复后在剩余期限内继续，转让/毁灭清理。"
 aci_signal_identified:0 "危机信号鉴别档案"
 aci_signal_identified_desc:0 "本国已用完成的模型复核对照真实接触证据，建立公共信号识别资料。可在正常锚定试验场部署地方监听，并为后续反制研究提供资料。\n\n档案不揭示未发生事件，也不代表已解释黑门本质、取得危机胜利或授予个人命运权限。"
 acs_crisis_listening_window:0 "危机信号监听窗口"
 acs_crisis_listening_window_desc:0 "已支付360日地方监听。当地有效本国轨道接口读取一份隐形探测支持，与预警阵列不叠加。失效时停止供源但继续计时，转让或毁灭清理；国家信号档案保留。"
