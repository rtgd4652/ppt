l_simp_chinese:
 tech_artifact_public_artifact_theory:0 "公共神器理论"
 tech_artifact_public_artifact_theory_desc:0 "神器研究逐渐积累了可以相互检验的模型、方法与适用边界。中央庭将这些认识整理为公共工程标准，使异常研究的成果能够走出少数实验室，并继续接受来自实际应用的修正。\n\n§H应用§!：在高维观测复核站汇编已完成的模型与至少一种已归档的样本或材料方法，免费取得本国公共工程资格。工程物资集成场和规则锚定试验场随后可按原费用复现对应方法；后续公共反制仍需独立研究与危机资料。"
 decision_artifact_public_theory_compile:0 "汇编公共神器工程方法"
 decision_artifact_public_theory_compile_desc:0 "将已经复核的模型与公共档案中的实验方法编订为可供工程现场采用的标准。汇编即刻完成；原有档案和现场工作保持各自进度。"
 apt.requires_compile:0 "需要$tech_artifact_public_artifact_theory$、$tech_artifact_public_reproduction_protocol$、真实完成的模型复核档案，以及本国至少一种已归档的样本或材料方法。当地高维观测复核站必须活跃，由本国拥有并控制且未受轰炸；本国尚未完成汇编。"
 apt.offer_compile:0 "免费、立即归档本国公共工程资格；不消耗已有方法、模型或物资，不另占项目名额。掌握相应场地研究后，工程物资集成场和规则锚定试验场可通过公共项目页，支付300能源／150消费品、工作6次有效月度，复现已经归档的对应方法。"
 apt_public_engineering_methods:0 "公共神器工程方法"
 apt_public_engineering_methods_desc:0 "已汇编本国模型复核与公共实验方法。有效工程物资集成场或规则锚定试验场可复用已归档方法；研究、费用、当地名额和现场条件仍须满足。其他未归档方法不会自动获得。\n\n该知识保留在本国，场地失效或转让不会转移档案。它也为后续公共反制提供理论资格，反制、危机进度与个人转变各自独立。"
