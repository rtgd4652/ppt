l_simp_chinese:
 # 简体中文本地化；冒号前为键名，冒号后为游戏中显示的文本。
 ARTIFACT_USER:0 "神器使"
 ARTIFACT_USER_desc:0 "与神器共鸣的神秘有机生命。只有以神器使为主物种的帝国，才能通过法令召唤爱缪莎。"
 trait_artifact_resonance:0 "神器使契约"
 trait_artifact_resonance_desc:0 "与神器缔结契约的守护者，能够在危机中维持都市日常。陆军伤害：§G+10%§!\n人口舒适度使用：§G-10%§!\n宜居性：§G+5%§!"
 origin_artifact_resonance:0 "交界都市守望者"
 origin_artifact_resonance_desc:0 "黑门阴影笼罩交界都市。中央庭将与神器缔结契约的年轻人集结起来，在日常与灾厄交错的七日轮回中守护家园。"
 origin_artifact_resonance_effects:0 "$ORIGIN$: $origin_artifact_resonance$\n$EFFECTS_TXT$\n- 母星替换为专属 §Y交界都市§!\n- 首都获得一座 §Y中央庭指挥中心§!\n- 首都获得一个 §Y学园巡查区§!\n- 主物种获得 §Y神器使契约§! 特质"
 pc_artifact_crossing_city:0 "交界都市"
 pc_artifact_crossing_city_desc:0 "一座在黑门威胁与日常生活之间艰难维系的都市。中央庭、学园与商业街共同构成这颗星球的心跳。"
 building_artifact_sanctum:0 "中央庭指挥中心"
 building_artifact_sanctum_desc:0 "中央庭在当地的行动中枢，负责指挥神器使、疏散民众并维持黑门警戒线。"
 district_artifact_nexus:0 "学园巡查区"
 district_artifact_nexus_desc:0 "由学园、商业街与巡查站构成的生活区。研究、休憩与对灾厄的日常戒备在这里并存。"
 EMPIRE_DESIGN_artifact_user_central_court:0 "交界都市中央庭"
 PRESCRIPTED_adjective_artifact_user_central_court:0 "中央庭"
 PRESCRIPTED_ship_prefix_artifact_user_central_court:0 "庭"
 PRESCRIPTED_species_name_artifact_user:0 "神器使"
 PRESCRIPTED_species_plural_artifact_user:0 "神器使"
 PRESCRIPTED_species_adjective_artifact_user:0 "神器使"
 PRESCRIPTED_planet_name_artifact_user_central_court:0 "交界都市"
 PRESCRIPTED_system_name_artifact_user_central_court:0 "交界星系"
 PRESCRIPTED_ruler_name_artifact_user_central_court:0 "中央庭统筹官"
 # 法令 UI 会在脚本 ID 前自动添加 edict_ 前缀，因此这里保留双 edict_ 前缀。
 edict_edict_summon_stellar_administrator:0 "召唤星海行政官"
 edict_edict_summon_stellar_administrator_desc:0 "花费 £unity£500 凝聚力，招募一名 11 级官员领袖：爱缪莎。她会在 30 级时解锁成长版立绘，并可以通过通讯改任其他职位。"
 edict_edict_contact_aemusa:0 "联络爱缪莎"
 edict_edict_contact_aemusa_desc:0 "与爱缪莎建立通讯，并为她重新选择职责。"
 edict_edict_artifact_research_archive:0 "调阅中央庭科技档案"
 edict_edict_artifact_research_archive_desc:0 "花费 £unity£300，立即取得中央庭的完整基础科技档案：§Y塔罗演算§!、§Y黑门观测体系§!与§Y神器锻造§!。这会直接解锁对应的建筑、武器、装甲与辅助核心前置。"
 aemusa:0 "爱缪莎"
 aemusa_leader_background:0 "§Y爱缪莎§!来自§Y中央庭§!，是守护交界都市的§Y中央庭七人众§!之一。她以塔罗与命运之力回应黑门危机，并在群星之间继续守望众人的未来。"
 leader_trait_aemusa_commander:0 "逆命之牌"
 leader_trait_aemusa_commander_desc:0 "舰队武器伤害：§G+30%§!\n舰队武器射速：§G+20%§!"
 leader_trait_aemusa_official:0 "命运织网"
 leader_trait_aemusa_official_desc:0 "稳定度：§G+10§!\n舒适度：§G+10§!"
 leader_trait_aemusa_scientist:0 "星图演算"
 leader_trait_aemusa_scientist_desc:0 "科学船调查速度：§G+50%§!\n异常现象研究速度：§G+50%§!"
 aemusa_dialogue.10.title:0 "来自爱缪莎的通讯"
 aemusa_dialogue.10.desc:0 "“命运的牌面已经翻开。告诉我，接下来该由我走向战场、治理星球，还是探索未知？”"
 aemusa_dialogue.10.commander:0 "请担任指挥官——让敌人见证逆命之牌。"
 aemusa_dialogue.10.official:0 "请担任行政官——让秩序织成新的命运。"
 aemusa_dialogue.10.scientist:0 "请担任科学家——让群星回答所有疑问。"
 aemusa_dialogue.10.goodbye:0 "暂时不调整职责。"
 # 中央庭守望传统、飞升与科技。
 tradition_artifact_court:0 "中央庭守望"
 tradition_artifact_court_desc:0 "黑门之外是未知的灾厄，黑门之内仍有必须守护的日常。中央庭以神器使为纽带，在七日的轮回里记录命运、守望城市，并将这份意志带向群星。"
 tr_artifact_court_adopt:0 "中央庭集结"
 tr_artifact_court_adopt_desc:0 "§Y领袖经验获取§!：§G+10%§!"
 tr_artifact_court_finish:0 "守望不息"
 tr_artifact_court_finish_desc:0 "§Y法令经费§!：§G+50§!\n§Y飞升槽位§!：§G+1§!"
 tr_artifact_court_black_gate_watch:0 "黑门守望"
 tr_artifact_court_black_gate_watch_desc:0 "§Y陆军伤害§!：§G+15%§!\n§Y稳定度§!：§G+2§!"
 tr_artifact_court_seven_guardians:0 "七人众协同"
 tr_artifact_court_seven_guardians_desc:0 "§Y指挥官上限§!：§G+1§!\n§Y行政官上限§!：§G+1§!"
 tr_artifact_court_tarot_archive:0 "塔罗档案"
 tr_artifact_court_tarot_archive_desc:0 "§Y研究选项§!：§G+1§!\n§Y科学家初始等级§!：§G+1§!"
 tr_artifact_court_city_network:0 "都市联络网"
 tr_artifact_court_city_network_desc:0 "§Y凝聚力产出§!：§G+10%§!\n§Y人口舒适度使用§!：§G-5%§!"
 tr_artifact_court_final_day:0 "第七日的约定"
 tr_artifact_court_final_day_desc:0 "§Y境内舰船射速§!：§G+10%§!\n§Y装甲硬化§!：§G+10%§!"
 ap_artifact_court_destiny:0 "命运主宰"
 ap_artifact_court_destiny_desc:0 "中央庭不再只守望一座都市。神器使将以契约与塔罗演算塑造星海的未来。\n\n§Y法令经费§!：§G+100§!\n§Y境内舰船射速§!：§G+15%§!\n§Y装甲硬化§!：§G+15%§!\n§Y领袖池容量§!：§G+1§!"
 tech_artifact_tarot_calculation:0 "塔罗演算"
 tech_artifact_tarot_calculation_desc:0 "神器使的直觉并非不可理解的奇迹。通过记录无数牌阵与抉择，中央庭正在建立一门能够预判危险分歧的科学。"
 tech_artifact_black_gate_observation:0 "黑门观测体系"
 tech_artifact_black_gate_observation_desc:0 "将交界都市对黑门的长期观测扩展为跨星系预警网络，使灾厄的征兆无处遁形。"
 tech_artifact_relic_fabrication:0 "神器锻造"
 tech_artifact_relic_fabrication_desc:0 "把神器共鸣的结构稳定地复现于舰船材料之中。星舰将获得如契约者般回应危机的能力。"
 building_artifact_black_gate_observatory:0 "黑门观测站"
 building_artifact_black_gate_observatory_desc:0 "中央庭以塔罗与高维传感器交叉验证黑门异动，为都市与星际舰队提供预警。"
 building_artifact_relic_workshop:0 "中央庭神器工坊"
 building_artifact_relic_workshop_desc:0 "在严格管控下处理神器碎片与相位合金，为神器使舰队制造专属组件。"
 SMALL_ARTIFACT_TAROT_RAY:0 "小型命运塔罗射线"
 SMALL_ARTIFACT_TAROT_RAY_DESC:0 "以塔罗牌阵锁定目标未来分歧的能量武器，对装甲目标尤其有效。"
 MEDIUM_ARTIFACT_TAROT_RAY:0 "中型命运塔罗射线"
 MEDIUM_ARTIFACT_TAROT_RAY_DESC:0 "$SMALL_ARTIFACT_TAROT_RAY_DESC$"
 LARGE_ARTIFACT_TAROT_RAY:0 "大型命运塔罗射线"
 LARGE_ARTIFACT_TAROT_RAY_DESC:0 "$SMALL_ARTIFACT_TAROT_RAY_DESC$"
 SMALL_ARTIFACT_FATE_ARMOR:0 "小型命运织装甲"
 SMALL_ARTIFACT_FATE_ARMOR_DESC:0 "由神器碎片和相位金属编织的装甲，可削弱一部分穿甲打击。"
 MEDIUM_ARTIFACT_FATE_ARMOR:0 "中型命运织装甲"
 MEDIUM_ARTIFACT_FATE_ARMOR_DESC:0 "$SMALL_ARTIFACT_FATE_ARMOR_DESC$"
 LARGE_ARTIFACT_FATE_ARMOR:0 "大型命运织装甲"
 LARGE_ARTIFACT_FATE_ARMOR_DESC:0 "$SMALL_ARTIFACT_FATE_ARMOR_DESC$"
 ARTIFACT_SEVEN_DAY_CORE:0 "七日演算核心"
 ARTIFACT_SEVEN_DAY_CORE_DESC:0 "以无数次未来分歧推演修正火控与闪避的辅助演算核心。"
 ARTIFACT_DESTINY_LORD_REACTOR:0 "命运主宰反应堆"
 ARTIFACT_DESTINY_LORD_REACTOR_DESC:0 "命运之主专属的星海级能源核心。它以命运观测塔的演算协议协调巨量能量输出，足以维持全部泰坦级与超大型武器的同时待命。"
 ARTIFACT_DESTINY_LORD_SENSOR:0 "命运观测阵列"
 ARTIFACT_DESTINY_LORD_SENSOR_DESC:0 "命运之主专属的超远程传感器，将命运观测塔的预警信息转化为舰队火控解算。"
 ARTIFACT_DESTINY_LORD_DRIVE:0 "命运跃迁核心"
 ARTIFACT_DESTINY_LORD_DRIVE_DESC:0 "命运之主专属超光速核心。它以演算出的最优航路引导舰队跨越星海。"
 ARTIFACT_DESTINY_LORD_THRUSTER:0 "命运折跃推进器"
 ARTIFACT_DESTINY_LORD_THRUSTER_DESC:0 "命运之主专属推进器，通过短暂折跃修正庞大舰体的机动轨迹。"
 ARTIFACT_DESTINY_LORD_COMPUTER:0 "命运演算作战电脑"
 ARTIFACT_DESTINY_LORD_COMPUTER_DESC:0 "将命运观测塔的演算结果转化为火控指令的核心作战电脑。"
 ARTIFACT_AURA_GUARDIAN_MATRIX:0 "守望者矩阵"
 ARTIFACT_AURA_GUARDIAN_MATRIX_DESC:0 "友军强化光环：同星系友军舰船射速 §G+15%§!、护盾 §G+20%§!、闪避 §G+10%§!。"
 ARTIFACT_AURA_BLACK_GATE_SUPPRESSION:0 "黑门压制场"
 ARTIFACT_AURA_BLACK_GATE_SUPPRESSION_DESC:0 "敌军削弱光环：同星系敌方舰船射速 §R-15%§!、护盾 §R-25%§!、航速 §R-20%§!。"
 EXTRA_LARGE_ARTIFACT_TAROT_JUDGEMENT:0 "审判塔罗主炮"
 EXTRA_LARGE_ARTIFACT_TAROT_JUDGEMENT_DESC:0 "命运之主的 X 槽主炮。塔罗阵列锁定目标的命运分歧后，以高能射线裁定其结局。"
 TITANIC_ARTIFACT_FATE_DOMINION:0 "主宰命运之光"
 TITANIC_ARTIFACT_FATE_DOMINION_DESC:0 "命运之主的 T 槽终极主炮。其射线以压倒性的能量贯穿敌方舰队，为守望者开辟未来。"
 NAME_Destiny_Lord_Reborn:0 "命运之主·重构体"
 NAME_Destiny_Lord_Reborn_Fleet:0 "命运重构舰队"
 # 命运观测塔与命运之主。
 tech_artifact_fate_observatory:0 "命运观测塔"
 tech_artifact_fate_observatory_desc:0 "将黑门观测阵列、中央庭档案与塔罗演算核心汇聚为一座巨构。它能够守望整片星海的灾厄征兆。"
 tech_artifact_destiny_lord:0 "命运之主舰体工程"
 tech_artifact_destiny_lord_desc:0 "以命运观测塔的演算结果统合超旗舰的武器、装甲与航行系统。这艘舰并非为了战争而存在，而是为了让灾厄无从抵达应被守护之人。"
 artifact_fate_observatory_0:0 "命运观测塔：奠基"
 artifact_fate_observatory_0_DESC:0 "中央庭正在部署第一座跨星系命运观测设施。"
 artifact_fate_observatory_1:0 "命运观测塔：黑门阵列"
 artifact_fate_observatory_1_DESC:0 "初步完成的传感阵列开始记录星海中的不稳定征兆。"
 artifact_fate_observatory_2:0 "命运观测塔：塔罗演算"
 artifact_fate_observatory_2_DESC:0 "无数牌阵与高维数据被同时演算，未来的轮廓逐渐清晰。"
 artifact_fate_observatory_3:0 "命运观测塔"
 artifact_fate_observatory_3_DESC:0 "中央庭守望星海的至高之塔。它以黑门观测、神器共鸣与塔罗演算为文明争取每一个可能的明天。"
 destiny_lord:0 "命运之主"
 destiny_lord_plural:0 "命运之主"
 DESTINY_LORD_BOW:0 "命运之主：主宰舰艏"
 DESTINY_LORD_MID:0 "命运之主：星海舰体"
 DESTINY_LORD_STERN:0 "命运之主：演算舰艉"
